ッシュなコンテキストが有効なのはレビューや検証を第三者的に行わせたい場面であり、修正のたびにセッションを捨てれば直前の設計上の制約を毎回説明し直す羽目になる。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q021", "statement_id": "D3-5", "angle": "tradeoff", "scenario_ref": 4, "scenario": "An engineer new to a large codebase must add an offline sync layer for the mobile client, a domain they have not worked in. They can describe the goal in two sentences but have not thought through conflict resolution, retry policy, or partial-failure behavior. A demo is in three days.", "scenario_ja": "大規模なコードベースに不慣れなエンジニアが、経験のない領域であるモバイルクライアント向けのオフライン同期層を追加しなければならない。目標は2文で説明できるが、コンフリクト解決・リトライ方針・部分的失敗時の挙動については詰められていない。デモは3日後に控えている。", "question": "Given the deadline, which approach best balances speed against the risk of building the wrong thing?", "question_ja": "この納期を踏まえたとき、速さと「間違ったものを作ってしまうリスク」を最もよく両立させる進め方はどれか。", "choices": {"A": "Start with the minimal prompt and ask Claude to interview you in detail on edge cases and tradeoffs, write the agreed spec to a file, then implement it in a fresh session.", "B": "Give Claude the two-sentence goal and let it implement immediately, then course-correct with Esc and rewind whenever the running code behaves wrongly in the demo path.", "C": "Ask Claude to produce three competing sync designs with full implementations, run all three against the demo scenario, and keep whichever one survives the walkthrough.", "D": "Write the sync design decisions into CLAUDE.md as you discover them, so each subsequent prompt inherits the accumulated decisions without a separate spec file."}, "choices_ja": {"A": "最小限のプロンプトから始めて、エッジケースとトレードオフについて Claude に詳細なインタビューをさせ、合意した仕様をファイルに書き出し、新しいセッションでそれを実装する。", "B": "2文のゴールだけ渡して即座に実装させ、デモ経路で挙動がおかしくなるたびに Esc と rewind で軌道修正する。", "C": "競合する3つの同期設計を実装まで含めて作らせ、3つともデモシナリオで動かし、通ったものを採用する。", "D": "同期設計の判断を、思いついた順に CLAUDE.md へ書き足していき、以後のプロンプトが蓄積された判断を引き継ぐようにする（仕様ファイルは作らない）。"}, "answer": "A", "explanation_ja": "A が正解。公式ベストプラクティスは、大きめの機能では最小限のプロンプトから Claude にインタビューさせ、技術実装・UI/UX・エッジケース・トレードオフなど自分が考えていなかった点を引き出させ、仕様を SPEC.md に書き出し、実装はクリーンなコンテキストの新セッションで行う手順を推奨している。不慣れな領域ほど「仕様を精密にする時間」は実装を見張る時間より報われる。B は誤り。Esc や rewind による軌道修正は有効な手段だが、設計判断が未定のまま実装を進めると、デモ経路で見える不具合だけを潰す場当たり対応になり、コンフリクト解決のような設計レベルの欠落は最後まで表面化しない。C は誤り。3案を実装まで作るのは3日という制約に対してコストが釣り合わず、設計判断が未定のまま3つ作っても選定基準自体が定まらない。D は誤り。CLAUDE.md は毎セッション読み込まれる短く広く適用される内容のための場所で、単一機能の設計メモで肥大化させると本来の指示が無視される原因になる。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q022", "statement_id": "D3-5", "angle": "design-choice", "scenario_ref": 6, "scenario": "A pipeline uses Claude Code to maintain a script that extracts invoice JSON from scanned PDFs. Most fields are fine, but when a line item has no unit price the extractor sometimes emits 0, sometimes the string \"N/A\", and sometimes drops the key. The developer has already told Claude twice, in prose, to \"handle missing unit prices consistently\" and the output still varies between runs.", "scenario_ja": "あるパイプラインでは、スキャンした PDF から請求書の JSON を抽出するスクリプトの保守に Claude Code を使っている。大半のフィールドは問題ないが、明細行に単価がない場合、抽出結果が 0 になったり文字列 \"N/A\" になったり、キーごと欠落したりする。開発者はすでに2度、散文で「単価欠損を一貫して扱え」と伝えたが、実行ごとに出力が揺れたままだ。", "question": "What should the developer include in the next prompt to make the behavior converge?", "question_ja": "挙動を収束させるために、開発者は次のプロンプトに何を含めるべきか。", "choices": {"A": "A longer prose specification of the missing-value policy, restating it in stricter and more formal wording than the previous two attempts.", "B": "An instruction to always double-check the extraction against the source PDF and report its confidence for every field it emits.", "C": "Two or three concrete sample inputs paired with the exact JSON expected for each, including a line item with no unit price.", "D": "The JSON Schema for the invoice object, with unit_price typed as a nullable number, and nothing else about the missing case."}, "choices_ja": {"A": "欠損値ポリシーについて、これまでの2回よりも厳密かつ形式的な言い回しで書き直した、より長い散文の仕様。", "B": "抽出結果を必ず元の PDF と突き合わせて再確認し、出力する各フィールドについて確信度を報告せよという指示。", "C": "具体的な入力サンプル2〜3件と、それぞれに対して期待される JSON そのもの（単価のない明細行を含む）。", "D": "請求書オブジェクトの JSON Schema（unit_price は nullable number）だけを渡し、欠損ケースについては何も書かない。"}, "answer": "C", "explanation_ja": "C が正解。散文の記述が実行ごとに異なる解釈をされている状態では、期待する変換を伝える最も効果的な手段は具体的な入出力例である。欠損単価を含む実入力と、それに対応する厳密な期待 JSON を2〜3組示せば、null を出すのか 0 を出すのかキーを落とすのかが一意に定まり、そのまま回帰テストの土台にもなる。A は誤り。同じ散文をより長く厳密に書き直しても、解釈の余地という失敗要因そのものは変わらず、すでに2回失敗している手段の反復にすぎない。B は誤り。確信度の自己申告は検証可能な合否シグナルではなく、公式も成功の主張ではなくテスト出力などの証拠を示させるべきだとしている。しかも欠損時に何を出すべきかは依然として未定義のまま。D は誤り。nullable なスキーマは null を「許容」するだけで、単価欠損時に null を選ぶのか 0 を選ぶのかを規定しない。欠損ケースの期待値を示さない限り揺れは残る。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q023", "statement_id": "D3-1", "angle": "troubleshoot", "scenario_ref": 2, "scenario": "A team uses Claude Code for refactoring in a monorepo with a root ./CLAUDE.md and a nested services/payments/CLAUDE.md holding payment-specific conventions. During a long refactoring session the developer runs /compact, and afterwards Claude keeps honoring the root build and style rules but starts violating the payment-specific conventions again. Before compaction both sets of rules were followed, and /memory listed both files.", "scenario_ja": "あるチームは、ルートに ./CLAUDE.md、ネストされた services/payments/CLAUDE.md に決済固有の規約を置いたモノレポで、Claude Code をリファクタリングに使っている。長いリファクタリングのセッション中に開発者が /compact を実行すると、その後 Claude はルートのビルド規約・スタイル規約は守り続けるのに、決済固有の規約を再び破り始める。圧縮の前は両方の規約が守られており、/memory は両方のファイルを列挙していた。", "question": "What is the most likely root cause of the payment-specific conventions being dropped after /compact?", "question_ja": "/compact の後に決済固有の規約が失われる根本原因として最も可能性が高いものはどれか。", "choices": {"A": "Compaction drops every CLAUDE.md file from context, so only instructions repeated in conversation survive the summarization step.", "B": "The nested CLAUDE.md exceeded the 200-line / 25KB load limit, so compaction truncated it while leaving the smaller root file intact.", "C": "Project-root CLAUDE.md is re-read from disk and re-injected after compaction, but nested CLAUDE.md files are not re-injected until Claude next reads a file in that subdirectory.", "D": "Nested CLAUDE.md files are loaded with lower priority than the root file, so the summarizer discards them whenever the two files give overlapping guidance."}, "choices_ja": {"A": "圧縮はすべての CLAUDE.md をコンテキストから落とすため、会話中で繰り返した指示だけが要約を生き延びる。", "B": "ネストされた CLAUDE.md が 200行/25KB の読み込み上限を超えたため、圧縮時に切り詰められ、小さいルートのファイルだけが残った。", "C": "プロジェクトルートの CLAUDE.md は圧縮後にディスクから読み直されて再注入されるが、ネストされた CLAUDE.md は次にそのサブディレクトリのファイルを Claude が読むまで再注入されない。", "D": "ネストされた CLAUDE.md はルートより低い優先度で読み込まれるため、両者の指示が重なると要約処理が前者を捨てる。"}, "answer": "C", "explanation_ja": "C が正解。公式ドキュメントは「プロジェクトルートの CLAUDE.md は圧縮を生き延びる。/compact の後に Claude がディスクから読み直して再注入する。サブディレクトリのネストされた CLAUDE.md は自動では再注入されず、そのサブディレクトリのファイルを次に読んだときに再読み込みされる」と明記しており、ルートの規約だけが守られ続ける今回の症状と完全に一致する。A は誤り。ルートの CLAUDE.md は再注入されるので「すべて落ちる」わけではなく、実際にルートの規約は守られている。B は誤り。200行/25KB の上限は自動メモリの MEMORY.md にのみ適用され、CLAUDE.md は長さにかかわらず全文が読み込まれる（長いと遵守率が落ちるだけ）。D は誤り。複数の CLAUDE.md は互いを上書きせず連結され、ルートから作業ディレクトリへ向かう順に並ぶ（むしろネスト側が後に読まれる）。要約処理が優先度で捨てるという仕組みは存在しない。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q024", "statement_id": "D3-1", "angle": "find-error", "scenario_ref": 2, "scenario": "A code generation team's root CLAUDE.md has grown to about 700 lines and Claude increasingly ignores rules buried in the middle of it. A developer proposes this fix: keep every existing line, but move the content into docs/style.md, docs/testing.md, and docs/frontend.md, then replace CLAUDE.md with three @docs/... import lines, arguing this will cut startup context usage and restore adherence.", "scenario_ja": "あるコード生成チームのルート CLAUDE.md は約700行に膨れ上がり、その中ほどに埋もれたルールを Claude がますます無視するようになっている。ある開発者が次の修正案を出した。既存の行はすべて残したうえで内容を docs/style.md、docs/testing.md、docs/frontend.md に移し、CLAUDE.md を3行の @docs/... インポートに置き換える。これで起動時のコンテキスト消費が減り、遵守率が戻るという主張である。", "question": "What is the flaw in this proposal?", "question_ja": "この提案の誤りはどこにあるか。", "choices": {"A": "@import syntax only resolves paths relative to the working directory, so docs/ files referenced from the project root will silently fail to load.", "B": "Imported files are expanded and loaded into context at launch, so splitting the same content across imports organizes it but does not reduce context or fix adherence.", "C": "Imports are capped at a maximum depth of four hops, so the third import line will be skipped and its rules will never reach Claude's context.", "D": "Files referenced with @ syntax are loaded lazily on demand, so rules the team expects in every session will only apply after Claude happens to read them."}, "choices_ja": {"A": "@import 構文はワーキングディレクトリ基準でしかパスを解決しないため、プロジェクトルートから参照した docs/ のファイルは黙って読み込みに失敗する。", "B": "インポートされたファイルは起動時に展開されてコンテキストへ読み込まれるため、同じ内容をインポートに分割しても整理にはなるがコンテキストは減らず、遵守率の問題も直らない。", "C": "インポートは最大4ホップの深さ制限があるため、3行目のインポートはスキップされ、そのルールは Claude のコンテキストに届かない。", "D": "@ 構文で参照したファイルは必要になった時点で遅延読み込みされるため、毎セッション効かせたいルールが Claude がたまたま読んだ後にしか適用されない。"}, "answer": "B", "explanation_ja": "B が正解。公式ドキュメントは「インポートされたファイルは、それを参照する CLAUDE.md と一緒に起動時に展開されコンテキストへ読み込まれる」「@path インポートへの分割は整理には役立つが、インポート先も起動時に読み込まれるためコンテキストは減らない」と明言している。分量が原因の遵守低下を直すには、paths フロントマターを付けた `.claude/rules/` のパススコープ化か、不要な記述の削除が必要。A は誤り。相対パスは「ワーキングディレクトリではなく、インポート元のファイル」を基準に解決されるので、ルートの CLAUDE.md から docs/ を参照すれば正しく読み込まれる。C は誤り。4ホップの制限はインポートの再帰的な深さ（インポート先がさらにインポートする連鎖）に対するもので、同一ファイル内のインポート行の本数の制限ではない。D は誤り。遅延読み込みされるのはサブディレクトリの CLAUDE.md や自動メモリのトピックファイルであり、@ インポートは起動時に読み込まれる。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q001", "statement_id": "D4-1", "scenario": "A prompt embeds a 20-page contract followed by analysis instructions. Claude sometimes treats sentences from the contract as instructions, and sometimes ignores parts of the actual instructions.", "scenario_ja": "あるプロンプトは20ページの契約書の後に分析指示を埋め込んでいる。Claudeは契約書中の文をときどき指示として扱ってしまい、また実際の指示の一部を無視してしまうこともある。", "question": "What is the most effective structural fix?", "question_ja": "最も効果的な構造上の修正は何か？", "choices": {"A": "Move the instructions to the middle of the contract so they are harder to miss", "B": "Wrap the contract in XML tags like <contract>...</contract> and the instructions in <instructions>...</instructions> so content and directives are unambiguous", "C": "Convert the entire prompt to uppercase for emphasis", "D": "Split the request into 20 separate API calls, one page each"}, "choices_ja": {"A": "見逃されにくいよう、指示を契約書の中央に移動する", "B": "契約書を<contract>...</contract>のようなXMLタグで囲み、指示を<instructions>...</instructions>で囲むことで、コンテンツと指示を明確に区別する", "C": "強調のためプロンプト全体を大文字に変換する", "D": "リクエストを1ページごとの20個の別々のAPI呼び出しに分割する"}, "answer": "B", "explanation_ja": "データ（文書）と指示の混同は XML タグによる構造化で解決するのが定石。タグは Claude が特別扱いするマーカーとして機能し、パーツの境界を明確にする。A/C は効果がなく、D はコストと文脈分断の問題を生む。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/use-xml-tags", "pack": "v1"}, {"id": "D4-q002", "statement_id": "D4-2", "scenario": "A classification prompt describes the desired output format in words ('Respond with the category name, a pipe, then a confidence from 0-100'), but Claude's outputs vary: sometimes prose, sometimes different separators.", "scenario_ja": "ある分類プロンプトは、望ましい出力形式を言葉で説明している（「カテゴリ名、パイプ記号、0〜100の信頼度で応答してください」）が、Claudeの出力はばらつく：あるときは散文で、あるときは異なる区切り文字を使う。", "question": "What is the most reliable prompt-level improvement?", "question_ja": "最も信頼できるプロンプトレベルの改善は何か？", "choices": {"A": "Add 3-5 few-shot examples showing exact input → output pairs in the desired format", "B": "Repeat the format description three times in the prompt", "C": "Raise max_tokens so Claude has room to comply", "D": "Add 'this is very important' before the format description"}, "choices_ja": {"A": "望ましい形式での正確な入力→出力のペアを示す3〜5個のfew-shot例を追加する", "B": "プロンプト内で形式の説明を3回繰り返す", "C": "Claudeが従うための余地を持てるようmax_tokensを上げる", "D": "形式の説明の前に「これは非常に重要です」を追加する"}, "answer": "A", "explanation_ja": "出力フォーマットのブレは few-shot（multishot）例示が最も効果的。具体例は言葉の説明より強く形式を規定する。B/D は限界がありスケールしない。C は無関係。（さらに確実性が必要なら構造化出力＝JSONスキーマの利用へ進む）", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v1"}, {"id": "D4-q003", "statement_id": "D4-1", "scenario": "A financial-analysis prompt asks Claude for a final recommendation on a complex multi-factor decision. Answers are quick but frequently miss important considerations.", "scenario_ja": "ある財務分析プロンプトは、複雑な多要因の意思決定についてClaudeに最終的な推奨を求めている。回答は速いが、重要な考慮事項をしばしば見落としている。", "question": "Which technique most directly improves answer quality here?", "question_ja": "ここで回答の品質を最も直接的に改善する技法はどれか？", "choices": {"A": "Chain of thought: instruct Claude to reason through the factors step by step before giving the recommendation (or enable extended thinking)", "B": "Lower max_tokens to force more focused answers", "C": "Ask for the recommendation first, then the reasoning, so the answer is not biased", "D": "Split every factor into a separate unrelated conversation"}, "choices_ja": {"A": "Chain of thought：推奨を出す前に要因を段階的に推論するようClaudeに指示する（またはextended thinkingを有効にする）", "B": "より焦点を絞った回答を強制するためmax_tokensを下げる", "C": "答えが偏らないよう、まず推奨を求め、その後に理由付けを求める", "D": "すべての要因をそれぞれ無関係な別の会話に分割する"}, "answer": "A", "explanation_ja": "複雑な多要因の判断には Chain of Thought（段階的に考えさせてから結論）や extended thinking が有効。順序が重要で、推論→結論の順にする。C は逆（結論を先に出させると推論が後付けになる）。B は思考の余地を奪う。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-of-thought", "pack": "v1"}, {"id": "D4-q004", "statement_id": "D4-3", "scenario": "A production pipeline parses Claude's JSON responses. About 2% of responses fail parsing due to markdown code fences, trailing commentary, or schema drift, and the team currently retries with modified prompts.", "scenario_ja": "ある本番パイプラインはClaudeのJSONレスポンスをパースしている。約2%のレスポンスが、Markdownのコードフェンス、末尾のコメント、スキーマのずれによりパースに失敗し、チームは現在プロンプトを修正してリトライしている。", "question": "What is the most robust solution?", "question_ja": "最も堅牢な解決策は何か？", "choices": {"A": "Add 'return ONLY valid JSON' in capital letters to the prompt", "B": "Use structured outputs: pass a JSON schema via output_config format so the API guarantees schema-valid output", "C": "Write a regex that strips everything before the first '{' and after the last '}'", "D": "Lower the temperature so outputs vary less"}, "choices_ja": {"A": "プロンプトに大文字で「有効なJSONのみを返してください」を追加する", "B": "構造化出力を使う：output_configのformatを介してJSONスキーマを渡し、APIがスキーマに準拠した出力を保証するようにする", "C": "最初の'{'より前とすべて最後の'}'より後を取り除く正規表現を書く", "D": "出力のばらつきを減らすためtemperatureを下げる"}, "answer": "B", "explanation_ja": "確実な JSON が必要なら構造化出力（output_config の format に json_schema を指定）が正解。API レベルでスキーマ準拠が保証される。A は改善するが保証がない、C は場当たり的で schema drift に無力、D は根本解決にならない（最新モデルではサンプリングパラメータ自体が使えない場合もある）。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v1"}, {"id": "D4-q005", "statement_id": "D4-3", "scenario": "A team needs to extract structured contact records from free-form emails. They want schema-validated fields AND they are on an API surface where they prefer defining the schema as part of tool use.", "scenario_ja": "あるチームは、自由形式のメールから構造化された連絡先レコードを抽出する必要がある。スキーマ検証されたフィールドが欲しく、かつツール利用の一部としてスキーマを定義することを好むAPIサーフェスを使っている。", "question": "Which approach implements tool-based JSON extraction?", "question_ja": "ツールベースのJSON抽出を実装するアプローチはどれか？", "choices": {"A": "Define a tool (e.g. record_contact) whose input_schema is the desired record schema, and force its use with tool_choice, then read the arguments from the tool_use block", "B": "Define a tool that returns the email text back to Claude for a second pass", "C": "Ask Claude to call an imaginary tool in plain text and parse the text", "D": "Use stop sequences to cut the response at the end of the JSON"}, "choices_ja": {"A": "望ましいレコードスキーマをinput_schemaとして持つツール（例：record_contact）を定義し、tool_choiceでその使用を強制し、tool_useブロックから引数を読む", "B": "2回目のパスのためにメール本文をClaudeに送り返すツールを定義する", "C": "Claudeにプレーンテキストで架空のツールを呼び出させ、そのテキストをパースする", "D": "JSONの終端でレスポンスを打ち切るためstop sequencesを使う"}, "answer": "A", "explanation_ja": "tool-based extraction は『抽出したいスキーマを input_schema に持つツールを定義し、tool_choice で強制、tool_use ブロックの input を読む』パターン。モデルはスキーマに従った引数を生成する。strict: true を付ければさらに厳密。C は擬似ツールで信頼性がない。D は構造保証にならない。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "pack": "v1"}, {"id": "D4-q006", "statement_id": "D4-1", "scenario": "A legal-tech product needs Claude to consistently respond as a cautious legal analyst across thousands of API calls: same persona, same constraints, same output conventions.", "scenario_ja": "あるリーガルテック製品は、数千回のAPI呼び出しにわたって、Claudeが慎重な法務アナリストとして一貫して応答する必要がある：同じペルソナ、同じ制約、同じ出力の慣習を保つ。", "question": "Where should this persona definition live?", "question_ja": "このペルソナ定義はどこに置くべきか？", "choices": {"A": "In the system prompt (system parameter), defining the role, task framing, and constraints once for every request", "B": "Repeated at the start of every user message", "C": "In the first assistant message as a self-introduction", "D": "In tool descriptions, since they are read most carefully"}, "choices_ja": {"A": "システムプロンプト（systemパラメータ）に置き、すべてのリクエストに対して役割・タスクの枠組み・制約を一度だけ定義する", "B": "すべてのuserメッセージの冒頭で繰り返す", "C": "自己紹介として最初のassistantメッセージに置く", "D": "最も注意深く読まれるため、ツールの説明文に置く"}, "answer": "A", "explanation_ja": "役割（role）とタスクの枠組みは system プロンプトに置くのが基本。全リクエストに一貫して効き、キャッシュ効率も良い（安定した接頭辞）。B は冗長でキャッシュを乱し、C/D は本来の用途ではなく効果も不安定。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/system-prompts", "pack": "v1"}, {"id": "D4-q007", "statement_id": "D4-5", "scenario": "A company must classify 80,000 archived documents. There is no latency requirement — results are needed within a day — and cost matters.", "scenario_ja": "ある企業は8万件のアーカイブ文書を分類しなければならない。レイテンシ要件はなく（結果は1日以内に必要）、コストが重要である。", "question": "What is the most cost-effective approach?", "question_ja": "最もコスト効率の良いアプローチは何か？", "choices": {"A": "Send 80,000 sequential Messages API requests with a large model", "B": "Use the Message Batches API, which processes requests asynchronously at 50% of standard prices (most batches complete within an hour, max 24 hours)", "C": "Send all 80,000 documents in one giant request to save on per-request overhead", "D": "Use streaming to reduce token costs"}, "choices_ja": {"A": "大きなモデルを使って8万回の逐次的なMessages APIリクエストを送信する", "B": "標準価格の50%で非同期に処理されるMessage Batches APIを使う（ほとんどのバッチは1時間以内に完了、最大24時間）", "C": "リクエストごとのオーバーヘッドを節約するため、8万件の文書すべてを1つの巨大なリクエストで送る", "D": "トークンコストを減らすためストリーミングを使う"}, "answer": "B", "explanation_ja": "レイテンシ要件がない大量処理は Batch API 一択：全トークン50%引き、非同期で最大24時間以内に処理。1バッチ最大10万リクエスト。C は 1リクエストのコンテキスト上限を超えるし、そもそも安くならない。D のストリーミングは配信方式でありコストは変わらない。モデルの選択（Haiku等）も併用できる。", "source": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "pack": "v1"}, {"id": "D4-q008", "statement_id": "D4-6", "scenario": "A team asks the same Claude conversation that wrote a piece of code to review it for bugs. The review consistently reports 'no issues', yet bugs are later found in production.", "scenario_ja": "あるチームは、コードを書いたのと同じClaudeの会話に、バグがないかそのコードをレビューさせている。レビューは一貫して「問題なし」と報告するが、後になって本番環境でバグが見つかる。", "question": "What is the architectural lesson?", "question_ja": "アーキテクチャ上の教訓は何か？", "choices": {"A": "Claude cannot review code at all; only humans should review", "B": "Self-review within the same context is limited — the model is anchored by its own reasoning; use an independent instance with fresh context (and ideally a review-focused prompt) for critique", "C": "The review prompt needs the word 'CRITICAL' added", "D": "Reviews should run at a higher temperature for more creativity"}, "choices_ja": {"A": "Claudeはコードレビューをまったくできない。人間だけがレビューすべきである", "B": "同一コンテキスト内でのself-reviewには限界がある——モデルは自分自身の推論にアンカリングされてしまう。批評には新しいコンテキストを持つ独立したインスタンス（理想的にはレビューに特化したプロンプト）を使うべきである", "C": "レビュープロンプトに「CRITICAL」という単語を追加する必要がある", "D": "レビューはより創造性を発揮できるよう、より高いtemperatureで実行すべきである"}, "answer": "B", "explanation_ja": "同一コンテキストでの self-review は自分の推論・前提にアンカリングされ欠陥を見逃しやすい。独立したコンテキスト（別インスタンス・レビュー専用プロンプト）でのレビューが有効。信頼性設計の定石で、Claude Code のサブエージェントレビューも同じ発想。A は極端、C/D は本質でない。", "source": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "pack": "v1"}, {"id": "D4-q009", "statement_id": "D4-4", "scenario": "An extraction pipeline validates output against a Pydantic schema. On failure, the current implementation simply resends the exact same request unchanged, hoping for a different result.", "scenario_ja": "ある抽出パイプラインは出力をPydanticスキーマに対して検証している。失敗した場合、現在の実装は単に元とまったく同じリクエストを変更せず再送し、異なる結果が出ることを期待している。", "question": "What change would make the retry loop actually effective, and when should retries be abandoned?", "question_ja": "リトライループを実際に効果的にする変更は何か。また、いつリトライを諦めるべきか？", "choices": {"A": "On retry, append the original document, the failed extraction, and the specific validation error to the prompt so the model can self-correct; abandon retries when the required information is simply absent from the source document rather than a format issue", "B": "Always retry exactly three times with the unchanged original prompt, regardless of the error type", "C": "Lower the temperature on every retry until the output validates", "D": "Switch to a larger model on the first failure without changing the prompt"}, "choices_ja": {"A": "リトライ時には、元の文書、失敗した抽出結果、そして具体的な検証エラーをプロンプトに追加し、モデルが自己修正できるようにする。必要な情報が単に元の文書に存在しない場合（形式の問題ではない場合）はリトライを諦める", "B": "エラーの種類に関わらず、変更しない元のプロンプトで常にちょうど3回リトライする", "C": "出力が検証を通るまで、リトライのたびにtemperatureを下げる", "D": "プロンプトを変更せず、最初の失敗でより大きなモデルに切り替える"}, "answer": "A", "explanation_ja": "有効なリトライは『具体的な検証エラーをプロンプトに追加して自己修正させる』こと。ただし情報がそもそも文書に存在しない場合（構造・書式の問題ではない）はリトライしても無意味なので見切りが必要。B は変更なしの盲目的リトライで効果が薄い。C/D は根本原因（欠落情報 vs 形式エラー）に対処していない。", "source": "materials/official/exam-guide.pdf (Task Statement 4.4)", "pack": "v1"}, {"id": "D4-q010", "statement_id": "D4-2", "angle": "troubleshoot", "scenario_ref": 5, "scenario": "A CI pipeline runs Claude on every pull request to post review comments tagged critical, major, or minor. The system prompt contains three detailed paragraphs defining each severity level in prose, but the same class of finding (an unhandled promise rejection) is tagged critical in one PR and minor in another, and developers have started ignoring the severity labels entirely.", "scenario_ja": "CI パイプラインが全プルリクエストで Claude を実行し、critical / major / minor のいずれかを付けたレビューコメントを投稿している。システムプロンプトには各重大度を定義する詳細な散文の段落が3つ含まれているが、同種の指摘（未処理の promise rejection）が、ある PR では critical、別の PR では minor と付けられており、開発者は重大度ラベルを完全に無視し始めている。", "question": "What is the most likely root cause of the inconsistent severity classification?", "question_ja": "重大度分類が一貫しない最も可能性の高い根本原因は何か。", "choices": {"A": "The reviewer runs without extended thinking, so the model cannot reason long enough to classify severity reliably on any pull request.", "B": "The severity paragraphs appear in the system prompt rather than in the user message, so the model treats them as background context only.", "C": "Prose-only severity definitions are interpreted inconsistently across runs because no concrete code examples anchor what each severity level looks like.", "D": "The three severity levels are too few to separate findings, so the model is forced to guess between labels on borderline findings."}, "choices_ja": {"A": "レビューが extended thinking なしで動いているため、モデルがどの PR でも重大度を確実に分類できるだけの推論時間を取れていない。", "B": "重大度の段落がユーザーメッセージではなくシステムプロンプトに置かれているため、モデルが背景情報としてしか扱っていない。", "C": "散文だけの重大度定義は実行ごとに解釈がぶれる。各重大度が具体的にどのコードを指すのかを固定する具体例がないため。", "D": "重大度が3段階しかなく指摘を分離しきれないため、境界的な指摘ではモデルがラベルを推測せざるを得ない。"}, "answer": "C", "explanation_ja": "C が正解。公式ガイドは「詳細な指示だけでは出力が一貫しないとき、few-shot 例こそが一貫した書式・判断を得る最も効果的な手段」とし、各重大度レベルに具体的なコード例を伴う明示的な基準を定義することを推奨している。散文の定義は実行ごとに解釈が揺れるため、例で境界を固定するのが根本対処。A は誤り。分類の揺れは推論時間の不足ではなく判定基準の曖昧さであり、thinking を足しても各実行が別々の解釈に落ち着く問題は解けない。B は誤り。システムプロンプトは役割や基準を置く正しい場所であり、配置がぶれの原因ではない。D は誤り。ラベル数を増やしても各ラベルの定義が散文のままなら境界の曖昧さは増えこそすれ減らない。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q011", "statement_id": "D4-2", "angle": "find-error", "scenario_ref": 6, "scenario": "An extraction service pulls author, publication date, and funding source out of research PDFs into JSON. A developer adds four few-shot examples to the prompt, all taken from the same journal's template where the funding statement always appears in a labeled 'Funding' section. In production, documents that state funding inside an acknowledgements paragraph come back with funding_source set to null.", "scenario_ja": "ある抽出サービスは、研究論文の PDF から著者・発行日・資金提供元を JSON に抽出している。開発者はプロンプトに few-shot 例を4つ追加したが、いずれも資金情報が必ず「Funding」という見出し付きセクションに現れる同一ジャーナルのテンプレートから取られていた。本番では、謝辞の段落中に資金提供を記載した文書で funding_source が null になって返ってくる。", "question": "What is the flaw in how the few-shot examples were constructed?", "question_ja": "この few-shot 例の作り方における欠陥はどれか。", "choices": {"A": "The examples are drawn from a single document layout, so they teach one fixed pattern instead of the varied structures the model must generalize to.", "B": "Four examples exceed the recommended count, so the later examples dilute the instructions that precede them in the prompt.", "C": "The examples show completed JSON output, so the model copies the field values it saw rather than reading each incoming document.", "D": "The examples are placed after the schema definition, so the model applies the schema before it has seen any of them."}, "choices_ja": {"A": "例がすべて単一の文書レイアウトから取られており、モデルが一般化すべき多様な構造ではなく固定パターンを1つだけ教えている。", "B": "例が4件と推奨数を超えており、後半の例がプロンプト内で先行する指示を薄めてしまっている。", "C": "例が完成した JSON 出力を示しているため、モデルが入力文書を読まずに例で見たフィールド値を写してしまっている。", "D": "例がスキーマ定義より後に置かれているため、モデルが例を見る前にスキーマを適用してしまっている。"}, "answer": "A", "explanation_ja": "A が正解。公式ガイドは例を relevant かつ diverse にし、エッジケースを覆い、モデルが意図しないパターンを拾わないよう十分にばらつかせよと明示している。単一テンプレート由来の例は「Funding 見出しがある時だけ抽出する」という誤ったパターンを教え、謝辞に埋め込まれた記述で null を返す原因になる。対処は多様な文書構造をまたぐ例を加えること。B は誤り。3〜5件が推奨であり4件は適正で、件数は原因ではない。C は誤り。few-shot 例は本来完成形の出力を示すものであり、それ自体はアンチパターンではない（問題は値ではなく構造の単調さ）。D は誤り。例とスキーマの前後関係は問題の症状（特定レイアウトだけ失敗）を説明しない。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q012", "statement_id": "D4-2", "angle": "design-choice", "scenario_ref": 1, "scenario": "A support agent with get_customer, lookup_order, process_refund, and escalate_to_human resolves clear-cut refund requests correctly, but mishandles ambiguous ones such as a customer who is outside the return window yet cites a shipping delay caused by the company. Sometimes it refunds, sometimes it escalates, and sometimes it quotes the policy and closes the case.", "scenario_ja": "get_customer / lookup_order / process_refund / escalate_to_human を持つサポートエージェントは、明確な返金依頼は正しく処理できるが、返品期間を過ぎているが自社起因の配送遅延を訴える顧客のような曖昧なケースでは対応が破綻する。あるときは返金し、あるときはエスカレーションし、あるときはポリシーを引用して案件を閉じてしまう。", "question": "What is the most effective way to make the agent's handling of ambiguous refund cases consistent?", "question_ja": "曖昧な返金ケースに対するエージェントの対応を一貫させる最も効果的な方法はどれか。", "choices": {"A": "Enumerate an exhaustive rule table in the system prompt covering every product category, return window, and shipping exception combination the business supports.", "B": "Have the agent output a self-reported confidence score before acting and route every case below the threshold to escalate_to_human automatically.", "C": "Restrict the agent to lookup_order and escalate_to_human, and let a human decide every refund that is not inside the standard return window.", "D": "Add 2-4 few-shot examples of ambiguous cases that show the reasoning for why one action was chosen over the plausible alternatives."}, "choices_ja": {"A": "自社が扱うすべての商品カテゴリ・返品期間・配送例外の組み合わせを網羅した規則表をシステムプロンプトに列挙する。", "B": "エージェントに行動前の自己申告の確信度スコアを出力させ、閾値未満のケースをすべて自動的に escalate_to_human へ回す。", "C": "エージェントの利用ツールを lookup_order と escalate_to_human に限定し、標準の返品期間外の返金はすべて人間に判断させる。", "D": "曖昧なケースの few-shot 例を2〜4件追加し、もっともらしい他の選択肢ではなくその行動を選んだ理由づけまで示す。"}, "answer": "D", "explanation_ja": "D が正解。公式 Exam Guide は「曖昧なシナリオ向けに、なぜ他のもっともらしい選択肢ではなくその行動を選んだのかという理由まで示す few-shot 例を2〜4件作る」ことを明示的なスキルとして挙げている。例は判断の境界を示し、列挙していない新規パターンへの一般化も可能にする。A は誤り。網羅的な規則表は保守不能で、必ず表に載らない組み合わせが現れ、そこで再び挙動が割れる。B は誤り。LLM の自己申告確信度は較正が悪く、難しいケースほど自信過剰になるため境界判断の指標にならない。C は誤り。曖昧なケースを全て人間に回すのは初回解決率80%以上という目標に反し、判断基準の欠如という根本原因も直らない。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q013", "statement_id": "D4-2", "angle": "tradeoff", "scenario_ref": 6, "scenario": "An invoice extraction pipeline already uses structured outputs with a strict JSON schema, so every response parses cleanly. Even so, roughly 12% of invoices come back with plausible-looking but wrong values for line-item quantities, because vendors express quantities informally ('two cases', '3 x 12pk'). The team must keep per-document cost and latency close to current levels.", "scenario_ja": "請求書抽出パイプラインは既に厳密な JSON スキーマによる structured outputs を使っており、レスポンスは必ず正しくパースできる。それでもおよそ12%の請求書で、明細の数量が「two cases」「3 x 12pk」のように非公式に表現されているために、もっともらしいが誤った値が返ってくる。チームは1文書あたりのコストとレイテンシを現状水準に保つ必要がある。", "question": "Which change best addresses the wrong-value rate under the stated cost and latency constraints?", "question_ja": "提示されたコストとレイテンシの制約下で、誤った値の発生率に最もよく対処する変更はどれか。", "choices": {"A": "Drop the JSON schema and instead instruct the model in prose to return quantities exactly as printed, letting a parser normalize the free-form text downstream.", "B": "Keep the schema and add 3-5 diverse few-shot examples showing correct normalization of informal quantity expressions into the schema's numeric field.", "C": "Keep the schema and add a second validation pass in which a separate call re-reads every extracted line item and confirms each quantity against the document.", "D": "Keep the schema and expand the field descriptions with several paragraphs of prose rules explaining how each informal quantity phrasing should be converted."}, "choices_ja": {"A": "JSON スキーマをやめ、数量は印字されたまま返すよう散文で指示し、自由記述テキストの正規化は下流のパーサに任せる。", "B": "スキーマは維持したまま、非公式な数量表現をスキーマの数値フィールドへ正しく正規化する多様な few-shot 例を3〜5件追加する。", "C": "スキーマは維持したまま、別呼び出しで抽出済みの全明細を読み直し各数量を文書と突き合わせる2段目の検証パスを追加する。", "D": "スキーマは維持したまま、各非公式表現をどう変換するかを説明する散文の規則を数段落ぶんフィールド説明に追記する。"}, "answer": "B", "explanation_ja": "B が正解。structured outputs が保証するのはスキーマ適合性であって値の正しさではない。公式 Exam Guide は、非公式な計量表現や多様な文書構造に対する抽出のハルシネーション低減に few-shot 例が有効だとしており、例は数件ぶんのトークン増で済むため追加呼び出しなしにコスト・レイテンシ制約を満たす。A は誤り。スキーマを外すとパース保証（現状うまくいっている部分）を失い、曖昧さの解消は下流に押し付けられるだけ。C は誤り。全文書に2回目の呼び出しを課すのはコストとレイテンシをほぼ倍増させ、制約に反する。D は誤り。散文の規則だけでは解釈がぶれるという前提そのものが few-shot の出発点であり、書ききれない新表現にも一般化しない。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q014", "statement_id": "D4-2", "angle": "design-choice", "scenario_ref": 3, "scenario": "In a multi-agent research system, the document-analysis subagent extracts the sources supporting each claim in academic papers. It performs well on papers that use numbered inline citations, but on papers that place all references in an end bibliography, or that bury methodology details inside narrative prose, it returns empty source lists. The coordinator then synthesizes reports with unsupported claims.", "scenario_ja": "マルチエージェント研究システムにおいて、文書分析サブエージェントは学術論文中の各主張を支える出典を抽出している。番号付きのインライン引用を使う論文ではうまく動作するが、参考文献を末尾の書誌にまとめている論文や、手法の詳細が本文の記述に埋め込まれている論文では、出典リストが空で返る。その結果コーディネーターは裏づけのない主張を含むレポートを統合してしまう。", "question": "What is the most effective change to the document-analysis subagent's prompt?", "question_ja": "文書分析サブエージェントのプロンプトに対する最も効果的な変更はどれか。", "choices": {"A": "Instruct the subagent to return a diagnostic note whenever it finds no citations, so the coordinator can drop those papers from the synthesis step.", "B": "Split the subagent into one subagent per citation style and have the coordinator detect the style of each paper before dispatching the work.", "C": "Add few-shot examples covering the varied structures, including inline citations, end bibliographies, and methodology details embedded in prose.", "D": "Instruct the subagent to quote the full reference section verbatim first and then map every claim onto the quoted text in a single pass."}, "choices_ja": {"A": "引用が見つからない場合は診断メモを返すようサブエージェントに指示し、コーディネーターがそれらの論文を統合対象から外せるようにする。", "B": "引用スタイルごとにサブエージェントを分割し、コーディネーターが各論文のスタイルを判定してから作業を振り分ける。", "C": "インライン引用・末尾の書誌・本文中に埋め込まれた手法記述など、多様な構造を覆う few-shot 例を追加する。", "D": "まず参考文献セクション全体を逐語的に引用させ、その上で全主張を引用済みテキストへ1パスで対応づけるよう指示する。"}, "answer": "C", "explanation_ja": "C が正解。公式 Exam Guide は、インライン引用と書誌、手法セクションと本文埋め込みといった多様な文書構造の正しい扱いを few-shot 例で示すこと、そして必須フィールドが空・null で返る問題への対処として多様な書式の抽出例を追加することを明示している。例は列挙した書式にとどまらず新規の構造への一般化も促す。A は誤り。空の結果を検知して論文を捨てるのは症状の隠蔽であり、抽出できるはずの出典を失う。B は誤り。スタイルごとのサブエージェント分割は分類器と保守対象を増やす過剰設計で、想定外のスタイルには依然対応できない。D は誤り。長文の根拠づけとして引用を先に出させるのは有効な技法だが、書誌を持たずに本文へ手法詳細を埋め込む論文には効かず、失敗ケースの一部しか救えない。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q015", "statement_id": "D4-4", "angle": "design-choice", "scenario_ref": 6, "scenario": "Your extraction pipeline pulls invoice data from scanned vendor PDFs using a tool-use schema with line items, a stated total, and a tax amount. Finance reports that roughly 4% of accepted invoices have line items that do not add up to the total, because the OCR text drops or duplicates a row. The JSON is always schema-valid, so nothing is currently flagged.", "scenario_ja": "あなたの抽出パイプラインは、明細行・記載合計・税額を持つツール利用スキーマを使って、スキャンされたベンダーPDFから請求書データを取り出している。経理から、受理された請求書の約4%で明細行が合計と一致しないという報告があった。OCRテキストが行を落としたり重複させたりするためである。JSONは常にスキーマ的に妥当なので、現状では何もフラグされていない。", "question": "Which extraction design most reliably surfaces these arithmetic inconsistencies for review?", "question_ja": "これらの計算上の不整合をレビュー用に最も確実に表面化させる抽出設計はどれか。", "choices": {"A": "Add a JSON Schema numerical constraint requiring the total field to equal the sum of the line item amounts, so the API rejects inconsistent extractions at generation time.", "B": "Have the model emit both stated_total (as printed on the invoice) and calculated_total (summed from the extracted line items) plus a conflict_detected boolean, and validate the two against each other.", "C": "Instruct the model in the system prompt to double-check its arithmetic before responding and to silently correct the total field whenever the line items do not add up to it.", "D": "Send every extracted invoice through a second identical extraction call and accept the record only when the two independent extractions produce byte-identical JSON payloads."}, "choices_ja": {"A": "合計フィールドが明細行金額の合計と等しいことを要求する JSON Schema の数値制約を追加し、生成時点で API に不整合な抽出を拒否させる。", "B": "モデルに stated_total（請求書に印字された値）と calculated_total（抽出した明細行から合算した値）の両方に加えて conflict_detected ブール値を出力させ、両者を突き合わせて検証する。", "C": "システムプロンプトでモデルに、応答前に計算を再確認し、明細行が合計と合わない場合は合計フィールドを黙って修正するよう指示する。", "D": "抽出済みの各請求書を2回目の同一抽出呼び出しに通し、2つの独立した抽出がバイト単位で同一の JSON を返した場合にのみレコードを受理する。"}, "answer": "B", "explanation_ja": "B が正解。Task Statement 4.4 が明示する自己検証フローの定石で、モデルには「読み取った値」と「導出した値」を別フィールドで出させ、突き合わせはコード側の決定的な検証で行う。conflict_detected のような明示フィールドを併用すれば、下流で人手レビューへ回す判断も機械的にできる。A は誤り: 構造化出力がサポートする JSON Schema には minimum/maximum などの数値制約すら含まれず（サポート外機能は 400 エラー）、まして「他フィールドの合計と等しい」といった相互依存の制約は表現できない。C は誤り: モデルに黙って合計を書き換えさせると、OCR の欠落が「辻褄の合った誤ったデータ」に化けて検知不能になる。不整合は隠すのではなく可視化するのが抽出品質の原則。D は誤り: 同じ欠落した OCR テキストを入力にすれば両方の抽出が同じ誤りに収束しやすく、一致してもデータが正しい保証にならない。コストも倍増する。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q016", "statement_id": "D4-4", "angle": "troubleshoot", "scenario_ref": 6, "scenario": "A team migrated their document extraction from free-text JSON prompting to tool use with a strict JSON schema, and JSON parse failures dropped to zero as expected. However, the downstream ingestion service still rejects about 7% of records, and the rejection log shows entries such as a shipping address appearing in the billing_address field and a delivery date that precedes the order date.", "scenario_ja": "あるチームが文書抽出を自由記述の JSON プロンプトから厳格な JSON スキーマによるツール利用へ移行したところ、期待どおり JSON のパース失敗はゼロになった。しかし下流の取り込みサービスは依然として約7%のレコードを拒否しており、拒否ログには配送先住所が billing_address フィールドに入っている、納品日が発注日より前になっている、といった項目が並んでいる。", "question": "What is the root cause of the remaining rejections?", "question_ja": "残っている拒否の根本原因は何か。", "choices": {"A": "The strict schema is silently truncating field values that exceed the compiled grammar's internal size limits, which corrupts long address strings during generation.", "B": "Tool use guarantees schema compliance only when tool_choice is set to a specific named tool; with tool_choice set to auto the model is free to populate fields arbitrarily.", "C": "Schema enforcement eliminates syntax and type violations but not semantic errors, so values placed in the wrong field or that contradict each other still pass validation.", "D": "The compiled grammar cache expired after 24 hours of inactivity, so requests made after the gap fell back to unconstrained decoding and produced inconsistent field mappings."}, "choices_ja": {"A": "厳格スキーマがコンパイル済み文法の内部サイズ上限を超えるフィールド値を黙って切り詰めており、生成中に長い住所文字列が壊れている。", "B": "ツール利用がスキーマ準拠を保証するのは tool_choice で特定のツール名を指定した場合だけであり、auto にしているとモデルは自由にフィールドを埋められる。", "C": "スキーマの強制は構文エラーと型違反を排除するが意味的な誤りは排除しないため、誤ったフィールドに入った値や互いに矛盾する値は検証を通過してしまう。", "D": "コンパイル済み文法のキャッシュが24時間の未使用で失効し、その後のリクエストが制約なしのデコードにフォールバックしてフィールド対応が不安定になった。"}, "answer": "C", "explanation_ja": "C が正解。厳格な JSON スキーマは「有効な JSON か」「型と必須フィールドが合っているか」しか保証しない。住所の入れ違いや日付の前後矛盾は型としては正しいので通過する。この層は意味的検証（ビジネスルール検証）としてコード側で実装し、失敗時に具体的な検証エラーを添えて再試行させる必要がある。A は誤り: 文法の複雑性上限は超過時に 400 エラーになるのであって、値を黙って切り詰める仕組みではない。B は誤り: tool_choice はどのツールを呼ぶか（あるいは必ず呼ぶか）を制御するもので、スキーマ準拠自体の強度を切り替えるものではない。D は誤り: 文法キャッシュの失効はコンパイル遅延が再発するだけで、制約なしデコードへのフォールバックは起きない。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q017", "statement_id": "D4-4", "angle": "find-error", "scenario_ref": 6, "scenario": "An engineer implements extraction of insurance claim forms. Every field in the schema — including policy_number, adjuster_name, and prior_claim_id — is listed in required with no nullable variant, and the wrapper retries the call up to three times whenever any field comes back as an empty string. Auditors later find policy numbers in the database that appear on no physical form.", "scenario_ja": "あるエンジニアが保険請求フォームの抽出を実装した。スキーマの全フィールド（policy_number、adjuster_name、prior_claim_id を含む）が nullable の変種なしに required に列挙されており、ラッパーはいずれかのフィールドが空文字列で返るたびに最大3回まで呼び出しを再試行する。後日、監査で、どの実物のフォームにも存在しない保険証券番号がデータベース内に見つかった。", "question": "Which flaw in this implementation best explains the fabricated values?", "question_ja": "この実装のどの欠陥が、捏造された値を最もよく説明するか。", "choices": {"A": "Forcing every field to be required while retrying on empty values pressures the model to invent plausible content for fields the source document simply does not contain.", "B": "Three retry attempts is too few for sparse documents, so the wrapper accepts whatever partial extraction the final attempt produced instead of escalating the record.", "C": "Empty strings are the wrong sentinel for a missing value, so the wrapper should compare against a null literal and let the model return null for absent fields.", "D": "The retries reuse the same temperature setting each time, so each attempt reproduces the previous output rather than exploring a different reading of the document."}, "choices_ja": {"A": "全フィールドを required に強制しつつ空値で再試行させることで、そもそも原文書に存在しないフィールドについてモデルにもっともらしい内容をでっち上げる圧力をかけている。", "B": "疎な文書に対して3回の再試行は少なすぎ、ラッパーは当該レコードをエスカレーションせずに最終試行の部分的な抽出をそのまま受理してしまっている。", "C": "欠損値の番兵として空文字列は不適切であり、ラッパーは null リテラルと比較し、欠損フィールドにはモデルに null を返させるべきである。", "D": "再試行が毎回同じ temperature 設定を使い回すため、各試行が文書の別解釈を探索せず直前の出力を再現してしまっている。"}, "answer": "A", "explanation_ja": "A が正解。原文書に含まれない情報は再試行では取得できない。にもかかわらず必須フィールドを空にできない設計にすると、モデルは制約を満たすために値を捏造する方向へ追い込まれる。原文書に存在しない可能性のある項目は optional/nullable にするか \"unclear\" などの列挙値を用意し、欠損は欠損として表現させるのが正しい。B は誤り: 回数を増やしても情報が原文書にない以上結果は変わらず、コストが増えるだけ。C は部分的に方向が近いが誤り: 番兵の型を空文字列から null に替えても、フィールドが required のままなら「値を出さなければならない」圧力は消えない。真の欠陥はスキーマ設計であって比較の書き方ではない。D は誤り: サンプリングの多様性は問題ではなく、原文書にない情報を引き出せないという事実は温度を変えても変わらない。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q018", "statement_id": "D4-4", "angle": "tradeoff", "scenario_ref": 5, "scenario": "Your CI code review bot posts findings on every pull request, and developers dismiss roughly a third of them. You need to learn which kinds of code the bot misjudges so you can fix the prompt, but the review runs as a blocking pre-merge check with a strict two-minute budget and a fixed monthly token allocation.", "scenario_ja": "あなたの CI コードレビューボットはすべてのプルリクエストに指摘を投稿しているが、開発者はそのおよそ3分の1を却下している。プロンプトを修正するため、ボットがどの種類のコードで判断を誤るのかを知る必要があるが、レビューはマージ前のブロッキングチェックとして動作し、2分という厳しい時間予算と月次の固定トークン枠がある。", "question": "Which approach gives you the strongest signal about false positive patterns within these constraints?", "question_ja": "これらの制約の下で、偽陽性のパターンについて最も強いシグナルが得られるアプローチはどれか。", "choices": {"A": "Ask the model to attach a numeric self-confidence score to each finding and suppress everything below a threshold, then tune the threshold from the resulting dismissal rate each week.", "B": "Send each finding to a second Claude call at review time that judges whether the finding is a true positive, and post only the findings that survive that verification step.", "C": "Require developers to select a free-text reason when dismissing a finding, then have a monthly job read the accumulated comment threads and summarize the recurring complaints.", "D": "Add a detected_pattern field to the finding schema naming the code construct that triggered it, log it with each dismissal, and analyze the dismissal rate per pattern offline."}, "choices_ja": {"A": "各指摘にモデル自身の数値的な確信度スコアを付けさせ、閾値未満をすべて抑制した上で、毎週の却下率から閾値を調整する。", "B": "レビュー時に各指摘を2回目の Claude 呼び出しに送って真陽性かどうかを判定させ、その検証を通過した指摘だけを投稿する。", "C": "開発者が指摘を却下する際に自由記述の理由の選択を必須とし、月次ジョブで蓄積されたコメントスレッドを読ませて繰り返し現れる不満を要約させる。", "D": "指摘スキーマに、そのトリガーとなったコード構造を示す detected_pattern フィールドを追加し、却下ごとに記録して、パターン別の却下率をオフラインで分析する。"}, "answer": "D", "explanation_ja": "D が正解。Task Statement 4.4 が挙げるフィードバックループ設計そのもので、指摘に detected_pattern を持たせると「どのコード構造が偽陽性を生んでいるか」を却下データと突き合わせて体系的に集計できる。追加コストは1フィールド分のトークンだけで、分析はレビュー経路の外（オフライン）で走るためレイテンシ予算を消費しない。A は誤り: 確信度による閾値フィルタは症状を隠すだけで、どの構造が誤判定されているかは分からず、モデルの自己申告確信度は較正が不安定。B は誤り: 指摘ごとの追加呼び出しは2分のブロッキング予算とトークン枠を直撃し、しかも却下パターンのデータは蓄積されない。C は誤り: 自由記述は書式がばらつき記入率も低く、集計可能な指標にならない上に開発者の摩擦を増やす。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D4-q019", "statement_id": "D4-4", "angle": "design-choice", "scenario_ref": 6, "scenario": "Your extraction service processes contracts of widely varying length with a JSON output schema that includes an array of clause summaries. About 2% of responses come back with JSON that stops mid-string, and your parser throws on them. Inspecting the API responses, you find every one of these has stop_reason set to max_tokens, while successful responses have stop_reason end_turn.", "scenario_ja": "あなたの抽出サービスは、条項サマリの配列を含む JSON 出力スキーマを使って、長さが大きく異なる契約書を処理している。応答の約2%は文字列の途中で途切れた JSON が返り、パーサが例外を投げる。API 応答を調べると、それらはすべて stop_reason が max_tokens になっており、成功した応答は end_turn になっている。", "question": "What is the appropriate handling for these responses?", "question_ja": "これらの応答に対する適切な処理はどれか。", "choices": {"A": "Treat them as unrecoverable and route the contract to the manual review queue, since a truncated response means the schema grammar failed to compile for that document.", "B": "Branch on stop_reason before parsing and retry the truncated cases with a higher max_tokens, since the output was cut off rather than semantically wrong.", "C": "Retry with the truncated JSON and a validation error message appended to the prompt, so the model can see exactly where its previous output broke and continue it.", "D": "Reduce the schema's clause array to a minItems of 0 and drop the optional fields, since truncation indicates the compiled grammar exceeded the complexity limits."}, "choices_ja": {"A": "回復不能とみなして契約書を手動レビューのキューへ回す。応答が途切れているのは、その文書でスキーマ文法のコンパイルに失敗したことを意味するため。", "B": "パース前に stop_reason で分岐し、途切れたケースは max_tokens を大きくして再試行する。出力は意味的に誤っているのではなく打ち切られただけであるため。", "C": "途切れた JSON と検証エラーメッセージをプロンプトに追記して再試行し、モデルが直前の出力のどこで壊れたかを見て続きを書けるようにする。", "D": "スキーマの条項配列を minItems 0 にして任意フィールドを削る。切り詰めはコンパイル済み文法が複雑性の上限を超えたことを示すため。"}, "answer": "B", "explanation_ja": "B が正解。公式ドキュメントは、max_tokens で打ち切られた場合は出力が不完全でスキーマに一致しないことがあり、より大きな max_tokens で再試行すると明記している。これは典型的な構造的エラーであり、再試行で確実に解消できる種類の失敗なので、パース前に stop_reason を見て分類するのが正しい実装。A は誤り: 文法のコンパイル失敗は 400 エラーとして返るのであって、途中で途切れた 200 応答にはならない。手動レビューは再試行で解決できる問題に対する過剰な対応。C は誤り: 途切れた出力を貼り付けて「続き」を書かせるのは検証エラーフィードバックの本来の用途（意味的・形式的な誤りの修正）ではなく、予算が同じままでは再び打ち切られる。D は誤り: 複雑性超過も 400 エラーであり、スキーマを削っても長い契約書に必要な出力トークン量が足りない事実は変わらない。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D5-q001", "statement_id": "D5-4", "scenario": "A developer sets \"model\": \"opus\" in ~/.claude/settings.json (user scope), but the project's .claude/settings.json sets \"model\": \"sonnet\". The developer also has .claude/settings.local.json with \"model\": \"haiku\".", "scenario_ja": "ある開発者は~/.claude/settings.json（ユーザースコープ）で\"model\": \"opus\"を設定しているが、プロジェクトの.claude/settings.jsonでは\"model\": \"sonnet\"が設定されている。この開発者はさらに.claude/settings.local.jsonで\"model\": \"haiku\"を設定している。", "question": "Which model applies in this project, and why?", "question_ja": "このプロジェクトではどのモデルが適用されるか、またその理由は？", "choices": {"A": "opus — user settings always win because they are the most personal", "B": "sonnet — project settings override local settings", "C": "haiku — local settings take precedence over shared project settings, which take precedence over user settings", "D": "The session fails to start because conflicting values are an error"}, "choices_ja": {"A": "opus——ユーザー設定は最も個人的なものであるため常に優先される", "B": "sonnet——プロジェクト設定はローカル設定より優先される", "C": "haiku——ローカル設定は共有プロジェクト設定より優先され、共有プロジェクト設定はユーザー設定より優先される", "D": "値が競合しているためエラーとなりセッションは開始できない"}, "answer": "C", "explanation_ja": "settings の優先順位は（managed を除くと）local > project > user。より具体的なスコープが勝つ。したがって settings.local.json の haiku が適用される。なお permission ルールは上書きではなく『マージ』される点も併せて押さえる。", "source": "https://code.claude.com/docs/en/settings", "pack": "v1"}, {"id": "D5-q002", "statement_id": "D5-1", "scenario": "A long-running agent conversation is approaching the model's context window limit, and the team must keep the session going without losing the thread of the work.", "scenario_ja": "長時間実行されているエージェントの会話がモデルのコンテキストウィンドウの上限に近づいており、チームは作業の流れを失うことなくセッションを継続しなければならない。", "question": "Which technique directly addresses this?", "question_ja": "この問題に直接対処する技法はどれか？", "choices": {"A": "Compaction: summarize earlier context (server-side compaction or harness-level summarization) so the conversation can continue within the window", "B": "Raise max_tokens, which increases the context window", "C": "Delete the system prompt to free space", "D": "Switch stop sequences to shorter strings"}, "choices_ja": {"A": "コンパクション：以前のコンテキストを要約する（サーバーサイドのcompaction、またはハーネスレベルの要約）ことで会話をウィンドウ内で継続できるようにする", "B": "コンテキストウィンドウを増やすmax_tokensを上げる", "C": "スペースを空けるためシステムプロンプトを削除する", "D": "stop sequencesをより短い文字列に切り替える"}, "answer": "A", "explanation_ja": "コンテキスト上限への対処はコンパクション（過去の履歴を要約に置き換える）。API のサーバーサイド compaction、または Claude Code の /compact のようなハーネス側要約がこれにあたる。max_tokens は『出力』の上限でありコンテキストウィンドウは増えない（B は頻出のひっかけ）。C は挙動を壊し、D は無関係。", "source": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "pack": "v1"}, {"id": "D5-q003", "statement_id": "D5-3", "scenario": "In a multi-agent pipeline, a subagent's database tool fails intermittently. The current implementation silently drops failed tool calls, so the orchestrator receives incomplete data without knowing anything went wrong.", "scenario_ja": "あるマルチエージェントパイプラインでは、サブエージェントのデータベースツールが断続的に失敗する。現在の実装は失敗したツール呼び出しを黙って破棄しているため、オーケストレーターは何か問題が起きたことを知らないまま不完全なデータを受け取っている。", "question": "What is the correct error-propagation pattern?", "question_ja": "正しいエラー伝播のパターンは何か？", "choices": {"A": "Return a tool_result with is_error: true and an informative message so the model can adapt, and surface persistent failures to the orchestrator for escalation", "B": "Retry silently forever until the tool succeeds", "C": "Terminate the entire pipeline on any single tool failure", "D": "Have the subagent fabricate plausible data so the pipeline continues smoothly"}, "choices_ja": {"A": "is_error: trueと有用なメッセージを持つtool_resultを返し、モデルが適応できるようにする。継続的な失敗はエスカレーションのためオーケストレーターに表面化させる", "B": "ツールが成功するまで永遠に黙ってリトライする", "C": "1つでもツールが失敗したらパイプライン全体を終了する", "D": "パイプラインが滞りなく続くよう、サブエージェントにもっともらしいデータを捏造させる"}, "answer": "A", "explanation_ja": "エラーは隠さず構造化して伝える：tool_result に is_error: true と有用なメッセージを入れればモデルはリトライや代替手段を選べる。継続的な失敗は上位（オーケストレーター/人間）へエスカレーション。B は停止しない恐れ、C は過剰、D は最悪（サイレントなデータ汚染）。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", "pack": "v1"}, {"id": "D5-q004", "statement_id": "D5-5", "scenario": "Your document extraction system reports 97% overall accuracy, so the team plans to remove human review entirely. A closer look shows the 97% figure blends near-perfect performance on invoices with much worse performance on handwritten receipts, which make up a small fraction of volume.", "scenario_ja": "あなたの文書抽出システムは全体で97%の精度を報告しているため、チームは人間によるレビューを完全に廃止しようと計画している。詳しく見ると、この97%という数字は請求書に対するほぼ完璧な性能と、少量ながら手書きの領収書に対するはるかに低い性能を混ぜ合わせたものである。", "question": "What should the team do before reducing human review further?", "question_ja": "チームは人間によるレビューをさらに減らす前に何をすべきか？", "choices": {"A": "Analyze accuracy segmented by document type and field, and use stratified random sampling plus field-level confidence calibration to decide where review is still needed", "B": "Trust the 97% aggregate figure and remove review for all document types immediately", "C": "Remove review only for invoices, since they are the majority of volume, without checking other segments", "D": "Increase the overall sample size used to compute the aggregate accuracy figure"}, "choices_ja": {"A": "文書種別とフィールド別に精度を分析し、層化ランダムサンプリングとフィールド単位の信頼度較正を用いて、どこにまだレビューが必要かを判断する", "B": "97%という集計値を信頼し、すべての文書種別についてただちにレビューを廃止する", "C": "他のセグメントを確認せずに、量が多いという理由だけで請求書についてのみレビューを廃止する", "D": "集計精度を算出するために使うサンプルサイズ全体を増やす"}, "answer": "A", "explanation_ja": "集計精度（97%）は特定セグメント（手書き領収書）の低性能を覆い隠す危険がある。文書種別・フィールド単位での精度分析と層化ランダムサンプリング、信頼度較正によって、どこにレビューが必要かを判断すべき。B は危険、C は他セグメントを未検証のまま放置、D は集計自体の粒度を上げるだけで根本問題（セグメント別分析の欠如）を解決しない。", "source": "materials/official/exam-guide.pdf (Task Statement 5.5)", "pack": "v1"}, {"id": "D5-q005", "statement_id": "D5-6", "scenario": "A multi-agent research system's synthesis agent combines two credible sources that report different statistics for the same metric (e.g., different market size figures), and one source is from three years ago while the other is recent.", "scenario_ja": "あるマルチエージェントのリサーチシステムの統合エージェントは、同じ指標（例：異なる市場規模の数字）について異なる統計を報告する2つの信頼できる情報源を組み合わせている。一方の情報源は3年前のもので、もう一方は最近のものである。", "question": "What is the correct way to handle this in the synthesized report?", "question_ja": "統合されたレポートの中でこれをどう扱うのが正しいか？", "choices": {"A": "Preserve both values with their source attribution and publication dates, and annotate the discrepancy rather than arbitrarily picking one; distinguish well-established findings from contested ones", "B": "Silently use the more recent source's number since it is presumably more accurate", "C": "Average the two statistics to produce a single blended figure", "D": "Omit the metric entirely from the report to avoid presenting conflicting information"}, "choices_ja": {"A": "出典と発行日を付けて両方の値を保持し、恣意的にどちらかを選ぶのではなく食い違いを注記する。十分に確立された知見と議論の余地がある知見を区別する", "B": "おそらくより正確であろうという理由で、より新しい情報源の数字を黙って使う", "C": "2つの統計を平均して単一の混合された数値を出す", "D": "矛盾する情報を提示しないよう、その指標をレポートから完全に省く"}, "answer": "A", "explanation_ja": "情報の出所（provenance）を保持することが原則：両方の値を出典・日付付きで残し、矛盾は明示的に注記する。恣意的な一方選択（B）や平均化（C）は情報を歪める。日付情報があれば時系列差を矛盾と誤解することも防げる。D は有用な情報を単に隠すだけ。", "source": "materials/official/exam-guide.pdf (Task Statement 5.6)", "pack": "v1"}, {"id": "OFFICIAL-q001", "statement_id": "D1-4", "scenario": "Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds.", "scenario_ja": "本番データによると、12%のケースであなたのエージェントはget_customerを完全にスキップし、顧客が申告した名前だけを使ってlookup_orderを呼び出しており、時折アカウントの誤認や誤った返金につながっている。", "question": "What change would most effectively address this reliability issue?", "question_ja": "この信頼性の問題に最も効果的に対処する変更は何か？", "choices": {"A": "Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID.", "B": "Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations.", "C": "Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details.", "D": "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type."}, "choices_ja": {"A": "get_customerが検証済みの顧客IDを返すまで、lookup_orderとprocess_refundの呼び出しをブロックするプログラム的な前提条件を追加する", "B": "注文操作の前にget_customerによる顧客確認が必須であることを述べるよう、システムプロンプトを強化する", "C": "顧客が注文の詳細を自発的に伝えた場合でも、エージェントが常に最初にget_customerを呼び出すことを示すfew-shot例を追加する", "D": "各リクエストを分析し、そのリクエストタイプに適したツールのサブセットのみを有効化するルーティング分類器を実装する"}, "answer": "A", "explanation_ja": "重要な業務ロジック（払い戻し前の本人確認など）で特定のツール順序が必須な場合、プログラム的強制は決定的な保証を与えるが、プロンプトベースの方法（B・C）は確率的な遵守しか得られず、金銭的影響がある場面では不十分。D はツールの利用可否の話でありツール『順序』の問題を解決しない。", "source": "materials/official/exam-guide.pdf (Sample Question 1)", "pack": "v1"}, {"id": "OFFICIAL-q002", "statement_id": "D2-1", "scenario": "Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of calling lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats.", "scenario_ja": "本番ログによると、ユーザーが注文について尋ねたとき（例：「注文番号12345を確認して」）、エージェントはlookup_orderではなくget_customerを頻繁に呼び出している。両方のツールとも説明が最小限（「顧客情報を取得する」／「注文詳細を取得する」）であり、似たような識別子形式を受け付ける。", "question": "What's the most effective first step to improve tool selection reliability?", "question_ja": "ツール選択の信頼性を改善する最も効果的な最初のステップは何か？", "choices": {"A": "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples showing order-related queries routing to lookup_order.", "B": "Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools.", "C": "Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns.", "D": "Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query."}, "choices_ja": {"A": "注文関連のクエリがlookup_orderにルーティングされることを示す5〜8個の例を含む、正しいツール選択パターンを示すfew-shot例をシステムプロンプトに追加する", "B": "各ツールの説明を拡張し、扱う入力形式、クエリの例、エッジケース、似たツールとの使い分けの境界を含める", "C": "各ターンの前にユーザー入力を解析し、検出されたキーワードと識別子パターンに基づいて適切なツールを事前選択するルーティング層を実装する", "D": "任意の識別子を受け付け内部でどのバックエンドに問い合わせるかを判断する単一のlookup_entityツールに両方のツールを統合する"}, "answer": "B", "explanation_ja": "ツールの説明文はLLMがツール選択に使う主要な手がかり。説明が最小限だと似たツールを区別できない。B は根本原因に対する低コスト・高レバレッジな修正。A はトークンオーバーヘッドを増やすが根本解決にならず、C は過剰設計でLLMの自然言語理解を迂回、D は有効な設計選択肢だが『最初の一手』としては大掛かりすぎる。", "source": "materials/official/exam-guide.pdf (Sample Question 2)", "pack": "v1"}, {"id": "OFFICIAL-q003", "statement_id": "D5-2", "scenario": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions.", "scenario_ja": "あなたのエージェントは初回対応解決率55%を達成しており、目標の80%を大きく下回っている。ログによると、写真証拠付きの標準的な破損交換のような単純なケースをエスカレーションする一方で、ポリシー例外を必要とする複雑な状況を自律的に処理しようとしている。", "question": "What's the most effective way to improve escalation calibration?", "question_ja": "エスカレーションの較正を改善する最も効果的な方法は何か？", "choices": {"A": "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.", "B": "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.", "C": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.", "D": "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold."}, "choices_ja": {"A": "自律的に解決すべき場合とエスカレーションすべき場合を示すfew-shot例とともに、明示的なエスカレーション基準をシステムプロンプトに追加する", "B": "各応答の前にエージェントに信頼度スコア（1〜10）を自己申告させ、信頼度が閾値を下回った場合は自動的にリクエストを人間にルーティングする", "C": "メインのエージェントが処理を始める前に、どのリクエストがエスカレーションを必要とするかを予測する、過去のチケットで訓練された別の分類器モデルをデプロイする", "D": "顧客の不満レベルを検知する感情分析を実装し、ネガティブな感情が閾値を超えたら自動的にエスカレーションする"}, "answer": "A", "explanation_ja": "明示的なエスカレーション基準とfew-shot例は『判断境界が不明確』という根本原因に直接対処する、段階的に妥当な最初の対応。B はLLMの自己申告信頼度が既に誤って高いため機能しない。C はプロンプト最適化を試す前のオーバーエンジニアリング。D は感情と案件の複雑さは相関しないため見当違い。", "source": "materials/official/exam-guide.pdf (Sample Question 3)", "pack": "v1"}, {"id": "OFFICIAL-q004", "statement_id": "D3-2", "scenario": "You want to create a custom /review slash command that runs your team's standard code review checklist. This command should be available to every developer when they clone or pull the repository.", "scenario_ja": "あなたは、チームの標準的なコードレビューチェックリストを実行するカスタムの/reviewスラッシュコマンドを作成したいと考えている。このコマンドは、開発者がリポジトリをクローンまたはプルしたときに、すべての開発者が利用できるようにする必要がある。", "question": "Where should you create this command file?", "question_ja": "このコマンドファイルはどこに作成すべきか？", "choices": {"A": "In the .claude/commands/ directory in the project repository", "B": "In ~/.claude/commands/ in each developer's home directory", "C": "In the CLAUDE.md file at the project root", "D": "In a .claude/config.json file with a commands array"}, "choices_ja": {"A": "プロジェクトリポジトリ内の.claude/commands/ディレクトリ", "B": "各開発者のホームディレクトリの~/.claude/commands/", "C": "プロジェクトルートのCLAUDE.mdファイル", "D": "commands配列を持つ.claude/config.jsonファイル"}, "answer": "A", "explanation_ja": "プロジェクトスコープのカスタムスラッシュコマンドは .claude/commands/ に置く。バージョン管理され、clone/pull した全開発者に自動的に共有される。B はバージョン管理外の個人用コマンド。C は指示・文脈用でコマンド定義用ではない。D はClaude Codeに存在しない仕組み。", "source": "materials/official/exam-guide.pdf (Sample Question 4)", "pack": "v1"}, {"id": "OFFICIAL-q005", "statement_id": "D3-4", "scenario": "You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies.", "scenario_ja": "あなたはチームのモノリシックなアプリケーションをマイクロサービスに再構成する任務を割り当てられた。これは数十のファイルにわたる変更を伴い、サービス境界とモジュールの依存関係についての判断を必要とする。", "question": "Which approach should you take?", "question_ja": "どのアプローチを取るべきか？", "choices": {"A": "Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.", "B": "Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries.", "C": "Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured.", "D": "Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation."}, "choices_ja": {"A": "変更を加える前に、コードベースを探索し依存関係を理解し実装アプローチを設計するため、plan modeに入る", "B": "直接実行から始め、段階的に変更を加え、実装が自然なサービス境界を明らかにするに任せる", "C": "各サービスをどう構造化すべきかを詳細に示す包括的な事前指示を伴う直接実行を使う", "D": "直接実行モードで始め、実装中に予期しない複雑さに遭遇した場合にのみplan modeに切り替える"}, "answer": "A", "explanation_ja": "plan mode は大規模な変更・複数の妥当なアプローチ・アーキテクチャ判断が伴うタスクに向いており、変更を確定する前に安全な探索と設計を可能にする——モノリスからマイクロサービスへの再構成はまさにその典型。B は依存関係を後から発見してコストのかかる手戻りを招くリスク、C は正しい構造を探索せずに前提してしまっている、D は要件自体が既に複雑であることを無視している。", "source": "materials/official/exam-guide.pdf (Sample Question 5)", "pack": "v1"}, {"id": "OFFICIAL-q006", "statement_id": "D3-3", "scenario": "Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location.", "scenario_ja": "あなたのコードベースには異なるコーディング規約を持つ明確な領域がある：Reactコンポーネントはフックを使った関数型スタイル、APIハンドラーは特定のエラー処理を伴うasync/await、データベースモデルはリポジトリパターンに従う。テストファイルはテスト対象のコードのそばにコードベース全体に散らばっており（例：Button.test.tsxはButton.tsxの隣）、場所に関わらずすべてのテストが同じ規約に従ってほしいと考えている。", "question": "What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?", "question_ja": "Claudeがコード生成時に正しい規約を自動的に適用することを保証する最も保守しやすい方法は何か？", "choices": {"A": "Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths", "B": "Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies", "C": "Create skills in .claude/skills/ for each code type that include the relevant conventions in their SKILL.md files", "D": "Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions"}, "choices_ja": {"A": "ファイルパスに基づいて規約を条件付きで適用するグロブパターンを指定したYAMLフロントマターを持つルールファイルを.claude/rules/に作成する", "B": "各領域のヘッダーの下にすべての規約をルートのCLAUDE.mdファイルに統合し、どのセクションが適用されるかはClaudeの推論に任せる", "C": "関連する規約をSKILL.mdファイルに含む、各コードタイプ用のskillを.claude/skills/に作成する", "D": "各サブディレクトリに、その領域固有の規約を含む別々のCLAUDE.mdファイルを配置する"}, "answer": "A", "explanation_ja": ".claude/rules/ のグロブパターン（例: **/*.test.tsx）はファイルパスに基づき規約を自動適用でき、ディレクトリ横断的に散らばるテストファイルに必須。B は推論任せで信頼性が低い、C は手動起動またはClaude任せの読み込みになり『自動適用』という要件に反する、D はディレクトリに紐づくためファイルが多方向に散らばるケースに対応しづらい。", "source": "materials/official/exam-guide.pdf (Sample Question 6)", "pack": "v1"}, {"id": "OFFICIAL-q007", "statement_id": "D1-2", "scenario": "After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\"", "scenario_ja": "「AIがクリエイティブ産業に与える影響」というトピックでシステムを実行した後、各サブエージェントは正常に完了していることが分かった：Web検索エージェントは関連記事を見つけ、文書分析エージェントは論文を正しく要約し、統合エージェントは首尾一貫した出力を生成した。しかし最終レポートは視覚芸術のみを扱っており、音楽・執筆・映画制作を完全に見落としている。コーディネーターのログを調べると、トピックを「デジタルアートにおけるAI」「グラフィックデザインにおけるAI」「写真におけるAI」という3つのサブタスクに分解していたことが分かった。", "question": "What is the most likely root cause?", "question_ja": "最も可能性の高い根本原因は何か？", "choices": {"A": "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.", "B": "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.", "C": "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.", "D": "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria."}, "choices_ja": {"A": "統合エージェントには、他のエージェントから受け取った所見の中でカバレッジのギャップを特定するための指示が欠けている", "B": "コーディネーターエージェントのタスク分解が狭すぎるため、トピックの関連するすべての領域をカバーしていないサブエージェントの割り当てになっている", "C": "Web検索エージェントのクエリが十分に包括的でなく、より多くのクリエイティブ産業のセクターをカバーするよう拡張する必要がある", "D": "文書分析エージェントは過度に制限的な関連性基準により、視覚芸術以外のクリエイティブ産業に関連する情報源をフィルタリングして除外している"}, "answer": "B", "explanation_ja": "コーディネーターのログが根本原因を直接示している：『creative industries』を視覚芸術のサブタスクのみに分解し、音楽・執筆・映画を完全に見落としている。サブエージェントは割り当てられたタスクを正しく実行しており、問題は『何を割り当てたか』にある。A・C・D は正しく動作している下流エージェントを誤って責めている。", "source": "materials/official/exam-guide.pdf (Sample Question 7)", "pack": "v1"}, {"id": "OFFICIAL-q008", "statement_id": "D5-3", "scenario": "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent.", "scenario_ja": "Web検索サブエージェントが複雑なトピックを調査中にタイムアウトした。あなたはこの失敗情報がどのようにコーディネーターエージェントに伝わるべきかを設計する必要がある。", "question": "Which error propagation approach best enables intelligent recovery?", "question_ja": "賢明な復旧を最も可能にするエラー伝播のアプローチはどれか？", "choices": {"A": "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.", "B": "Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted.", "C": "Catch the timeout within the subagent and return an empty result set marked as successful.", "D": "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow."}, "choices_ja": {"A": "失敗の種類、試みたクエリ、部分的な結果、潜在的な代替アプローチを含む構造化されたエラーコンテキストをコーディネーターに返す", "B": "サブエージェント内で指数バックオフによる自動リトライロジックを実装し、すべてのリトライが尽きた後にのみ一般的な「検索利用不可」ステータスを返す", "C": "サブエージェント内でタイムアウトを捕捉し、成功としてマークされた空の結果セットを返す", "D": "タイムアウト例外を、リサーチワークフロー全体を終了させるトップレベルのハンドラーに直接伝播させる"}, "answer": "A", "explanation_ja": "構造化エラーコンテキストは、コーディネーターが賢い復旧判断（クエリを変えて再試行するか、代替手法を試すか、部分結果で進めるか）を下すために必要な情報を与える。B の画一的ステータスは有用な文脈を隠す、C は失敗を成功として隠蔽し復旧の機会を失わせる、D は復旧できる可能性があるのに不必要にワークフロー全体を止めてしまう。", "source": "materials/official/exam-guide.pdf (Sample Question 8)", "pack": "v1"}, {"id": "OFFICIAL-q009", "statement_id": "D2-3", "scenario": "During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation.", "scenario_ja": "テスト中、統合エージェントは所見を組み合わせる際に特定の主張を検証する必要が頻繁にあることが分かった。現在、検証が必要な場合、統合エージェントは制御をコーディネーターに戻し、コーディネーターがWeb検索エージェントを呼び出し、その後結果とともに統合エージェントを再度呼び出している。これはタスクごとに2〜3回の往復を追加し、レイテンシを40%増加させている。評価によると、これらの検証の85%は単純なファクトチェック（日付、名前、統計）であり、15%はより深い調査を必要とする。", "question": "What's the most effective approach to reduce overhead while maintaining system reliability?", "question_ja": "システムの信頼性を維持しながらオーバーヘッドを削減する最も効果的なアプローチは何か？", "choices": {"A": "Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.", "B": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.", "C": "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.", "D": "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify."}, "choices_ja": {"A": "単純な検索用にスコープを絞ったverify_factツールを統合エージェントに与え、複雑な検証は引き続きコーディネーターを介してWeb検索エージェントに委譲する", "B": "統合エージェントにすべての検証ニーズを蓄積させ、パスの最後にまとめてコーディネーターに返し、コーディネーターがそれらすべてを一度にWeb検索エージェントに送る", "C": "統合エージェントにすべてのWeb検索ツールへのアクセスを与え、コーディネーターを介した往復なしにあらゆる検証ニーズを直接処理できるようにする", "D": "統合エージェントが後で何を検証したくなるかを予測して、Web検索エージェントに初期リサーチ中に各情報源の周辺の追加コンテキストを事前にキャッシュさせる"}, "answer": "A", "explanation_ja": "最小権限の原則を適用し、85%を占める単純なケース（簡易ファクトチェック）に必要な最小限のツールのみを合成エージェントに与えつつ、複雑なケースは既存の調整パターンを維持する。B のバッチ化は合成の各ステップが先に検証した事実に依存する場合ブロッキングを生む、C は関心の分離に反する過剰な権限付与、D は合成エージェントが何を検証したいか予測できない投機的キャッシュ。", "source": "materials/official/exam-guide.pdf (Sample Question 9)", "pack": "v1"}, {"id": "OFFICIAL-q010", "statement_id": "D3-6", "scenario": "Your pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input.", "scenario_ja": "あなたのパイプラインスクリプトはclaude \"Analyze this pull request for security issues\"を実行するが、ジョブが無期限にハングする。ログはClaude Codeが対話的な入力を待っていることを示している。", "question": "What's the correct approach to run Claude Code in an automated pipeline?", "question_ja": "自動化されたパイプラインでClaude Codeを実行する正しい方法は何か？", "choices": {"A": "Add the -p flag: claude -p \"Analyze this pull request for security issues\"", "B": "Set the environment variable CLAUDE_HEADLESS=true before running the command", "C": "Redirect stdin from /dev/null: claude \"Analyze this pull request for security issues\" < /dev/null", "D": "Add the --batch flag: claude --batch \"Analyze this pull request for security issues\""}, "choices_ja": {"A": "-pフラグを追加する：claude -p \"Analyze this pull request for security issues\"", "B": "コマンドを実行する前に環境変数CLAUDE_HEADLESS=trueを設定する", "C": "標準入力を/dev/nullからリダイレクトする：claude \"Analyze this pull request for security issues\" < /dev/null", "D": "--batchフラグを追加する：claude --batch \"Analyze this pull request for security issues\""}, "answer": "A", "explanation_ja": "-p（または--print）フラグはClaude Codeを非対話モードで実行する正規の方法。プロンプトを処理してstdoutに結果を出力し、ユーザー入力を待たずに終了する——CI/CDパイプラインが必要とする挙動そのもの。他の選択肢は存在しない機能（CLAUDE_HEADLESS環境変数、--batchフラグ）や、Claude Codeのコマンド構文に正しく対処しないUnix的回避策を参照している。", "source": "materials/official/exam-guide.pdf (Sample Question 10)", "pack": "v1"}, {"id": "OFFICIAL-q011", "statement_id": "D4-5", "scenario": "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings.", "scenario_ja": "あなたのチームは自動分析のAPIコストを削減したいと考えている。現在、リアルタイムのClaude呼び出しが2つのワークフローを動かしている：(1) 開発者がマージする前に完了しなければならないブロッキング型のpre-mergeチェック、(2) 翌朝レビューするための夜間生成される技術的負債レポート。あなたのマネージャーは、50%のコスト削減のため両方をMessage Batches APIに切り替えることを提案している。", "question": "How should you evaluate this proposal?", "question_ja": "この提案をどう評価すべきか？", "choices": {"A": "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", "B": "Switch both workflows to batch processing with status polling to check for completion.", "C": "Keep real-time calls for both workflows to avoid batch result ordering issues.", "D": "Switch both to batch processing with a timeout fallback to real-time if batches take too long."}, "choices_ja": {"A": "技術的負債レポートのみバッチ処理を使い、pre-mergeチェックはリアルタイム呼び出しのままにする", "B": "両方のワークフローを、完了確認のためのステータスポーリングを伴うバッチ処理に切り替える", "C": "バッチ結果の順序の問題を避けるため、両方ともリアルタイム呼び出しのままにする", "D": "バッチが時間がかかりすぎる場合にリアルタイムへフォールバックするタイムアウトを伴い、両方をバッチ処理に切り替える"}, "answer": "A", "explanation_ja": "Message Batches APIは50%のコスト削減を提供するが、処理時間は最大24時間でレイテンシSLAの保証がない。これは開発者が結果を待つブロッキングなpre-mergeチェックには不向きだが、夜間の技術的負債レポートのようなジョブには最適。B は『しばしば速い』ことに依存しブロッキングワークフローには受け入れがたい。C は誤解（バッチ結果はcustom_idで相関できる）に基づく。D はシンプルな解（各APIを適切な用途に合わせる）で足りるのに不要な複雑さを加えている。", "source": "materials/official/exam-guide.pdf (Sample Question 11)", "pack": "v1"}, {"id": "OFFICIAL-q012", "statement_id": "D4-6", "scenario": "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR.", "scenario_ja": "あるプルリクエストが在庫追跡モジュール内の14個のファイルを変更している。すべてのファイルを一緒に分析する単一パスのレビューは、一貫性のない結果を生んでいる：一部のファイルには詳細なフィードバックがある一方で他は表面的なコメントにとどまり、明白なバグが見落とされ、矛盾したフィードバックも生じている——同じPR内の同一のコードを、あるファイルでは問題ありとフラグしながら別の場所では承認している。", "question": "How should you restructure the review?", "question_ja": "レビューをどう再構成すべきか？", "choices": {"A": "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.", "B": "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.", "C": "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", "D": "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs."}, "choices_ja": {"A": "焦点を絞ったパスに分割する：各ファイルを個別にローカルな問題について分析し、その後ファイル横断のデータフローを調べる別の統合フォーカスのパスを実行する", "B": "自動レビューが実行される前に、開発者に大きなPRを3〜4ファイルずつの小さな提出に分割することを求める", "C": "14個のファイルすべてに1回のパスで十分な注意を払えるよう、より大きなコンテキストウィンドウを持つ上位モデルに切り替える", "D": "PR全体に対して3回の独立したレビューパスを実行し、3回のうち少なくとも2回で現れた問題のみをフラグする"}, "answer": "A", "explanation_ja": "フォーカスを絞ったパスへの分割は根本原因（多数のファイルを一度に処理することによる注意の希釈）に直接対処する。ファイル単位の分析は一貫した深さを保証し、別途の統合パスがファイル横断の問題を捕捉する。B は開発者に負担を移すだけでシステム自体は改善しない、C はコンテキストウィンドウの拡大が注意の質の問題を解決しないという誤解、D は断続的にしか検出されない実際のバグをコンセンサス要求によってかえって見逃す可能性がある。", "source": "materials/official/exam-guide.pdf (Sample Question 12)", "pack": "v1"}];
const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSdOZyIlke2oBJDE2SJKgNkS6F0oVG3fkgMq0DW8J_eFHyxX-w/viewform";
const FORM_ENTRY = "entry.1699881175";

// ダッシュボードの各ボタンは ?ids=id1,id2,... で専用の問題セットを指定する。
// 埋め込み済みの全問題バンクから該当IDだけを抜き出す（無効/該当なしなら既定セットに戻る）。
let QUESTIONS = QUESTIONS_DEFAULT;
const idsParam = new URLSearchParams(location.search).get("ids");
if (idsParam) {
  const wanted = idsParam.split(",");
  const byId = Object.fromEntries(QUESTIONS_ALL.map(q => [q.id, q]));
  const picked = wanted.map(id => byId[id]).filter(Boolean);
  if (picked.length) QUESTIONS = picked;
}
let idx = 0; const results = [];
const $ = (id) => document.getElementById(id);
if (idsParam && QUESTIONS !== QUESTIONS_DEFAULT) {
  const doms = [...new Set(QUESTIONS.map(q => q.id.split("-")[0]))].sort().join("+");
  $("setlabel").textContent = "CCA-F Practice · " + doms + " · " + QUESTIONS.length + "問";
}
// 選択肢の「並び順」だけをセッションごとにシャッフルする（ラベルA〜Dは元の記号のまま表示）。
// ラベルまで表示位置基準に振り直すと、解説文(explanation_ja)が元の記号を前提に
// 「Bが正解で…」と書かれているため画面表示と解説が食い違ってしまう（2026-08-21〜24で発覚）。
// ラベルは元の記号のまま・位置だけ変えることで、解説との整合を保ちつつ「2問目はいつも
// 同じ位置」という位置記憶だけを防ぐ。
const POS = ["A","B","C","D"];
function orderFor(q) {
  if (!q.__order) {
    const keys = POS.slice();
    for (let i = keys.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [keys[i], keys[j]] = [keys[j], keys[i]];
    }
    q.__order = keys;
  }
  return q.__order;
}
function render() {
  const q = QUESTIONS[idx];
  const order = orderFor(q);
  $("counter").textContent = (idx + 1) + " / " + QUESTIONS.length;
  $("pbar").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("domchip").textContent = q.statement_id;
  $("scenario").textContent = q.scenario;
  $("question").textContent = q.question;
  $("feedback").classList.add("hidden");
  const box = $("choices"); box.innerHTML = "";
  order.forEach((key, i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.dataset.key = key;
    const k = document.createElement("span"); k.className = "key"; k.textContent = key;
    const t = document.createElement("span"); t.textContent = q.choices[key];
    b.append(k, t); b.addEventListener("click", () => answer(key));
    box.appendChild(b);
  });
  $("jascenario").textContent = q.scenario_ja || "";
  $("jaquestion").textContent = q.question_ja || "";
  const jac = $("jachoices"); jac.innerHTML = "";
  order.forEach((key, i) => {  // 日本語訳も英語と同じ並びに合わせる
    const p = document.createElement("p"); p.className = "jac";
    const b = document.createElement("b"); b.textContent = key + ". ";
    p.append(b, document.createTextNode((q.choices_ja || {})[key] || ""));
    jac.appendChild(p);
  });
  $("jabox").classList.add("hidden");
  $("jabtn").textContent = "日本語訳を表示";
}
$("jabtn").addEventListener("click", () => {
  const shown = $("jabox").classList.toggle("hidden") === false;
  $("jabtn").textContent = shown ? "日本語訳を隠す" : "日本語訳を表示";
});
function answer(key) {
  const q = QUESTIONS[idx];
  const correct = key === q.answer;
  results.push({ id: q.id, correct });
  for (const b of document.querySelectorAll(".choice")) {
    b.disabled = true;
    if (b.dataset.key === q.answer) b.classList.add("correct");
    else if (b.dataset.key === key && !correct) b.classList.add("wrong");
  }
  const v = $("verdict");
  v.textContent = correct ? "✓ Correct" : "✗ Incorrect — correct answer: " + q.answer;
  v.className = "verdict " + (correct ? "ok" : "ng");
  $("expl").textContent = q.explanation_ja;
  const a = $("srclink"); a.href = q.source; a.textContent = q.source;
  $("nextbtn").textContent = idx === QUESTIONS.length - 1 ? "結果を見る →" : "次の問題 →";
  $("feedback").classList.remove("hidden");
  $("feedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
$("nextbtn").addEventListener("click", () => {
  idx += 1;
  if (idx < QUESTIONS.length) { render(); window.scrollTo({top:0}); } else { finish(); }
});
function finish() {
  $("quiz").classList.add("hidden");
  $("pbar").style.width = "100%";
  const ok = results.filter(r => r.correct).length;
  $("scoreline").textContent = ok + " / " + results.length;
  const list = $("reslist");
  for (const r of results) {
    const q = QUESTIONS.find(x => x.id === r.id);
    const row = document.createElement("div"); row.className = "row";
    const m = document.createElement("span"); m.className = "mark";
    m.textContent = r.correct ? "✓" : "✗"; m.style.color = r.correct ? "var(--ok)" : "var(--ng)";
    const t = document.createElement("span");
    t.textContent = r.id + " (" + q.statement_id + ") " + q.question.slice(0, 60) + "…";
    row.append(m, t); list.appendChild(row);
  }
  const d = new Date(), pad = (n) => String(n).padStart(2, "0");
  const today = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const code = "QR|" + today + "|quiz-artifact|" + results.map(r => r.id + ":" + (r.correct ? "o" : "x")).join(",");
  $("qrcode").textContent = code;
  if (FORM_BASE && FORM_ENTRY) {
    const sep = FORM_BASE.includes("?") ? "&" : "?";
    $("formbtn").href = FORM_BASE + sep + FORM_ENTRY + "=" + encodeURIComponent(code);
    $("formbtn").classList.remove("hidden");
  }
  $("copybtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code); $("copybtn").textContent = "コピーしました ✓"; }
    catch { const sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents($("qrcode")); sel.removeAllRanges(); sel.addRange(rg);
      $("copybtn").textContent = "選択しました — 長押しでコピー"; }
  });
  $("final").classList.remove("hidden");
}
render();
</script>
