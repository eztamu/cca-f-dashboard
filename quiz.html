<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA-F 模擬クイズ</title>
<style>

:root {
  --surface:#F5F6F9; --card:#FFFFFF; --ink:#1C2536; --sub:#5C6678; --line:#E3E6EE;
  --accent:#3B55C4; --accent-soft:#E7EBFA; --ok:#1E7F4F; --ok-soft:#E2F2E9;
  --ng:#C2403B; --ng-soft:#F9E7E6; --due:#B07C1F; --due-soft:#F7EEDC;
}
@media (prefers-color-scheme: dark) { :root {
  --surface:#12161F; --card:#1B2230; --ink:#E7EBF4; --sub:#98A2B6; --line:#2A3245;
  --accent:#5D74D8; --accent-soft:#232C4A; --ok:#3A9A6D; --ok-soft:#1B3128;
  --ng:#C95F5B; --ng-soft:#3A2323; --due:#A9843C; --due-soft:#332B18;
} }
:root[data-theme="light"] {
  --surface:#F5F6F9; --card:#FFFFFF; --ink:#1C2536; --sub:#5C6678; --line:#E3E6EE;
  --accent:#3B55C4; --accent-soft:#E7EBFA; --ok:#1E7F4F; --ok-soft:#E2F2E9;
  --ng:#C2403B; --ng-soft:#F9E7E6; --due:#B07C1F; --due-soft:#F7EEDC;
}
:root[data-theme="dark"] {
  --surface:#12161F; --card:#1B2230; --ink:#E7EBF4; --sub:#98A2B6; --line:#2A3245;
  --accent:#5D74D8; --accent-soft:#232C4A; --ok:#3A9A6D; --ok-soft:#1B3128;
  --ng:#C95F5B; --ng-soft:#3A2323; --due:#A9843C; --due-soft:#332B18;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--surface); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased; }
.wrap { max-width:660px; margin:0 auto; padding:16px 16px 48px; display:flex; flex-direction:column; gap:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
.eyebrow { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); font-weight:600; }
.chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); }
button { font:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
.num { font-variant-numeric:tabular-nums; }

.scenario { font-family:"Iowan Old Style",Georgia,"Hiragino Mincho ProN",serif; font-size:16.5px; }
.qtext { font-weight:650; margin:12px 0 4px; }
.choices { display:flex; flex-direction:column; gap:10px; }
.choice { display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
  color:var(--ink); transition:border-color .12s; }
.choice:not(:disabled):hover { border-color:var(--accent); }
.choice .key { font-weight:700; color:var(--accent); flex:0 0 auto; }
.choice.correct { border-color:var(--ok); background:var(--ok-soft); }
.choice.wrong { border-color:var(--ng); background:var(--ng-soft); }
.choice:disabled { cursor:default; opacity:.92; }
.verdict { font-weight:700; }
.verdict.ok { color:var(--ok); } .verdict.ng { color:var(--ng); }
.expl { border-left:3px solid var(--accent); padding:2px 0 2px 12px; margin-top:10px; font-size:14.5px; }
.expl a { color:var(--accent); word-break:break-all; font-size:13px; }
.next { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px; font-weight:700; width:100%; }
.progressbar { height:6px; background:var(--line); border-radius:999px; overflow:hidden; }
.progressbar > div { height:100%; background:var(--accent); border-radius:999px; transition:width .2s; }
.topline { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.score { font-size:40px; font-weight:750; }
.qr { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; background:var(--surface);
  border:1px dashed var(--line); border-radius:8px; padding:10px; word-break:break-all; user-select:all; }
.copybtn { background:var(--card); color:var(--accent); border:1.5px solid var(--accent);
  border-radius:10px; padding:11px; font-weight:700; width:100%; margin-top:8px; }
.reslist { display:flex; flex-direction:column; gap:6px; font-size:14px; }
.reslist .row { display:flex; gap:8px; align-items:baseline; }
.mark { font-weight:700; flex:0 0 1.2em; }
.hidden { display:none; }
.formbtn { display:block; text-align:center; text-decoration:none; background:var(--accent); color:#fff;
  border:none; border-radius:10px; padding:13px; font-weight:700; width:100%; margin-top:8px; }
.jabtn { background:var(--card); color:var(--sub); border:1.5px dashed var(--line);
  border-radius:10px; padding:10px; font-weight:700; width:100%; margin-top:12px; }
.jabtn:hover { border-color:var(--accent); color:var(--accent); }
.jabox { border-left:3px solid var(--sub); padding:2px 0 2px 12px; margin-top:10px; font-size:14.5px; color:var(--sub); }
.jabox .jaq { color:var(--ink); margin:0 0 8px; }
.jabox .jac { margin:2px 0; }
.jabox .jac b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div>
    <div class="topline">
      <span class="eyebrow" id="setlabel">CCA-F Practice · D1+D4+D5 · 10問</span>
      <span class="eyebrow num" id="counter"></span>
    </div>
    <div class="progressbar" aria-hidden="true"><div id="pbar" style="width:0%"></div></div>
  </div>
  <div id="quiz" class="card">
    <span class="chip" id="domchip"></span>
    <p class="scenario" id="scenario"></p>
    <p class="qtext" id="question"></p>
    <div class="choices" id="choices"></div>
    <button class="jabtn" id="jabtn">日本語訳を表示</button>
    <div id="jabox" class="jabox hidden">
      <p class="jaq" id="jascenario"></p>
      <p class="jaq" id="jaquestion"></p>
      <div id="jachoices"></div>
    </div>
    <div id="feedback" class="hidden">
      <p class="verdict" id="verdict"></p>
      <div class="expl"><span id="expl"></span><br><a id="srclink" target="_blank" rel="noopener"></a></div>
      <button class="next" id="nextbtn" style="margin-top:14px">次の問題 →</button>
    </div>
  </div>
  <div id="final" class="card hidden">
    <span class="eyebrow">Result</span>
    <div class="score num" id="scoreline"></div>
    <div class="reslist" id="reslist"></div>
    <a id="formbtn" class="formbtn hidden" target="_blank" rel="noopener">📮 結果を送信して記録</a>
    <p style="margin:16px 0 6px; font-weight:650;">結果コード（手動記録用・コピーして Claude に貼り付け）</p>
    <div class="qr" id="qrcode"></div>
    <button class="copybtn" id="copybtn">結果コードをコピー</button>
  </div>
</div>
<script>
const QUESTIONS_DEFAULT = [{"id": "D4-q003", "statement_id": "D4-1", "scenario": "A financial-analysis prompt asks Claude for a final recommendation on a complex multi-factor decision. Answers are quick but frequently miss important considerations.", "scenario_ja": "ある財務分析プロンプトは、複雑な多要因の意思決定についてClaudeに最終的な推奨を求めている。回答は速いが、重要な考慮事項をしばしば見落としている。", "question": "Which technique most directly improves answer quality here?", "question_ja": "ここで回答の品質を最も直接的に改善する技法はどれか？", "choices": {"A": "Chain of thought: instruct Claude to reason through the factors step by step before giving the recommendation (or enable extended thinking)", "B": "Lower max_tokens to force more focused answers", "C": "Ask for the recommendation first, then the reasoning, so the answer is not biased", "D": "Split every factor into a separate unrelated conversation"}, "choices_ja": {"A": "Chain of thought：推奨を出す前に要因を段階的に推論するようClaudeに指示する（またはextended thinkingを有効にする）", "B": "より焦点を絞った回答を強制するためmax_tokensを下げる", "C": "答えが偏らないよう、まず推奨を求め、その後に理由付けを求める", "D": "すべての要因をそれぞれ無関係な別の会話に分割する"}, "answer": "A", "explanation_ja": "複雑な多要因の判断には Chain of Thought（段階的に考えさせてから結論）や extended thinking が有効。順序が重要で、推論→結論の順にする。C は逆（結論を先に出させると推論が後付けになる）。B は思考の余地を奪う。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-of-thought", "pack": "v1"}, {"id": "D4-q006", "statement_id": "D4-1", "scenario": "A legal-tech product needs Claude to consistently respond as a cautious legal analyst across thousands of API calls: same persona, same constraints, same output conventions.", "scenario_ja": "あるリーガルテック製品は、数千回のAPI呼び出しにわたって、Claudeが慎重な法務アナリストとして一貫して応答する必要がある：同じペルソナ、同じ制約、同じ出力の慣習を保つ。", "question": "Where should this persona definition live?", "question_ja": "このペルソナ定義はどこに置くべきか？", "choices": {"A": "In the system prompt (system parameter), defining the role, task framing, and constraints once for every request", "B": "Repeated at the start of every user message", "C": "In the first assistant message as a self-introduction", "D": "In tool descriptions, since they are read most carefully"}, "choices_ja": {"A": "システムプロンプト（systemパラメータ）に置き、すべてのリクエストに対して役割・タスクの枠組み・制約を一度だけ定義する", "B": "すべてのuserメッセージの冒頭で繰り返す", "C": "自己紹介として最初のassistantメッセージに置く", "D": "最も注意深く読まれるため、ツールの説明文に置く"}, "answer": "A", "explanation_ja": "役割（role）とタスクの枠組みは system プロンプトに置くのが基本。全リクエストに一貫して効き、キャッシュ効率も良い（安定した接頭辞）。B は冗長でキャッシュを乱し、C/D は本来の用途ではなく効果も不安定。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/system-prompts", "pack": "v1"}, {"id": "D4-q007", "statement_id": "D4-5", "scenario": "A company must classify 80,000 archived documents. There is no latency requirement — results are needed within a day — and cost matters.", "scenario_ja": "ある企業は8万件のアーカイブ文書を分類しなければならない。レイテンシ要件はなく（結果は1日以内に必要）、コストが重要である。", "question": "What is the most cost-effective approach?", "question_ja": "最もコスト効率の良いアプローチは何か？", "choices": {"A": "Send 80,000 sequential Messages API requests with a large model", "B": "Use the Message Batches API, which processes requests asynchronously at 50% of standard prices (most batches complete within an hour, max 24 hours)", "C": "Send all 80,000 documents in one giant request to save on per-request overhead", "D": "Use streaming to reduce token costs"}, "choices_ja": {"A": "大きなモデルを使って8万回の逐次的なMessages APIリクエストを送信する", "B": "標準価格の50%で非同期に処理されるMessage Batches APIを使う（ほとんどのバッチは1時間以内に完了、最大24時間）", "C": "リクエストごとのオーバーヘッドを節約するため、8万件の文書すべてを1つの巨大なリクエストで送る", "D": "トークンコストを減らすためストリーミングを使う"}, "answer": "B", "explanation_ja": "レイテンシ要件がない大量処理は Batch API 一択：全トークン50%引き、非同期で最大24時間以内に処理。1バッチ最大10万リクエスト。C は 1リクエストのコンテキスト上限を超えるし、そもそも安くならない。D のストリーミングは配信方式でありコストは変わらない。モデルの選択（Haiku等）も併用できる。", "source": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "pack": "v1"}, {"id": "D4-q008", "statement_id": "D4-6", "scenario": "A team asks the same Claude conversation that wrote a piece of code to review it for bugs. The review consistently reports 'no issues', yet bugs are later found in production.", "scenario_ja": "あるチームは、コードを書いたのと同じClaudeの会話に、バグがないかそのコードをレビューさせている。レビューは一貫して「問題なし」と報告するが、後になって本番環境でバグが見つかる。", "question": "What is the architectural lesson?", "question_ja": "アーキテクチャ上の教訓は何か？", "choices": {"A": "Claude cannot review code at all; only humans should review", "B": "Self-review within the same context is limited — the model is anchored by its own reasoning; use an independent instance with fresh context (and ideally a review-focused prompt) for critique", "C": "The review prompt needs the word 'CRITICAL' added", "D": "Reviews should run at a higher temperature for more creativity"}, "choices_ja": {"A": "Claudeはコードレビューをまったくできない。人間だけがレビューすべきである", "B": "同一コンテキスト内でのself-reviewには限界がある——モデルは自分自身の推論にアンカリングされてしまう。批評には新しいコンテキストを持つ独立したインスタンス（理想的にはレビューに特化したプロンプト）を使うべきである", "C": "レビュープロンプトに「CRITICAL」という単語を追加する必要がある", "D": "レビューはより創造性を発揮できるよう、より高いtemperatureで実行すべきである"}, "answer": "B", "explanation_ja": "同一コンテキストでの self-review は自分の推論・前提にアンカリングされ欠陥を見逃しやすい。独立したコンテキスト（別インスタンス・レビュー専用プロンプト）でのレビューが有効。信頼性設計の定石で、Claude Code のサブエージェントレビューも同じ発想。A は極端、C/D は本質でない。", "source": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "pack": "v1"}, {"id": "D5-q003", "statement_id": "D5-3", "scenario": "In a multi-agent pipeline, a subagent's database tool fails intermittently. The current implementation silently drops failed tool calls, so the orchestrator receives incomplete data without knowing anything went wrong.", "scenario_ja": "あるマルチエージェントパイプラインでは、サブエージェントのデータベースツールが断続的に失敗する。現在の実装は失敗したツール呼び出しを黙って破棄しているため、オーケストレーターは何か問題が起きたことを知らないまま不完全なデータを受け取っている。", "question": "What is the correct error-propagation pattern?", "question_ja": "正しいエラー伝播のパターンは何か？", "choices": {"A": "Return a tool_result with is_error: true and an informative message so the model can adapt, and surface persistent failures to the orchestrator for escalation", "B": "Retry silently forever until the tool succeeds", "C": "Terminate the entire pipeline on any single tool failure", "D": "Have the subagent fabricate plausible data so the pipeline continues smoothly"}, "choices_ja": {"A": "is_error: trueと有用なメッセージを持つtool_resultを返し、モデルが適応できるようにする。継続的な失敗はエスカレーションのためオーケストレーターに表面化させる", "B": "ツールが成功するまで永遠に黙ってリトライする", "C": "1つでもツールが失敗したらパイプライン全体を終了する", "D": "パイプラインが滞りなく続くよう、サブエージェントにもっともらしいデータを捏造させる"}, "answer": "A", "explanation_ja": "エラーは隠さず構造化して伝える：tool_result に is_error: true と有用なメッセージを入れればモデルはリトライや代替手段を選べる。継続的な失敗は上位（オーケストレーター/人間）へエスカレーション。B は停止しない恐れ、C は過剰、D は最悪（サイレントなデータ汚染）。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", "pack": "v1"}, {"id": "D1-q003", "statement_id": "D1-2", "scenario": "You are designing a research assistant that must gather information from five independent data sources, then combine the findings into a single report. The five lookups do not depend on each other.", "scenario_ja": "あなたは、5つの独立したデータソースから情報を集め、その結果を1つのレポートに統合しなければならないリサーチアシスタントを設計している。5つの検索は互いに依存していない。", "question": "Which multi-agent topology best fits this workload?", "question_ja": "このワークロードに最も適したマルチエージェントのトポロジーはどれか？", "choices": {"A": "Pipeline: each agent processes the output of the previous agent in sequence", "B": "Peer-to-peer: all five agents communicate freely with each other until consensus", "C": "Hub-and-spoke: an orchestrator dispatches the five independent lookups to worker agents in parallel and synthesizes the results", "D": "A single agent that performs all five lookups sequentially to keep the design simple"}, "choices_ja": {"A": "パイプライン：各エージェントが前のエージェントの出力を順番に処理する", "B": "ピアツーピア：5つのエージェントすべてが合意に達するまで自由に通信し合う", "C": "ハブアンドスポーク：オーケストレーターが5つの独立した検索をワーカーエージェントに並列で振り分け、結果を統合する", "D": "設計をシンプルに保つため、単一のエージェントが5つの検索をすべて順番に実行する"}, "answer": "C", "explanation_ja": "互いに依存しない並列タスク＋結果の統合、は典型的な hub-and-spoke（オーケストレーター＋ワーカー）。A のパイプラインは逐次依存がある変換処理向け。B は調整コストが高く、この単純な集約タスクには過剰。D は並列化の利点を捨てており遅い。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q005", "statement_id": "D1-3", "scenario": "An orchestrator agent delegates a code-search subtask to a subagent. The developer passes the orchestrator's entire conversation history (dozens of turns) to the subagent 'so it has full context'.", "scenario_ja": "オーケストレーターエージェントがコード検索のサブタスクをサブエージェントに委譲する。開発者は「サブエージェントが十分な文脈を持てるように」と、オーケストレーターの会話履歴全体（数十ターン分）をサブエージェントに渡している。", "question": "Why is this considered poor design?", "question_ja": "なぜこれは設計として良くないと考えられるのか？", "choices": {"A": "Subagents are technically unable to receive conversation history", "B": "It violates context isolation: the subagent should receive a focused task description, keeping its context clean and its results cheap to produce", "C": "The orchestrator's history must always be summarized by a third agent first", "D": "Passing history is fine; the only problem is increased network latency"}, "choices_ja": {"A": "サブエージェントは技術的に会話履歴を受け取ることができない", "B": "これはコンテキスト分離の原則に反する：サブエージェントは焦点を絞ったタスク記述を受け取るべきであり、それによってコンテキストをクリーンに保ち、結果を安価に生成できる", "C": "オーケストレーターの履歴は必ず先に別のエージェントによって要約されなければならない", "D": "履歴を渡すこと自体は問題なく、唯一の問題はネットワークレイテンシの増加である"}, "answer": "B", "explanation_ja": "サブエージェントの価値は『コンテキスト分離』にある。焦点を絞ったタスク記述だけを渡すことで、トークンコストを抑え、無関係な履歴による注意の分散を防ぐ。全履歴を渡すと分離の利点が消える。A は誤り（渡せてしまうのが問題）。C のような固定ルールはない。D はコストと品質の問題を無視している。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q006", "statement_id": "D1-1", "scenario": "Your agent receives a response with stop_reason 'tool_use' containing two tool_use blocks. You execute both tools successfully.", "scenario_ja": "あなたのエージェントは、2つのtool_useブロックを含むstop_reasonが「tool_use」であるレスポンスを受け取った。あなたは両方のツールを正常に実行した。", "question": "How should the results be sent back to Claude?", "question_ja": "結果はどのようにClaudeに送り返すべきか？", "choices": {"A": "Send two separate user messages, one tool_result per message, in the order the tools were called", "B": "Append one user message containing both tool_result blocks, each carrying the matching tool_use_id", "C": "Append an r any realistic agentic task", "B": "Iteration caps should be a safety backstop, not the primary stop condition; the loop should terminate primarily on stop_reason signals like end_turn", "C": "The agent should instead stop when its response text says the task is complete", "D": "Iteration caps are unnecessary because the API automatically prevents infinite loops"}, "choices_ja": {"A": "10回の反復はどんな現実的なエージェントタスクにとっても少なすぎる", "B": "反復回数の上限は主たる停止条件ではなく安全策のバックストップであるべきで、ループは主にend_turnのようなstop_reasonシグナルで終了すべきである", "C": "エージェントは代わりに、応答テキストがタスク完了を示したときに停止すべきである", "D": "APIが自動的に無限ループを防ぐため、反復回数の上限は不要である"}, "answer": "B", "explanation_ja": "反復回数上限を『主』停止条件にするのはアンチパターン。正常終了は stop_reason（end_turn）で判定し、上限はあくまで暴走防止のセーフティネットとして併用する。C はテキスト判定というもう一つのアンチパターン。D は誤り（API は自動でループを止めない）。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v1"}, {"id": "D1-q003", "statement_id": "D1-2", "scenario": "You are designing a research assistant that must gather information from five independent data sources, then combine the findings into a single report. The five lookups do not depend on each other.", "scenario_ja": "あなたは、5つの独立したデータソースから情報を集め、その結果を1つのレポートに統合しなければならないリサーチアシスタントを設計している。5つの検索は互いに依存していない。", "question": "Which multi-agent topology best fits this workload?", "question_ja": "このワークロードに最も適したマルチエージェントのトポロジーはどれか？", "choices": {"A": "Pipeline: each agent processes the output of the previous agent in sequence", "B": "Peer-to-peer: all five agents communicate freely with each other until consensus", "C": "Hub-and-spoke: an orchestrator dispatches the five independent lookups to worker agents in parallel and synthesizes the results", "D": "A single agent that performs all five lookups sequentially to keep the design simple"}, "choices_ja": {"A": "パイプライン：各エージェントが前のエージェントの出力を順番に処理する", "B": "ピアツーピア：5つのエージェントすべてが合意に達するまで自由に通信し合う", "C": "ハブアンドスポーク：オーケストレーターが5つの独立した検索をワーカーエージェントに並列で振り分け、結果を統合する", "D": "設計をシンプルに保つため、単一のエージェントが5つの検索をすべて順番に実行する"}, "answer": "C", "explanation_ja": "互いに依存しない並列タスク＋結果の統合、は典型的な hub-and-spoke（オーケストレーター＋ワーカー）。A のパイプラインは逐次依存がある変換処理向け。B は調整コストが高く、この単純な集約タスクには過剰。D は並列化の利点を捨てており遅い。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q004", "statement_id": "D1-6", "scenario": "A document processing system must: (1) extract raw text from PDFs, (2) normalize and clean the text, (3) classify each document, and (4) generate a summary. Each stage consumes the previous stage's output.", "scenario_ja": "あるドキュメント処理システムは、(1) PDFから生テキストを抽出し、(2) テキストを正規化・クリーニングし、(3) 各ドキュメントを分類し、(4) 要約を生成する必要がある。各段階は前段階の出力を消費する。", "question": "Which topology is the most natural fit?", "question_ja": "最も自然に適合するトポロジーはどれか？", "choices": {"A": "Pipeline: agents arranged in sequence, each transforming the previous stage's output", "B": "Hub-and-spoke with all four stages running in parallel", "C": "Peer-to-peer so any stage can request rework from any other stage", "D": "A single monolithic prompt asking Claude to do all four steps at once"}, "choices_ja": {"A": "パイプライン：エージェントを順番に並べ、それぞれが前段階の出力を変換する", "B": "4つの段階すべてを並列で実行するハブアンドスポーク", "C": "任意の段階が他の任意の段階に手戻りを要求できるピアツーピア", "D": "Claudeに4つのステップすべてを一度に行わせる単一のモノリシックなプロンプト"}, "answer": "A", "explanation_ja": "各ステージが前段の出力に依存する逐次変換はパイプライン型。B は依存関係があるので並列化できない。C は不要な複雑さ。D はコンテキストが混ざり品質・デバッグ性が落ちる（タスク分解の利点を失う）。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q005", "statement_id": "D1-3", "scenario": "An orchestrator agent delegates a code-search subtask to a subagent. The developer passes the orchestrator's entire conversation history (dozens of turns) to the subagent 'so it has full context'.", "scenario_ja": "オーケストレーターエージェントがコード検索のサブタスクをサブエージェントに委譲する。開発者は「サブエージェントが十分な文脈を持てるように」と、オーケストレーターの会話履歴全体（数十ターン分）をサブエージェントに渡している。", "question": "Why is this considered poor design?", "question_ja": "なぜこれは設計として良くないと考えられるのか？", "choices": {"A": "Subagents are technically unable to receive conversation history", "B": "It violates context isolation: the subagent should receive a focused task description, keeping its context clean and its results cheap to produce", "C": "The orchestrator's history must always be summarized by a third agent first", "D": "Passing history is fine; the only problem is increased network latency"}, "choices_ja": {"A": "サブエージェントは技術的に会話履歴を受け取ることができない", "B": "これはコンテキスト分離の原則に反する：サブエージェントは焦点を絞ったタスク記述を受け取るべきであり、それによってコンテキストをクリーンに保ち、結果を安価に生成できる", "C": "オーケストレーターの履歴は必ず先に別のエージェントによって要約されなければならない", "D": "履歴を渡すこと自体は問題なく、唯一の問題はネットワークレイテンシの増加である"}, "answer": "B", "explanation_ja": "サブエージェントの価値は『コンテキスト分離』にある。焦点を絞ったタスク記述だけを渡すことで、トークンコストを抑え、無関係な履歴による注意の分散を防ぐ。全履歴を渡すと分離の利点が消える。A は誤り（渡せてしまうのが問題）。C のような固定ルールはない。D はコストと品質の問題を無視している。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q006", "statement_id": "D1-1", "scenario": "Your agent receives a response with stop_reason 'tool_use' containing two tool_use blocks. You execute both tools successfully.", "scenario_ja": "あなたのエージェントは、2つのtool_useブロックを含むstop_reasonが「tool_use」であるレスポンスを受け取った。あなたは両方のツールを正常に実行した。", "question": "How should the results be sent back to Claude?", "question_ja": "結果はどのようにClaudeに送り返すべきか？", "choices": {"A": "Send two separate user messages, one tool_result per message, in the order the tools were called", "B": "Append one user message containing both tool_result blocks, each carrying the matching tool_use_id", "C": "Append an assistant message containing the tool results as plain text", "D": "Start a new conversation containing only the tool results to keep context small"}, "choices_ja": {"A": "ツールが呼び出された順序で、1つのメッセージにつき1つのtool_resultを含む、2つの別々のuserメッセージを送る", "B": "対応するtool_use_idをそれぞれ持つ、両方のtool_resultブロックを含む1つのuserメッセージを追加する", "C": "ツール結果をプレーンテキストとして含むassistantメッセージを追加する", "D": "コンテキストを小さく保つため、ツール結果のみを含む新しい会話を開始する"}, "answer": "B", "explanation_ja": "並列ツール呼び出しの結果は『1つの user メッセージ』に全 tool_result ブロックをまとめて返す（各ブロックに対応する tool_use_id が必要）。A のように分割すると並列ツール利用が抑制される悪影響がある。C は role が誤り。D は会話履歴が失われる。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", "pack": "v1"}, {"id": "D1-q007", "statement_id": "D1-6", "scenario": "An agent must update 40 configuration files across a repository. Reviewing the task, you notice each file update is independent, but the team's current implementation processes them one at a time in a single agent conversation, which is slow and fills the context window.", "scenario_ja": "あるエージェントはリポジトリ全体で40個の設定ファイルを更新しなければならない。タスクを確認すると各ファイルの更新は独立しているが、チームの現在の実装は1つの会話の中で1つずつ順番に処理しており、遅い上にコンテキストウィンドウを埋めてしまっている。", "question": "What is the best architectural improvement?", "question_ja": "最良のアーキテクチャ上の改善は何か？", "choices": {"A": "Increase max_tokens so the single conversation can hold more file contents", "B": "Decompose the work and fan it out to parallel subagents, each handling a subset of files with its own context", "C": "Switch to a faster model so the sequential processing completes sooner", "D": "Ask the model to be more concise so the context window fills more slowly"}, "choices_ja": {"A": "単一の会話がより多くのファイル内容を保持できるようmax_tokensを増やす", "B": "作業をタスク分解し、各自のコンテキストを持つ複数のサブエージェントに並列で振り分ける", "C": "逐次処理がより早く完了するよう、より高速なモデルに切り替える", "D": "コンテキストウィンドウがより緩やかに埋まるよう、モデルに簡潔にするよう求める"}, "answer": "B", "explanation_ja": "独立したタスクの集合はタスク分解＋並列実行が定石。サブエージェントごとに独立したコンテキストを持たせることで、速度とコンテキスト圧迫の両方を解決できる。A/C/D はいずれも根本原因（逐次処理と単一コンテキスト）に対処していない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q008", "statement_id": "D1-1", "scenario": "A team wants to build a production coding agent. They are deciding between calling the Messages API directly with their own loop, or using the Claude Agent SDK.", "scenario_ja": "あるチームは本番用のコーディングエージェントを構築しようとしている。Messages APIを直接呼び出して自前のループを実装するか、Claude Agent SDKを使うかで検討している。", "question": "Which consideration most strongly favors the Claude Agent SDK?", "question_ja": "Claude Agent SDKを最も強く支持する検討事項はどれか？", "choices": {"A": "The Agent SDK is the only way to use tool calling with Claude", "B": "They want built-in agent-loop handling, session management, permissions, subagents, and file tools without reimplementing them", "C": "The Agent SDK is required for any request larger than 100K tokens", "D": "Direct API calls cannot be used in production environments"}, "choices_ja": {"A": "Agent SDKはClaudeでツール呼び出しを使う唯一の方法である", "B": "エージェントループ処理、セッション管理、パーミッション、サブエージェント、ファイルツールなどを再実装せずに組み込みで利用したい", "C": "Agent SDKは10万トークンを超えるあらゆるリクエストに必須である", "D": "直接のAPI呼び出しは本番環境では使用できない"}, "answer": "B", "explanation_ja": "Agent SDK は Claude Code と同じエージェントハーネス（ループ制御・セッション・permissions・サブエージェント・ファイル/bash ツール等）をライブラリとして提供する。自前ループの再実装を避けたい場合に最適。A/C/D は事実誤認（生API＋tool use でもエージェントは作れるし、本番利用も可能）。", "source": "https://code.claude.com/docs/en/agent-sdk/overview", "pack": "v1"}, {"id": "D1-q009", "statement_id": "D1-1", "scenario": "During testing, an agent occasionally responds with the text 'TASK COMPLETE' while stop_reason is still 'tool_use' because it also requested another tool call in the same response.", "scenario_ja": "テスト中、あるエージェントはstop_reasonがまだ「tool_use」であるにもかかわらず、テキストとして「TASK COMPLETE」と応答することがある。これは同じレスポンスの中で別のツール呼び出しも要求しているためである。", "question": "What should the loop implementation do in this case?", "question_ja": "この場合、ループの実装はどうすべきか？", "choices": {"A": "Terminate immediately because the model declared the task complete", "B": "Continue the loop: execute the requested tool and return its result, because stop_reason 'tool_use' means the turn is not finished", "C": "Ask the model to clarify whether it is really done", "D": "Terminate and log an error, since text and stop_reason must never disagree"}, "choices_ja": {"A": "モデルがタスク完了を宣言したので直ちに終了する", "B": "ループを継続する：要求されたツールを実行し結果を返す。なぜならstop_reasonが「tool_use」である限り、そのターンは終わっていないから", "C": "モデルに本当に完了したのか確認を求める", "D": "テキストとstop_reasonは決して食い違ってはならないため、終了してエラーをログに記録する"}, "answer": "B", "explanation_ja": "制御信号として信頼すべきは stop_reason。'tool_use' が返っている限りツール実行と結果返却を続ける。テキスト内容（'TASK COMPLETE'）で終了判定するのはアンチパターン。D のような不整合はエラーではなく、テキストは補足説明にすぎない。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/how-tool-use-works", "pack": "v1"}, {"id": "D1-q010", "statement_id": "D1-2", "scenario": "In a customer-support multi-agent system, the orchestrator itself performs refund calculations, drafts emails, queries the order database, and coordinates three subagents. The system is hard to debug and the orchestrator's context overflows frequently.", "scenario_ja": "あるカスタマーサポートのマルチエージェントシステムでは、オーケストレーター自身が返金計算、メール文面の作成、注文データベースへの問い合わせを行い、さらに3つのサブエージェントを調整している。このシステムはデバッグが難しく、オーケストレーターのコンテキストが頻繁にあふれる。", "question": "What design change best addresses the root cause?", "question_ja": "根本原因に最も適切に対処する設計変更は何か？", "choices": {"A": "Give the orchestrator a larger context window model", "B": "Restrict the orchestrator to decomposition, delegation, and synthesis; move execution work (calculations, drafting, queries) into specialized subagents", "C": "Merge the three subagents into the orchestrator to reduce coordination overhead", "D": "Add more logging to the orchestrator without changing responsibilities"}, "choices_ja": {"A": "オーケストレーターにより大きなコンテキストウィンドウを持つモデルを与える", "B": "オーケストレーターの役割を分解・委譲・統合に限定し、実行作業（計算・文面作成・問い合わせ）を専門のサブエージェントに移す", "C": "調整のオーバーヘッドを減らすため、3つのサブエージェントをオーケストレーターに統合する", "D": "責務を変えずにオーケストレーターへのログ記録を増やす"}, "answer": "B", "explanation_ja": "オーケストレーターの役割は『分解・委譲・統合』であり、実行作業を抱え込むと責務が混ざりコンテキストも溢れる。実行は専門サブエージェントへ。A は対症療法、C は逆方向（さらに肥大化）、D は根本原因に触れない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v1"}, {"id": "D1-q011", "statement_id": "D1-5", "scenario": "A security team must guarantee that Claude Code never runs 'git push --force', even if a prompt or CLAUDE.md instruction suggests otherwise. A written rule in CLAUDE.md has proven unreliable.", "scenario_ja": "あるセキュリティチームは、たとえプロンプトやCLAUDE.mdの指示がそれを示唆していても、Claude Codeが決して「git push --force」を実行しないことを保証しなければならない。CLAUDE.mdに書かれたルールは信頼できないことが判明している。", "question": "What is the correct mechanism?", "question_ja": "正しいメカニズムは何か？", "choices": {"A": "Add a stronger, capitalized instruction in CLAUDE.md", "B": "Configure a PreToolUse hook (or a permission deny rule) that deterministically blocks the command before execution", "C": "Configure a PostToolUse hook to detect the command after it has run", "D": "Rely on the model's built-in safety training to refuse force pushes"}, "choices_ja": {"A": "CLAUDE.mdにより強い、大文字で書かれた指示を追加する", "B": "実行前にそのコマンドを決定的にブロックするPreToolUseフック（またはパーミッションのdenyルール）を設定する", "C": "コマンドが実行された後でそれを検知するPostToolUseフックを設定する", "D": "モデルの組み込みの安全性トレーニングがフォースプッシュを拒否することに頼る"}, "answer": "B", "explanation_ja": "確実な強制（enforcement）はプロンプトではなく決定的な仕組みで行う。実行『前』に介入できるのは PreToolUse フック（または permissions の deny ルール）。PostToolUse は実行後なので手遅れ。A/D は確率的で保証がない。『プロンプトは指針、フック/permissions は強制』という対比が問われる。", "source": "https://code.claude.com/docs/en/hooks", "pack": "v1"}, {"id": "D1-q012", "statement_id": "D1-7", "scenario": "You resumed a named session with --resume <session-name> to continue investigating a bug you were debugging yesterday. Since then, three of the files you had already analyzed were modified by a teammate.", "scenario_ja": "あなたは昨日デバッグしていたバグの調査を続けるため、--resume <session-name>で名前付きセッションを再開した。その後、あなたがすでに分析済みだった3つのファイルがチームメイトによって変更された。", "question": "What is the most reliable way to continue the investigation correctly?", "question_ja": "調査を正しく続ける最も確実な方法は何か？", "choices": {"A": "Resume as usual and trust the agent to notice the files changed on its own", "B": "Resume the session and explicitly inform the agent which specific files changed, so it re-analyzes only those rather than assuming its prior analysis still holds", "C": "Always start a brand-new session instead of resuming, regardless of how much prior context is still valid", "D": "Use fork_session instead of --resume, since forking always re-reads the filesystem"}, "choices_ja": {"A": "いつも通り再開し、エージェントがファイルの変更に自分で気づくことを信頼する", "B": "セッションを再開し、どのファイルが変更されたかを明示的にエージェントに伝え、以前の分析がまだ有効だと仮定せず、それらのファイルだけを再分析させる", "C": "どれだけ以前のコンテキストがまだ有効であっても、再開ではなく常に新しいセッションを開始する", "D": "fork_sessionは常にファイルシステムを再読み込みするため、--resumeの代わりにfork_sessionを使う"}, "answer": "B", "explanation_ja": "セッション再開後は、変更されたファイルを明示的に伝えて対象を絞った再分析をさせるのが確実（丸ごと再探索は不要）。A はエージェント任せで信頼性が低い。C は『再開が妥当な場合』の利点を捨てる過剰対応。D は fork_session の用途誤り（分岐探索用であり自動ファイル再読み込みの機能ではない）。", "source": "materials/official/exam-guide.pdf (Task Statement 1.7)", "pack": "v1"}, {"id": "D1-q013", "statement_id": "D1-3", "angle": "design-choice", "scenario_ref": 3, "scenario": "In your multi-agent research system, the coordinator agent has already run several web searches and has decided on three source documents to analyze plus a set of inclusion criteria (publication after 2023, primary sources only). It now needs a `document-analyzer` subagent to analyze each of the three documents, and the three analyses are independent of one another. Total wall-clock time for a research run is your main performance complaint from users.", "scenario_ja": "あなたのマルチエージェント調査システムでは、コーディネーターエージェントがすでに複数のウェブ検索を実行し、分析対象の3つのソース文書と一連の採用基準（2023年以降の公開、一次情報のみ）を決定しています。次に `document-analyzer` サブエージェントに3つの文書それぞれを分析させる必要があり、3つの分析は互いに独立しています。調査1回あたりの総所要時間が、ユーザーからの主要な性能上の不満です。", "question": "Which approach correctly spawns the three analyses so that they run concurrently and each subagent has the information it needs?", "question_ja": "3つの分析を並行して実行させ、かつ各サブエージェントが必要な情報を持つようにするには、どの方法が正しいですか。", "choices": {"A": "Issue one Task (Agent) tool call whose prompt lists all three documents, and let the subagent internally split the work across the documents so the analyses overlap in time.", "B": "Issue three Task (Agent) tool calls in three consecutive assistant turns, keeping each prompt short because the subagent inherits the coordinator's conversation history and its criteria.", "C": "Issue three Task (Agent) tool calls in a single assistant response, and write each document's path and the full inclusion criteria explicitly into that call's prompt string.", "D": "Fork the coordinator's session three times with forkSession, then send each forked session one document path, relying on the copied history to supply the criteria."}, "choices_ja": {"A": "3つの文書すべてを列挙したプロンプトで Task (Agent) ツールを1回呼び出し、サブエージェントが内部的に文書間で作業を分割して分析が時間的に重なるようにする。", "B": "3回の連続したアシスタントターンでそれぞれ Task (Agent) ツールを呼び出し、サブエージェントはコーディネーターの会話履歴と基準を継承するのでプロンプトは短く保つ。", "C": "1回のアシスタント応答の中で Task (Agent) ツールを3回呼び出し、各呼び出しのプロンプト文字列に対象文書のパスと採用基準の全文を明示的に書き込む。", "D": "forkSession でコーディネーターのセッションを3つにフォークし、各フォークセッションに文書パスを1つずつ渡して、コピーされた履歴が基準を供給することに依存する。"}, "answer": "C", "explanation_ja": "C が正解。並列実行は「1つのアシスタント応答の中で複数の Task/Agent ツール呼び出しを出す」ことで実現し、独立したサブタスクは合計時間ではなく最も遅い1つの時間で終わる。またサブエージェントのコンテキストウィンドウは新規で、親から子への唯一の経路は Task ツールの prompt 文字列であるため、ファイルパス・判断・基準はプロンプトに直接書く必要がある。A は呼び出しが1つなので単一のサブエージェント内で逐次処理となり並列化にならず、コンテキスト分離の利点も薄れる。B は呼び出しが別々のターンに分かれるため直列実行になり、さらに「サブエージェントが親の会話履歴を継承する」という前提が誤り（親の会話履歴・ツール結果・システムプロンプトは継承されない）。D はフォークが「発散的な探索で元の履歴を保ちつつ別方向を試す」ための機能であり、独立した並列サブタスクの分散手段ではない。フォークはファイルシステムではなく会話履歴を分岐させるもので、同一ディレクトリで編集が衝突するリスクもあり、この用途には過剰かつ不適切。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q014", "statement_id": "D1-3", "angle": "troubleshoot", "scenario_ref": 5, "scenario": "Your CI pipeline runs Claude Code non-interactively on every pull request. You defined a `style-checker` and a `security-scanner` subagent with clear descriptions and read-only tools, and locally the agent delegates to both. In CI, the run always completes but the report is written entirely from the main agent's own context, the subagents never appear to run, and the result payload contains permission_denials entries whose tool_name is \"Task\".", "scenario_ja": "あなたの CI パイプラインは、すべてのプルリクエストで Claude Code を非対話的に実行します。明確な description と読み取り専用ツールを持つ `style-checker` と `security-scanner` のサブエージェントを定義しており、ローカルではエージェントは両方に委譲します。CI では実行は必ず完了するものの、レポートはすべてメインエージェント自身のコンテキストから書かれており、サブエージェントは実行された形跡がなく、結果ペイロードには tool_name が \"Task\" の permission_denials エントリが含まれています。", "question": "What is the root cause of the subagents never running in the CI environment?", "question_ja": "CI 環境でサブエージェントが実行されない根本原因は何ですか。", "choices": {"A": "The subagent descriptions are too vague for Claude to match the review task, so it silently falls back to handling the review in the main context instead.", "B": "The spawning tool (Task/Agent) is missing from allowedTools, so in the non-interactive CI permission mode the spawn calls are denied instead of auto-approved.", "C": "The subagents restrict tools to Read, Grep, and Glob, and a subagent whose tools array omits Bash cannot be spawned at all from a non-interactive session.", "D": "The subagents were defined programmatically via the agents parameter, and programmatic definitions are ignored in CI unless the same files exist under .claude/agents/."}, "choices_ja": {"A": "サブエージェントの description が曖昧すぎて Claude がレビュータスクと対応付けられず、代わりに黙ってメインコンテキストでレビューを処理するフォールバックに落ちている。", "B": "生成ツール（Task/Agent）が allowedTools に含まれていないため、非対話的な CI のパーミッションモードでは生成呼び出しが自動承認されず拒否されている。", "C": "サブエージェントがツールを Read・Grep・Glob に制限しており、tools 配列に Bash を含まないサブエージェントは非対話セッションからそもそも起動できない。", "D": "サブエージェントが agents パラメータでプログラム的に定義されており、プログラム的定義は .claude/agents/ に同じファイルがない限り CI では無視される。"}, "answer": "B", "explanation_ja": "B が正解。Claude はサブエージェントを Task/Agent ツール経由で起動するため、allowedTools に Task（現行版では Agent）を含めないと呼び出しは自動承認されず、canUseTool コールバックに回るか、非対話の dontAsk モードでは拒否される。permission_denials の tool_name が \"Task\" になっている点がまさにこの拒否の証拠であり、ローカルでは対話的に承認されていたため動いていた。A は description が原因なら委譲判断そのものが起きず、拒否記録は残らない（ローカルで委譲できている事実とも矛盾する）。C は誤りで、tools を Read/Grep/Glob に絞った読み取り専用サブエージェントは公式に推奨される構成であり、Bash の有無が起動可否を決めることはない。D も誤りで、プログラム的に定義したエージェントはむしろ同名のファイルシステム定義より優先される。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q015", "statement_id": "D1-4", "angle": "design-choice", "scenario_ref": 1, "scenario": "Your customer support agent resolves returns and billing disputes using MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). When a case exceeds policy, the agent calls escalate_to_human, which files a ticket into a queue where human agents work from the ticket alone and have no access to the conversation transcript or the agent's session. Human agents currently reopen contact with customers to re-collect basic facts, adding an average of 9 minutes per escalated case.", "scenario_ja": "あなたのカスタマーサポートエージェントは、MCPツール（get_customer、lookup_order、process_refund、escalate_to_human）を使って返品と請求の紛争を解決している。ケースがポリシーを超える場合、エージェントは escalate_to_human を呼び出してキューにチケットを起票するが、人間の担当者はそのチケットだけを見て作業し、会話のトランスクリプトやエージェントのセッションにはアクセスできない。現状、人間の担当者は顧客に再度連絡して基本的な事実を集め直しており、エスカレーション1件あたり平均9分が余分にかかっている。", "question": "What is the most effective way to design the escalate_to_human handoff so human agents can act without re-contacting the customer?", "question_ja": "人間の担当者が顧客に再連絡せずに対応できるようにするには、escalate_to_human の引き継ぎをどう設計するのが最も効果的か。", "choices": {"A": "Have escalate_to_human accept a free-form text field and instruct the agent in the system prompt to describe the situation there in as much detail as it can.", "B": "Have escalate_to_human attach the full turn-by-turn conversation transcript so the human agent can read everything the agent and customer exchanged.", "C": "Give escalate_to_human a required input schema with verified customer ID, order ID, root cause analysis, amount at issue, and a recommended action, so every ticket carries the same fields.", "D": "Have escalate_to_human return the agent's session ID so the human agent can resume the same session later and ask the agent follow-up questions about the case."}, "choices_ja": {"A": "escalate_to_human に自由記述のテキスト欄を持たせ、システムプロンプトでエージェントに「できる限り詳しく状況を書け」と指示する。", "B": "escalate_to_human にターンごとの会話トランスクリプト全文を添付し、人間の担当者がエージェントと顧客のやり取りをすべて読めるようにする。", "C": "escalate_to_human に必須の入力スキーマ（検証済み顧客ID、注文ID、根本原因の分析、対象金額、推奨アクション）を持たせ、すべてのチケットが同じ項目を運ぶようにする。", "D": "escalate_to_human にエージェントのセッションIDを返させ、人間の担当者が後で同じセッションを再開してケースについて追加質問できるようにする。"}, "answer": "C", "explanation_ja": "C が正解。試験ガイドの D1-4 は「会話トランスクリプトにアクセスできない人間へエスカレーションする際、顧客ID・根本原因・返金額・推奨アクションを含む構造化サマリを作る」ことを明示している。必須フィールドを入力スキーマとして定義すれば、エージェントの記述力に依存せず、どのチケットにも判断に必要な情報が揃う（欠落は引数検証で検出できる）。A はプロンプトによる指示に依存するため、書式も網羅性もケースごとにばらつき、プロンプトのみの遵守は非ゼロの失敗率を持つ。B はトランスクリプト全文を渡すため人間側に読解と再分析の負荷をそのまま転嫁し、根本原因と推奨アクションという最も価値のある要約が欠ける。D はセッション再開に依存する設計で、人間が非同期・別ツールで作業する前提と噛み合わず、引き継ぎ時点で情報が完結しない。", "source": "https://code.claude.com/docs/en/agent-sdk/custom-tools", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q016", "statement_id": "D1-4", "angle": "troubleshoot", "scenario_ref": 1, "scenario": "To guarantee that refunds are never issued before identity verification, your team implemented the check inside the SDK's canUseTool callback: when Claude requests mcp__support__process_refund, the callback denies the call unless get_customer has already returned a verified customer ID in this session. The query options also list allowedTools: [\"mcp__support__get_customer\", \"mcp__support__lookup_order\", \"mcp__support__process_refund\"] so the agent runs without prompting. In production, refunds are occasionally processed with no prior get_customer call, and the callback's deny branch never appears in the logs.", "scenario_ja": "本人確認前に返金が実行されることを絶対に防ぐため、チームはこのチェックを SDK の canUseTool コールバック内に実装した。Claude が mcp__support__process_refund を要求したとき、当該セッションで get_customer が検証済み顧客IDを返していなければコールバックが呼び出しを拒否する。クエリのオプションには、プロンプトなしで動かすために allowedTools: [\"mcp__support__get_customer\", \"mcp__support__lookup_order\", \"mcp__support__process_refund\"] も指定されている。本番では、事前の get_customer 呼び出しなしに返金が処理されることがあり、コールバックの拒否分岐はログに一度も現れない。", "question": "What is the root cause of the verification gate failing to block these refunds?", "question_ja": "この検証ゲートが返金をブロックできていない根本原因はどれか。", "choices": {"A": "The canUseTool callback cannot inspect prior tool results, so its check for a verified customer ID silently evaluates to true for every process_refund request.", "B": "The bare allowedTools entry for process_refund auto-approves the tool at the allow-rule step, which is reached before canUseTool, so the callback is never consulted for it.", "C": "MCP server tools are resolved by the MCP server itself rather than by the SDK permission flow, so canUseTool only applies to built-in tools such as Bash, Read, and Write.", "D": "The callback runs asynchronously after the tool request is dispatched, so its decision arrives too late to stop a refund that the agent has already initiated."}, "choices_ja": {"A": "canUseTool コールバックは過去のツール結果を参照できないため、検証済み顧客IDのチェックがすべての process_refund 要求で静かに true と評価されてしまう。", "B": "allowedTools にツール名のみで process_refund を挙げているため、canUseTool より前に評価される allow ルールの段階で自動承認され、コールバックがそのツールについて呼ばれない。", "C": "MCPサーバのツールは SDK の権限フローではなく MCP サーバ自身が解決するため、canUseTool は Bash・Read・Write などの組み込みツールにしか適用されない。", "D": "コールバックはツール要求のディスパッチ後に非同期で実行されるため、エージェントが既に開始した返金を止めるには判断が遅すぎる。"}, "answer": "B", "explanation_ja": "B が正解。権限評価はフック→deny ルール→ask ルール→権限モード→allow ルール→canUseTool の順で進み、いずれかの段階で承認されたツール呼び出しは canUseTool に到達しない。ドキュメントは「自動承認されたツールは canUseTool に届かず、そこに置いた権限チェックは黙って迂回される」と明記しており、`Read` や `mcp__github__get_issue` のようなツール名だけの記述は当該ツールへの全呼び出しを自動承認する。すべての呼び出しで必ず走らせたいチェックは PreToolUse フックに置くべきである。A は誤りで、コールバックはアプリ側の状態を自由に参照でき、実際にはそもそも呼ばれていない（拒否分岐がログに出ないのはそのため）。C は誤りで、MCP ツールも同じ権限評価フローに従い、allow ルールも `mcp__server__tool` 形式で書ける。D は誤りで、権限判断はツール実行前に同期的に解決される。", "source": "https://code.claude.com/docs/en/agent-sdk/permissions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q017", "statement_id": "D1-4", "angle": "find-error", "scenario_ref": 3, "scenario": "In your multi-agent research system, a coordinator agent runs search and document-analysis subagents, then hands their findings to a synthesis subagent. The coordinator invokes the synthesis subagent with the Agent tool prompt: \"Synthesize the findings from the searches and document analyses above into a unified answer, keeping the source citations discussed earlier.\" The synthesis subagent's output is generic, cites no sources, and sometimes reports that it found nothing to synthesize.", "scenario_ja": "あなたのマルチエージェント調査システムでは、コーディネーターエージェントが検索用と文書分析用のサブエージェントを走らせ、その結果を統合用サブエージェントに引き渡している。コーディネーターは Agent ツールのプロンプトとして「上記の検索結果と文書分析の知見を統合し、先に議論した出典の引用を保って統一的な回答にせよ」と与えて統合サブエージェントを呼び出している。統合サブエージェントの出力は一般論に終始し、出典を一切引用せず、ときには統合すべきものが見つからなかったと報告する。", "question": "What is the error in this handoff design?", "question_ja": "この引き継ぎ設計の誤りはどれか。", "choices": {"A": "The synthesis subagent inherits the coordinator's system prompt, which overrides its own instructions and makes it answer generically instead of synthesizing.", "B": "Subagents cannot be given tool results as input at all, so synthesis must always be performed by the coordinator in the main conversation rather than delegated.", "C": "Running the search and analysis subagents in parallel discards their results, because only the last subagent to finish returns a final message to the coordinator.", "D": "The prompt references parent conversation content the subagent never receives; a subagent starts with a fresh context whose only channel from the parent is the Agent tool prompt string."}, "choices_ja": {"A": "統合サブエージェントはコーディネーターのシステムプロンプトを継承し、それが自身の指示を上書きするため、統合せず一般論で答えてしまう。", "B": "サブエージェントにツール結果を入力として渡すことはそもそも不可能なので、統合は委譲せず必ずコーディネーターがメイン会話内で行う必要がある。", "C": "検索用と分析用のサブエージェントを並列実行すると結果が失われる。最後に終わったサブエージェントだけがコーディネーターに最終メッセージを返すためである。", "D": "プロンプトがサブエージェントには渡らない親会話の内容を参照している。サブエージェントは新しいコンテキストで始まり、親からの唯一の伝達経路は Agent ツールのプロンプト文字列である。"}, "answer": "D", "explanation_ja": "D が正解。ドキュメントは「サブエージェントのコンテキストウィンドウは親の会話履歴を持たずに始まり、親からサブエージェントへの唯一のチャネルは Agent ツールのプロンプト文字列である」と明示し、必要なファイルパス・エラーメッセージ・判断はそのプロンプトに直接含めよと述べている。「上記の」「先に議論した」という参照は解決先がなく、だから出力が空疎になる。正しくは、検索・分析サブエージェントの最終メッセージ本文を統合サブエージェントのプロンプトに埋め込んで渡す。A は誤りで、サブエージェントは親のシステムプロンプトを受け取らない（受け取るのは自身の prompt と Agent ツールのプロンプト）。B は誤りで、親が結果をプロンプト文字列に載せれば渡せる。C は誤りで、並列実行した各サブエージェントの最終メッセージはそれぞれの Agent ツール結果として親に返る。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q018", "statement_id": "D1-4", "angle": "tradeoff", "scenario_ref": 6, "scenario": "A document pipeline extracts invoice records from scanned PDFs with an agent that may call several tools per document, then writes each record into an accounting database. Records with a missing vendor tax ID or a malformed total have already reached the database and required manual reconciliation. The team needs the write step to be gated on a validated record, must keep per-document latency and cost close to today's, and does not want to maintain a second model call for checking.", "scenario_ja": "ある文書パイプラインは、スキャンされたPDFから請求書レコードを抽出するエージェント（1文書あたり複数のツールを呼ぶことがある）を使い、各レコードを会計データベースに書き込んでいる。ベンダーの納税者番号が欠けたレコードや合計金額の形式が壊れたレコードが既にデータベースに到達し、手作業の照合が必要になった。チームは、書き込みステップを検証済みレコードでゲートしたいが、1文書あたりのレイテンシとコストは現状に近く保ちたく、チェック用に2回目のモデル呼び出しを維持したくない。", "question": "Which approach best enforces the validation gate under these constraints?", "question_ja": "これらの制約下で検証ゲートを最もよく強制するアプローチはどれか。", "choices": {"A": "Set output_format to a JSON Schema for the invoice record so the SDK validates the final output and re-prompts on mismatch, and write to the database only on a success result.", "B": "Add a line to the system prompt requiring the agent to double-check that every required field is present and correctly formatted before it reports the extracted record.", "C": "Run a second agent query after each extraction whose only job is to review the first agent's record and report whether the required fields are present and well-formed.", "D": "Keep free-form text output and write a parser in the pipeline that extracts the fields with regular expressions, logging a warning whenever a field cannot be matched."}, "choices_ja": {"A": "請求書レコードの JSON Schema を output_format に指定し、SDK が最終出力を検証して不一致時に再プロンプトするようにしたうえで、success 結果のときだけデータベースに書き込む。", "B": "システムプロンプトに一行加え、抽出したレコードを報告する前に必須項目がすべて揃い形式が正しいかをエージェント自身に再確認させる。", "C": "抽出のたびに2つ目のエージェントクエリを走らせ、1つ目のエージェントのレコードについて必須項目の有無と形式の妥当性だけをレビューさせる。", "D": "自由記述の出力のままにし、パイプライン側で正規表現によりフィールドを抽出するパーサを書いて、マッチしないフィールドがあれば警告をログに出す。"}, "answer": "A", "explanation_ja": "A が正解。構造化出力では、エージェントが途中で何回ツールを使っても、最終出力はスキーマに対して SDK が検証し、不一致なら再プロンプトする。リトライ上限内に成功しなければ結果は success ではなく error_max_structured_output_retries になるので、subtype を見て書き込みを止めれば、決定的なゲートが追加のモデル呼び出しなしで得られる。B はプロンプトによる自己チェックで、遵守は確率的であり非ゼロの失敗率を残す——現に問題が起きているのはこの層である。C は要件どおりのチェックにはなるが、文書ごとに2回目のモデル呼び出しを増やしてレイテンシとコストを押し上げ、しかもレビュー側もLLMなので決定的な保証にならない。D は正規表現パーサの保守が抽出以上に脆く、警告をログに出すだけでは書き込みをブロックしないので、不正レコードは依然データベースに入る。", "source": "https://code.claude.com/docs/en/agent-sdk/structured-outputs", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q019", "statement_id": "D1-4", "angle": "design-choice", "scenario_ref": 5, "scenario": "Your CI job runs Claude Code on each pull request with permissionMode: \"bypassPermissions\" so the run never blocks on prompts, and the main agent is allowed to write test files and commit fixes. It delegates the review step to a code-reviewer subagent that must only read the diff and report findings; it must never modify files or run shell commands. A reviewer subagent defined with permissionMode: \"default\" still edited files during a run.", "scenario_ja": "あなたのCIジョブは、プロンプトで停止しないように permissionMode: \"bypassPermissions\" を指定して各プルリクエストで Claude Code を実行しており、メインエージェントはテストファイルの作成や修正のコミットを許されている。レビュー工程は code-reviewer サブエージェントに委譲しており、このサブエージェントは差分を読んで指摘を報告するだけで、ファイルを変更したりシェルコマンドを実行したりしては絶対にならない。permissionMode: \"default\" を指定して定義したレビュー用サブエージェントが、実行中にファイルを編集してしまった。", "question": "How should the review subagent be constrained so it cannot modify files or run commands?", "question_ja": "レビュー用サブエージェントがファイルを変更したりコマンドを実行したりできないようにするには、どう制約すべきか。", "choices": {"A": "Set permissionMode: \"plan\" on the reviewer subagent definition so its file edits are routed to the canUseTool callback instead of being auto-approved.", "B": "Restrict the reviewer's tool surface in its AgentDefinition, for example tools: [\"Read\", \"Grep\", \"Glob\"], since a subagent inherits bypassPermissions from the parent and cannot override the mode.", "C": "Add a line to the reviewer subagent's prompt stating that it is a read-only reviewer and must never call Edit, Write, or Bash under any circumstances.", "D": "Add allowedTools: [\"Read\", \"Grep\", \"Glob\"] to the parent query options so that only those tools are approved anywhere in the run, including inside the subagent."}, "choices_ja": {"A": "レビュー用サブエージェントの定義に permissionMode: \"plan\" を設定し、ファイル編集が自動承認されず canUseTool コールバックに回るようにする。", "B": "AgentDefinition でレビュー用のツール面を絞る（例: tools: [\"Read\", \"Grep\", \"Glob\"]）。サブエージェントは親から bypassPermissions を継承し、モードを上書きできないため。", "C": "レビュー用サブエージェントのプロンプトに、自分は読み取り専用のレビュアーであり Edit・Write・Bash をいかなる場合も呼んではならないと明記する。", "D": "親クエリのオプションに allowedTools: [\"Read\", \"Grep\", \"Glob\"] を加え、サブエージェント内部を含め実行中はそれらのツールだけが承認されるようにする。"}, "answer": "B", "explanation_ja": "B が正解。ドキュメントは「親が bypassPermissions・acceptEdits・auto を使う場合、すべてのサブエージェントがそのモードを継承し、サブエージェント単位で上書きできない」と警告している。したがってモード指定では抑えられず、AgentDefinition の tools（または disallowedTools）でツールセット自体から Edit/Write/Bash を外すのが確実な手段である（読み取り専用分析の推奨組み合わせは Read/Grep/Glob）。A は同じ継承の警告に該当し、サブエージェント側の permissionMode 指定は親の bypassPermissions を覆せない——今回の不具合そのものである。C はプロンプトによる指示で、遵守は確率的であり保証にならない。D は誤りで、allowedTools は列挙したツールを事前承認するだけで bypassPermissions を制約しない。未列挙のツールは allow ルールに一致しないまま権限モードに落ち、そこで承認される。", "source": "https://code.claude.com/docs/en/agent-sdk/permissions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q020", "statement_id": "D1-5", "angle": "design-choice", "scenario_ref": 1, "scenario": "A customer support agent built on the Agent SDK exposes the MCP tools get_customer, lookup_order, process_refund, and escalate_to_human. Company policy states that any refund above $500 must never be issued by the agent and must instead go to a human reviewer. Compliance requires that this limit hold on every single call, not most of the time.", "scenario_ja": "Agent SDK 上に構築されたカスタマーサポートエージェントが、get_customer、lookup_order、process_refund、escalate_to_human という MCP ツールを公開している。社内ポリシーでは、500ドルを超える返金はエージェントが決して実行してはならず、代わりに人間のレビュー担当者に回さなければならないと定められている。コンプライアンス上、この上限はほとんどの場合ではなく、すべての呼び出しで成立している必要がある。", "question": "Which implementation best enforces the $500 refund limit?", "question_ja": "500ドルの返金上限を強制する実装として最も適切なものはどれか。", "choices": {"A": "Add a strongly worded rule to the system prompt stating that refunds above $500 must always be routed to escalate_to_human instead of process_refund.", "B": "Register a PreToolUse hook matching process_refund that inspects the refund amount and denies the call with a message telling Claude to escalate instead.", "C": "Register a PostToolUse hook matching process_refund that checks the amount in the result and issues a compensating reversal when it exceeds $500.", "D": "Add process_refund to disallowed_tools so the agent can never issue refunds, and let a human reviewer handle every refund request end to end."}, "choices_ja": {"A": "500ドルを超える返金は必ず process_refund ではなく escalate_to_human に回すこと、という強い表現のルールをシステムプロンプトに追加する。", "B": "process_refund にマッチする PreToolUse フックを登録し、返金額を検査して、代わりにエスカレーションするよう Claude に伝えるメッセージとともに呼び出しを拒否する。", "C": "process_refund にマッチする PostToolUse フックを登録し、結果内の金額を確認して500ドルを超えていた場合は打ち消しの返金取消を行う。", "D": "process_refund を disallowed_tools に加えてエージェントが一切返金できないようにし、すべての返金依頼を人間のレビュー担当者が最初から最後まで処理する。"}, "answer": "B", "explanation_ja": "B が正解。PreToolUse フックはツールが実行される前に呼び出しを横取りし、引数（返金額）を検査して拒否できる。公式ドキュメントは「PreToolUse フックがツール呼び出しを拒否すると実行が阻止され、Claude は代わりに拒否メッセージを受け取る」と明記しており、拒否メッセージで escalate_to_human への迂回を誘導できる。フックは permission の評価順で最初に走るため、決定論的な保証になる。A は誤り。プロンプト指示はモデルの確率的な遵守に依存し、Exam Guide が言う通り非ゼロの失敗率を持つため、決定論的保証が要求される業務ルールには不適切。C は誤り。PostToolUse はツールが返った後に走るので、違反する返金はすでに実行済みであり「決して発行しない」という要件を満たさない。打ち消し処理は事後の穴埋めにすぎない。D は誤り。ツール自体を取り上げると500ドル以下の正当な返金まで自動化できなくなり、80%以上の初回解決率という目標を大きく損なう。ポリシー上限は金額に応じた条件付き制御であるべき。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q021", "statement_id": "D1-5", "angle": "troubleshoot", "scenario_ref": 1, "scenario": "A support agent runs headless with options that include allowed_tools = [\"mcp__billing__process_refund\", \"mcp__crm__get_customer\"] so it can operate without prompting. The team also passes a canUseTool callback that is supposed to reject any process_refund call above $500. In production, refunds of $900 and $1,400 were issued and the callback's logging statement never appeared in the logs.", "scenario_ja": "あるサポートエージェントが、プロンプトなしで動作できるよう allowed_tools = [\"mcp__billing__process_refund\", \"mcp__crm__get_customer\"] を含むオプションでヘッドレス実行されている。チームは併せて、500ドルを超える process_refund 呼び出しを拒否するはずの canUseTool コールバックも渡している。本番環境で900ドルと1,400ドルの返金が実行され、コールバックのログ出力はログに一度も現れなかった。", "question": "What is the root cause of the callback never running?", "question_ja": "コールバックが一度も実行されない根本原因は何か。", "choices": {"A": "MCP tool names are namespaced, so canUseTool receives the bare name process_refund and the callback's comparison against the prefixed name silently fails.", "B": "The callback returns its decision asynchronously, and the SDK proceeds with the tool call when a decision is not returned before the tool execution timeout.", "C": "Listing the tool bare in allowed_tools auto-approves it earlier in the permission flow, so the call is resolved before canUseTool is ever consulted.", "D": "MCP server tools bypass the permission flow entirely because approval is delegated to the MCP server process rather than the SDK host application."}, "choices_ja": {"A": "MCP ツール名は名前空間付きなので、canUseTool には裸の名前 process_refund が渡され、プレフィックス付きの名前と比較しているコールバックの判定が静かに失敗している。", "B": "コールバックが非同期に判断を返すため、ツール実行のタイムアウトまでに判断が返らないと SDK はそのままツール呼び出しを続行してしまう。", "C": "ツールを allowed_tools に裸で列挙すると permission の評価順の早い段階で自動承認されるため、canUseTool が参照される前に呼び出しが解決してしまう。", "D": "MCP サーバのツールは承認が SDK ホストアプリケーションではなく MCP サーバプロセスに委譲されるため、permission の評価フローを完全にバイパスする。"}, "answer": "C", "explanation_ja": "C が正解。公式ドキュメントは「auto-approved なツールではコールバックは決して発火しない」と警告しており、allow ルール（allowed_tools）や acceptEdits / bypassPermissions といったモードで先に解決された呼び出しは canUseTool に到達しない。全ツール呼び出しに必ず適用したいロジックは PreToolUse フックで実装すべきで、フックは評価順の最初に走る。A は誤り。名前の不一致なら少なくともコールバック自体は起動しログが出るはずで、「ログが一度も出ない」という症状と矛盾する。B は誤り。canUseTool は返るまで実行を一時停止し、無期限に保留できる仕様であり、タイムアウトで勝手に承認されることはない。D は誤り。MCP ツールも SDK の permission 評価フローの対象で、むしろ requiresUserInteraction 指定時はコールバックに必ず落ちるなど、SDK 側で制御される。", "source": "https://code.claude.com/docs/en/agent-sdk/user-input", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q022", "statement_id": "D1-5", "angle": "find-error", "scenario_ref": 3, "scenario": "A multi-agent research system has a coordinator plus specialist subagents that call three different MCP search tools. Each tool returns publication dates in a different shape (Unix epoch seconds, ISO 8601 strings, and a numeric recency code), and the report generator keeps ordering findings incorrectly. An engineer proposes registering a normalization callback with hooks = {\"PreToolUse\": [HookMatcher(matcher=\"mcp__search.*\", hooks=[normalize_dates])]} that rewrites every date field into ISO 8601.", "scenario_ja": "あるマルチエージェント研究システムには、コーディネーターに加えて3つの異なる MCP 検索ツールを呼び出す専門サブエージェントがいる。各ツールは公開日をそれぞれ異なる形（Unix エポック秒、ISO 8601 文字列、数値の新しさコード）で返しており、レポート生成が調査結果を誤った順序で並べ続けている。あるエンジニアは、すべての日付フィールドを ISO 8601 に書き換える正規化コールバックを hooks = {\"PreToolUse\": [HookMatcher(matcher=\"mcp__search.*\", hooks=[normalize_dates])]} として登録することを提案した。", "question": "What is wrong with the proposed implementation?", "question_ja": "提案された実装の何が誤っているか。", "choices": {"A": "PreToolUse fires before the tool executes, so no tool result exists yet to normalize; result transformation belongs in a PostToolUse hook.", "B": "PreToolUse hooks cannot be registered with a matcher pattern, so the normalization would run against every tool call including Read and Bash.", "C": "Hooks execute inside the agent's context window, so normalizing three tools' results on every call would exhaust the context and trigger compaction.", "D": "Subagents run with their own hook configuration, so hooks registered on the coordinator query never apply to any tool call at all."}, "choices_ja": {"A": "PreToolUse はツール実行の前に発火するため、正規化すべきツール結果がまだ存在しない。結果の変換は PostToolUse フックで行うべきである。", "B": "PreToolUse フックはマッチャーパターン付きで登録できないため、この正規化は Read や Bash を含むすべてのツール呼び出しに対して走ってしまう。", "C": "フックはエージェントのコンテキストウィンドウ内で実行されるため、毎回3つのツールの結果を正規化するとコンテキストを使い切り、コンパクションを誘発する。", "D": "サブエージェントは独自のフック設定で動作するため、コーディネーターの query に登録したフックはどのツール呼び出しにも一切適用されない。"}, "answer": "A", "explanation_ja": "A が正解。公式ドキュメントのフック一覧では PreToolUse は「ツール実行前」に発火し用途は入力の検証や危険なコマンドのブロック、PostToolUse は「ツールが返った後」に発火し出力の監査や副作用の発動とされている。異種フォーマットのツール結果をモデルが処理する前に変換したいなら PostToolUse が正しいイベントで、PreToolUse の時点では結果自体が存在しない。B は誤り。HookMatcher の matcher はまさにツール名パターンでの絞り込み用であり、公式例でも \"Edit|Write\" のように使われている。C は誤り。ドキュメントは「フックはエージェントのコンテキストウィンドウ内ではなくアプリケーションのプロセスで実行されるためコンテキストを消費しない」と明記している。D は誤り。フックが適用されないという前提自体が誤りで、そもそもこの実装の欠陥はイベント選択にある。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q023", "statement_id": "D1-5", "angle": "tradeoff", "scenario_ref": 5, "scenario": "A CI pipeline runs Claude Code to review pull requests. Security requires that the agent never push to protected branches, and the team also wants an audit record of every file the agent modifies. CI minutes and token spend are both tightly budgeted, and the reviewers complain that false positives already waste their time.", "scenario_ja": "ある CI パイプラインが Claude Code を実行してプルリクエストをレビューしている。セキュリティ要件として、エージェントは保護ブランチへ決して push してはならず、チームはエージェントが変更したすべてのファイルの監査記録も残したいと考えている。CI の実行時間もトークン支出も厳しく予算管理されており、レビュアーからは偽陽性がすでに時間を浪費しているという苦情が出ている。", "question": "Which approach best satisfies these requirements under the stated constraints?", "question_ja": "示された制約の下で、これらの要件を最もよく満たすアプローチはどれか。", "choices": {"A": "Append the branch protection rule and an audit-logging instruction to the system prompt, and have the agent print a summary of modified files at the end of each run.", "B": "Run the agent in plan mode only and have a separate human-approved second run apply changes, recording the approved plan text as the audit record for the pipeline.", "C": "Give the agent an extra MCP tool that validates the target branch and writes audit entries, and instruct the agent in CLAUDE.md to call that tool before every git operation.", "D": "Use a PreToolUse hook to block pushes to protected branches and a PostToolUse hook on Edit and Write to append audit entries, both running in the CI process."}, "choices_ja": {"A": "ブランチ保護ルールと監査ログの指示をシステムプロンプトに追加し、実行の最後に変更したファイルの一覧をエージェントに出力させる。", "B": "エージェントを plan mode のみで実行し、人間が承認した別の実行で変更を適用させ、承認されたプラン本文をパイプラインの監査記録として残す。", "C": "対象ブランチを検証し監査エントリを書き込む追加の MCP ツールをエージェントに与え、すべての git 操作の前にそのツールを呼ぶよう CLAUDE.md で指示する。", "D": "PreToolUse フックで保護ブランチへの push をブロックし、Edit と Write に対する PostToolUse フックで監査エントリを追記する。どちらも CI プロセス内で実行する。"}, "answer": "D", "explanation_ja": "D が正解。フックはアプリケーション（ここでは CI）のプロセス内で実行され、コンテキストウィンドウを消費しないためトークン予算に影響せず、かつ評価順の最初に走るので permission モードに関係なくブロックできる決定論的な保証を与える。PostToolUse で Edit|Write に監査ログを書く形は公式ドキュメントの例そのままである。A は誤り。プロンプト指示は確率的な遵守にとどまり、セキュリティ要件のような決定論的保証には使えない。またモデルの自己申告サマリは監査証跡として信頼できない。B は誤り。実行を2回に分け人間の承認を挟むのは CI 時間と人手の両方を増やし、レビュアーの負担軽減という目的に逆行するうえ、plan mode 自体は監査ログを生成しない。C は誤り。検証ツールをモデルが呼ぶかどうかはモデル任せであり、呼び忘れれば保証が崩れる。さらにツール定義と呼び出し結果がコンテキストを消費し、トークン予算を圧迫する。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q024", "statement_id": "D1-5", "angle": "design-choice", "scenario_ref": 6, "scenario": "A structured extraction service pulls shipment records from three upstream MCP tools and emits a validated JSON document. One tool reports status as a numeric code, another as an uppercase string, and a third as a lowercase label; the agent's JSON output mixes all three vocabularies and fails schema validation roughly a fifth of the time. The upstream MCP servers are owned by other teams and cannot be changed this quarter.", "scenario_ja": "ある構造化抽出サービスは、3つの上流 MCP ツールから配送レコードを取得し、検証済みの JSON ドキュメントを出力している。あるツールはステータスを数値コードで、別のツールは大文字の文字列で、3つ目は小文字のラベルで報告しており、エージェントの JSON 出力は3つの語彙が混ざってスキーマ検証におよそ5回に1回失敗している。上流の MCP サーバは他チームの所有物で、今四半期は変更できない。", "question": "What is the most appropriate way to make the extracted status values consistent?", "question_ja": "抽出されるステータス値を一貫させるための最も適切な方法はどれか。", "choices": {"A": "Expand the extraction prompt with a mapping table of every known status code and label, and add few-shot examples showing the canonical output vocabulary.", "B": "Add a PostToolUse hook matching the three MCP tools that rewrites each status field to the canonical vocabulary before the result reaches the model.", "C": "Add a PreToolUse hook on the three MCP tools that rewrites the request parameters to ask each upstream server for the canonical status vocabulary.", "D": "Validate the emitted JSON against the schema and, on failure, feed the validation errors back to the agent so it can retry the extraction with corrections."}, "choices_ja": {"A": "既知のステータスコードとラベルすべてを網羅した対応表を抽出プロンプトに追記し、正規の出力語彙を示す few-shot の例を加える。", "B": "3つの MCP ツールにマッチする PostToolUse フックを追加し、結果がモデルに届く前に各ステータスフィールドを正規の語彙へ書き換える。", "C": "3つの MCP ツールに PreToolUse フックを追加し、各上流サーバに正規のステータス語彙を要求するようリクエストパラメータを書き換える。", "D": "出力された JSON をスキーマで検証し、失敗した場合は検証エラーをエージェントに返して修正付きで抽出をやり直させる。"}, "answer": "B", "explanation_ja": "B が正解。Exam Guide の D1-5 は「異なる MCP ツールから来る異種データ形式（Unix タイムスタンプ、ISO 8601、数値ステータスコード）をエージェントが処理する前に正規化する PostToolUse フック」を明示的に挙げている。PostToolUse はツールが返った後に結果を横取りして変換でき、上流サーバを変更できなくても呼び出し側で決定論的に揃えられる。A は誤り。モデルによるマッピングは確率的で、5回に1回の失敗を完全には消せず、対応表と例がコンテキストを消費し続ける。C は誤り。PreToolUse で書き換えられるのは送信するリクエストであり、上流サーバが対応していない語彙を要求しても返る形式は変わらない。D は誤り。事後の再試行はレイテンシとトークンを増やすうえ、原因である入力の不揃いを放置しているため再試行でも同じ混在が起こりうる。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q025", "statement_id": "D1-7", "angle": "design-choice", "scenario_ref": 5, "scenario": "A CI pipeline runs an Agent SDK review job on an ephemeral container: stage one analyzes the diff and produces findings, and a later stage (a different container, scheduled minutes later) must post follow-up comments that build on that analysis. The team captured the session ID from the first stage's ResultMessage and passed it to the second stage via a pipeline variable, but every second-stage run behaves as if it has no prior context.", "scenario_ja": "CI パイプラインが使い捨てコンテナ上で Agent SDK のレビュージョブを実行している。第1ステージが差分を解析して指摘事項を出し、後続ステージ（別コンテナ・数分後にスケジュールされる）がその解析を踏まえたフォローアップコメントを投稿する必要がある。チームは第1ステージの ResultMessage からセッション ID を取得し、パイプライン変数で第2ステージへ渡しているが、第2ステージの実行は毎回、以前の文脈をまったく持たないかのように振る舞う。", "question": "Which approach is the most appropriate for making the second stage build on the first stage's work?", "question_ja": "第2ステージが第1ステージの作業を引き継ぐようにするうえで、最も適切なアプローチはどれか。", "choices": {"A": "Have the second stage pass continue: true instead of resume, so the SDK automatically picks up the most recent session for the repository without needing any ID.", "B": "Have the first stage emit its findings and decisions as structured application state, and pass that summary into a fresh session's prompt in the second stage.", "C": "Have the second stage resume with fork_session enabled, since forking rebuilds the conversation history on the new host from the shared session ID.", "D": "Have the second stage retry the resume call with a longer timeout, since session files take time to become visible to other containers in the pipeline."}, "choices_ja": {"A": "第2ステージで resume の代わりに continue: true を渡し、ID なしでも SDK がそのリポジトリの最新セッションを自動的に引き継ぐようにする。", "B": "第1ステージで指摘事項と判断を構造化されたアプリケーション状態として出力し、その要約を第2ステージの新規セッションのプロンプトに渡す。", "C": "第2ステージで fork_session を有効にして resume し、共有されたセッション ID から新ホスト上で会話履歴を再構築させる。", "D": "第2ステージの resume 呼び出しをより長いタイムアウトでリトライする。セッションファイルが他コンテナから見えるようになるまで時間がかかるため。"}, "answer": "B", "explanation_ja": "セッションファイルは作成したマシンのローカル（~/.claude/projects/<encoded-cwd>/<session-id>.jsonl）にしか存在しない。使い捨てコンテナでは第1ステージのファイルが消えるため、ID を渡しただけでは復元できない。公式ドキュメントは、ホストをまたぐ場合の選択肢として「セッションファイルを共有ストレージ経由で同じパスに復元する」か「セッション再開に依存せず、必要な結果（解析結果・判断・差分）をアプリケーション状態として取得し、新しいセッションのプロンプトに渡す」を挙げ、後者を『しばしばより堅牢』としている。CI のような使い捨て環境では B が最適。A は誤り: continue は「カレントディレクトリの最新セッション」をローカルのディスクから探すだけなので、ファイルが存在しない別ホストでは同じ問題が起きる。C は誤り: fork は既存の履歴のコピーから新セッションを作る機能であり、履歴（＝ローカルのセッションファイル）が読めなければ何も再構築できない。D は誤り: セッションファイルは非同期に伝播する共有リソースではなく、単にそのホストのローカルファイルなので、待っても現れない。", "source": "https://code.claude.com/docs/en/agent-sdk/sessions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q026", "statement_id": "D1-7", "angle": "troubleshoot", "scenario_ref": 4, "scenario": "A developer tool wraps the Agent SDK to explore unfamiliar codebases. The first query runs from the repository root and its session ID is stored; a follow-up query passes that ID to resume, but the wrapper launches the follow-up process from the tool's own installation directory. Users report that the follow-up answers ignore everything the agent discovered in the first run and start the exploration over from scratch.", "scenario_ja": "ある開発者向けツールが Agent SDK をラップし、未知のコードベースの探索に使われている。最初のクエリはリポジトリのルートから実行され、そのセッション ID が保存される。フォローアップのクエリはその ID を resume に渡すが、ラッパーはフォローアップのプロセスをツール自身のインストールディレクトリから起動している。ユーザーからは、フォローアップの回答が初回実行で発見した内容をすべて無視し、探索を最初からやり直すという報告が上がっている。", "question": "What is the most likely root cause of the lost context?", "question_ja": "文脈が失われている最も可能性の高い根本原因はどれか。", "choices": {"A": "The session ID from ResultMessage is only valid for the process that created it, so a new process must re-register the ID before it can resume.", "B": "Automatic compaction ran at the end of the first query and discarded the transcript, leaving nothing for the resume call to restore.", "C": "The follow-up runs with a different cwd, so the SDK looks for the transcript under a different encoded-cwd directory and starts a new session.", "D": "Sessions are only persisted when allowed_tools is set on the resuming call, so omitting the tool list causes the SDK to create an empty session."}, "choices_ja": {"A": "ResultMessage のセッション ID は生成したプロセス内でのみ有効であり、別プロセスは再開前にその ID を登録し直す必要があるため。", "B": "初回クエリの終了時に自動コンパクションが走ってトランスクリプトが破棄され、resume が復元できるものが残っていないため。", "C": "フォローアップが別の cwd で実行されているため、SDK が別の encoded-cwd ディレクトリを探しに行き、新しいセッションを開始してしまうため。", "D": "セッションは resume 側の呼び出しで allowed_tools を指定したときにのみ永続化され、ツール一覧を省略すると SDK が空のセッションを作るため。"}, "answer": "C", "explanation_ja": "公式ドキュメントは、resume が期待した履歴ではなく新規セッションを返す場合の最も一般的な原因として cwd の不一致を明示している。セッションは ~/.claude/projects/<encoded-cwd>/*.jsonl（非英数字を - に置換した絶対パス）に保存されるため、別ディレクトリから resume を呼ぶと SDK は誤った場所を探す。A は誤り: セッション ID はディスク上のトランスクリプトを指すもので、プロセスに紐づく登録は不要（プロセス再起動後の復帰は正当なユースケースとして挙げられている）。B は誤り: コンパクションは古い履歴を要約に置き換えるだけで、セッションを破棄しない。要約された履歴は再開時も残る。D は誤り: 永続化は既定の挙動であり（TypeScript の persistSession: false で明示的に無効化しない限り）、allowed_tools は権限の自動承認を制御するだけでセッションの保存とは無関係。", "source": "https://code.claude.com/docs/en/agent-sdk/sessions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q027", "statement_id": "D1-7", "angle": "find-error", "scenario_ref": 2, "scenario": "A team uses Claude Code for a long refactor. The agent read and edited a dozen files, then the session was paused while two teammates hand-edited several of those same files and merged an upstream branch. The lead writes a runbook step: \"Resume the named session and simply say 'continue the refactor' — the session already has full context of every file, so no re-reading is needed.\"", "scenario_ja": "あるチームが大規模なリファクタリングに Claude Code を使っている。エージェントは十数個のファイルを読み書きした後、セッションが一時停止され、その間に2人のチームメイトが同じファイルのいくつかを手作業で編集し、上流ブランチをマージした。リードは次のような手順書を書いた。「名前付きセッションを再開し、単に『リファクタリングを続けて』と言えばよい。セッションには全ファイルの完全な文脈がすでにあるので、読み直しは不要である。」", "question": "What is the flaw in this runbook step?", "question_ja": "この手順書のステップの誤りはどこか。", "choices": {"A": "Resuming a session that already contains edits is not supported; the transcript must be forked first so the original history stays writable for the new turns.", "B": "Sessions expire once the process that created them exits, so the runbook should instruct the operator to re-run the original prompt rather than resume by name.", "C": "Resuming replays every recorded tool call against the filesystem, so the teammates' hand edits would be silently overwritten by the agent's earlier Edit calls.", "D": "The restored context holds the file contents as they were when the agent read them, so the prompt must tell the agent the files changed and have it re-read them."}, "choices_ja": {"A": "すでに編集を含むセッションの再開はサポートされておらず、新しいターンのために元の履歴を書き込み可能に保つには、まずトランスクリプトをフォークする必要がある。", "B": "セッションは生成したプロセスが終了すると失効するため、手順書では名前で再開するのではなく元のプロンプトを再実行するよう指示すべきである。", "C": "再開すると記録済みのツール呼び出しがすべてファイルシステムに対して再生されるため、チームメイトの手編集がエージェントの過去の Edit 呼び出しで黙って上書きされる。", "D": "復元される文脈はエージェントが読んだ時点のファイル内容を保持しているため、プロンプトでファイルが変更されたことを伝え、読み直させる必要がある。"}, "answer": "D", "explanation_ja": "セッションが永続化するのは会話（プロンプト・ツール呼び出し・ツール結果・応答）であってファイルシステムではない。再開時に復元される Read の結果は「読んだ当時のスナップショット」であり、その後に人手で編集された内容は反映されていない。したがって古いツール結果を根拠に作業を続けると誤った編集につながるため、再開時のプロンプトでファイルが変更された旨を伝え、対象を読み直させる必要がある（変更が大きい場合は、構造化された要約を持った新規セッションで始める方が良いこともある）。A は誤り: 編集を含むセッションの再開は正当な標準ユースケースで、fork は「元を残して別方針を試す」ための機能であり再開の前提条件ではない。B は誤り: セッションはディスクに書かれるので、プロセス再起動後の再開はドキュメントが挙げる代表的な用途である。C は誤り: 再開は会話履歴を文脈として復元するだけで、過去のツール呼び出しを再実行（リプレイ）することはない。", "source": "https://code.claude.com/docs/en/agent-sdk/sessions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q028", "statement_id": "D1-6", "angle": "design-choice", "scenario_ref": 5, "scenario": "Your CI pipeline runs Claude Code on every pull request. A typical PR touches 30-40 files, and the required review checklist is always the same: naming conventions, error handling, test coverage, and whether a change in one module breaks its callers elsewhere. Today the job sends the entire diff in one prompt, and reviewers complain that findings for files late in the diff are shallow or missing.", "scenario_ja": "あなたのCIパイプラインは、すべてのプルリクエストで Claude Code を実行している。典型的なPRは30〜40ファイルに触れ、必須のレビュー項目は常に同じである：命名規約、エラー処理、テストカバレッジ、そしてあるモジュールの変更が他所の呼び出し元を壊していないか。現在このジョブは差分全体を1つのプロンプトで送っており、レビュアーからは差分の後半にあるファイルの指摘が浅い、または欠落しているという苦情が出ている。", "question": "Which task decomposition strategy best fits this review workflow?", "question_ja": "このレビューのワークフローに最も適したタスク分解戦略はどれか。", "choices": {"A": "Keep the single-prompt review but raise the reasoning effort level and the max turns so the model spends more time on the later files in the diff.", "B": "Use a fixed prompt chain: one focused local analysis pass per file, then a separate cross-file integration pass that receives the per-file findings plus the call-site information.", "C": "Let the reviewer agent plan its own investigation at runtime, deciding after each file which files are worth reading next and stopping when it judges the PR understood.", "D": "Split the diff into per-file passes only, and report the union of the per-file findings as the final review without any additional aggregation step."}, "choices_ja": {"A": "単一プロンプトのレビューは維持しつつ、reasoning effort レベルと最大ターン数を上げ、差分後半のファイルにより多くの時間を使わせる。", "B": "固定のプロンプトチェーンを使う：ファイルごとに1回ずつ局所的な解析パスを行い、その後、各ファイルの指摘と呼び出し箇所の情報を受け取る独立したクロスファイル統合パスを実行する。", "C": "レビュー用エージェントに実行時に自分で調査計画を立てさせ、1ファイル読むごとに次に読むべきファイルを判断し、PRを理解したと自ら判断した時点で停止させる。", "D": "差分をファイル単位のパスに分割するだけにして、各パスの指摘を単純に合算したものを最終レビューとして報告し、集約ステップは設けない。"}, "answer": "B", "explanation_ja": "レビュー項目が毎回同じで結果の再現性が求められる「予測可能な多観点レビュー」は、固定の逐次パイプライン（プロンプトチェーン）が適する。大きなレビューをファイル単位の局所解析パスと、別立てのクロスファイル統合パスに分けることで、注意の希薄化（attention dilution）を避けつつ、呼び出し元の破壊のようなファイル横断の問題も検出できる。Aは根本原因が分解の欠如であって推論量の不足ではないため、コンテキストに全ファイルを積んだままでは後半の見落としは解消しない。Cは動的分解であり、オープンエンドな調査には向くが、毎回同じチェックリストを網羅すべきCIレビューでは対象選択が実行ごとに変わり、カバレッジが非決定的になる。Dはファイル単位の分解までは正しいが統合パスがないため、モジュール間の不整合という要件を満たせない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q029", "statement_id": "D1-6", "angle": "troubleshoot", "scenario_ref": 4, "scenario": "You built a Claude Agent SDK helper that onboards developers to unfamiliar repositories. It always executes the same four steps in order: list the directory tree, read the README, read the entry-point file, and write a summary. On small services it works well, but on a large monorepo the summaries confidently describe an outdated architecture and never mention the service's actual message-queue layer, even though the entry point imports a module that clearly leads to it.", "scenario_ja": "あなたは、開発者が不慣れなリポジトリに入るのを助ける Claude Agent SDK 製のツールを作った。これは常に同じ4ステップを順に実行する：ディレクトリツリーの一覧、READMEの読み込み、エントリポイントファイルの読み込み、要約の作成。小さなサービスではうまく動くが、大きなモノレポでは、要約が自信満々に古いアーキテクチャを記述し、そのサービスの実際のメッセージキュー層に一切触れない。エントリポイントは明らかにそこへ繋がるモジュールを import しているにもかかわらずである。", "question": "What is the most likely root cause of the incomplete summaries?", "question_ja": "不完全な要約の根本原因として最も可能性が高いものはどれか。", "choices": {"A": "The four steps run as separate subagents, so the summary step never receives the file contents that the earlier steps read from disk.", "B": "The directory listing returns too many paths for a large monorepo, so the tool output is truncated before Claude can see the message-queue directory.", "C": "The workflow is a fixed pipeline, so it cannot spawn follow-up steps from intermediate findings such as the imports discovered in the entry-point file.", "D": "The session hits automatic compaction between the read steps and the summary step, so the earlier findings are summarized away before they can be used."}, "choices_ja": {"A": "4つのステップが別々のサブエージェントとして実行されているため、要約ステップは前のステップがディスクから読んだファイル内容を一切受け取っていない。", "B": "大きなモノレポではディレクトリ一覧が返すパスが多すぎ、Claude が見る前にツール出力が切り詰められてメッセージキューのディレクトリが落ちている。", "C": "このワークフローは固定パイプラインであり、エントリポイントで見つかった import のような中間発見から追加のステップを派生させることができない。", "D": "読み込みステップと要約ステップの間で自動コンパクションが発生し、以前の発見が要約されて失われている。"}, "answer": "C", "explanation_ja": "未知のコードベースの探索は「何が出てくるか事前に分からない」オープンエンドな調査であり、各ステップの発見に基づいて次のサブタスクを生成する動的（適応的）分解が必要。固定の4ステップでは、エントリポイントの import から辿るべき追加調査が計画に存在せず、モデルは見えている範囲だけで断定的な要約を書いてしまう。これがモノレポでのみ顕在化するのも、規模が大きいほど「固定ステップで見える範囲」の外に本体があるためで症状と整合する。Aはサブエージェント構成だと明記されておらず、また要約が「古いアーキテクチャ」を一応記述できている＝前段の情報は届いている点と矛盾する。Bならメッセージキュー層以外の記述も同様に欠落・破綻するはずで、一貫して同じ層だけが抜ける説明にならない。Dのコンパクションは長時間セッションで文脈が溢れたときの挙動で、4ステップの短い実行では発生する状況になく、症状が特定領域に限定されることも説明できない。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q030", "statement_id": "D1-6", "angle": "find-error", "scenario_ref": 5, "scenario": "A teammate proposes this CI reviewer prompt for every pull request: \"You are a code reviewer. Explore the repository however you see fit, decide which files are worth investigating, follow whatever leads look interesting, and stop when you are confident you understand the change. Report what you found.\" The team's compliance policy requires that every PR be checked against the same four criteria, and that the same PR reviewed twice produce the same findings.", "scenario_ja": "同僚が、すべてのプルリクエストに対して次のCIレビュー用プロンプトを提案している：「あなたはコードレビュアーです。リポジトリを好きなように探索し、調査に値するファイルを自分で決め、興味を引く手がかりを追い、変更を理解したと確信したら停止してください。見つけたことを報告してください」。チームのコンプライアンス方針では、すべてのPRを同じ4つの基準で検査すること、および同じPRを2回レビューしたら同じ指摘が出ることが要求されている。", "question": "What is the primary flaw in this proposal?", "question_ja": "この提案の主な欠陥は何か。", "choices": {"A": "The prompt does not name the specific built-in tools the reviewer should use, so Claude cannot search the repository and will review only the files it was handed.", "B": "The prompt lacks a max turns or budget limit, which is the reason the reviewer's coverage of the four criteria varies between runs of the same pull request.", "C": "The prompt asks for a free-text report, and only enforcing a JSON schema on the output can make a review reproducible across repeated runs.", "D": "It applies open-ended dynamic decomposition to a workflow whose scope is fixed and known, so coverage of the four required criteria becomes run-dependent instead of guaranteed."}, "choices_ja": {"A": "プロンプトがレビュアーの使うべき組み込みツールを名指ししていないため、Claude はリポジトリを検索できず、渡されたファイルしかレビューできない。", "B": "プロンプトに最大ターン数や予算の上限がなく、これが同一PRの実行ごとに4基準のカバレッジがぶれる原因になっている。", "C": "プロンプトが自由記述のレポートを求めており、出力にJSONスキーマを強制することによってのみ、繰り返し実行でのレビューの再現性が得られる。", "D": "スコープが固定かつ既知のワークフローに対して、オープンエンドな動的分解を適用しており、必須の4基準のカバレッジが保証されず実行ごとに変わってしまう。"}, "answer": "D", "explanation_ja": "動的分解は「何を調べるべきか事前に分からない」調査タスクのための手法で、逆にチェック項目が固定され再現性が要件になっているCIレビューには不適合。この用途では固定の逐次パイプライン（基準ごと・ファイルごとのパスを明示的に並べる）にして、どの実行でも同じ工程が回るようにするのが正しい。Aは誤りで、Read/Grep/Glob などの組み込みツールは明示しなくても利用可能であり、探索できないことが問題なのではなく探索範囲が実行ごとに変わることが問題。Bのターン数・予算上限は暴走コスト対策として有用だが、上限を付けても「どこを見るかをモデルが毎回決める」性質は変わらず、カバレッジのばらつきは解消しない。Cのスキーマ強制は出力の形を揃えるだけで、どの範囲を検査したかという中身の網羅性・再現性は担保しない。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q031", "statement_id": "D1-6", "angle": "tradeoff", "scenario_ref": 3, "scenario": "Your multi-agent research system currently routes every request through the same fixed chain: web search, then document analysis, then synthesis, then report generation. About 70% of incoming requests are narrow factual lookups that one search pass answers, while the rest are broad open-ended topics that need several rounds of follow-up. Product wants median latency and per-request cost cut roughly in half without losing depth on the broad topics.", "scenario_ja": "あなたのマルチエージェント調査システムは現在、すべてのリクエストを同じ固定チェーンに通している：Web検索 → 文書分析 → 統合 → レポート生成。受け付けるリクエストの約70%は1回の検索パスで答えられる狭い事実照会で、残りは何度も追加調査が必要な広くオープンエンドなテーマである。プロダクト側は、広いテーマでの深さを失わずに、レイテンシ中央値とリクエスト単価をおよそ半減させたいと考えている。", "question": "Which decomposition approach best satisfies these constraints?", "question_ja": "これらの制約を最もよく満たす分解方針はどれか。", "choices": {"A": "Have the coordinator classify each request first, run a short fixed chain for narrow lookups, and build an adaptive plan that re-delegates based on intermediate findings for broad topics.", "B": "Keep the fixed four-stage chain for every request but run the search, analysis, and synthesis stages concurrently so the total time equals that of the slowest stage.", "C": "Replace the fixed chain with fully dynamic decomposition for every
