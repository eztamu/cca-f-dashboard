mdファイルは完全なAPIリファレンス、例、エッジケースの表を含めて8,000行にまで膨れ上がり、Claudeのパフォーマンスが低下している。", "question": "How should the skill be restructured according to progressive disclosure principles?", "question_ja": "progressive disclosure（段階的開示）の原則に従うと、このskillはどう再構成すべきか？", "choices": {"A": "Split the content into multiple skills with identical descriptions so Claude picks one at random", "B": "Keep a concise SKILL.md with the core workflow, and move detailed references into separate files in the skill folder that Claude reads only when needed", "C": "Move all content into the system prompt so it is always available", "D": "Compress the text by removing whitespace and abbreviating words"}, "choices_ja": {"A": "Claudeがランダムに1つを選ぶよう、同一の説明文を持つ複数のskillにコンテンツを分割する", "B": "コアとなるワークフローを含む簡潔なSKILL.mdを維持し、詳細な参考資料はskillフォルダ内の別ファイルに移して、必要なときだけClaudeが読み込むようにする", "C": "常に利用可能であるよう、すべてのコンテンツをシステムプロンプトに移す", "D": "空白を削除し単語を省略してテキストを圧縮する"}, "answer": "B", "explanation_ja": "Skills の設計原則は progressive disclosure：常時読み込まれるのは skill の説明（と本体は必要になったとき）で、詳細資料は skill フォルダ内の別ファイルに分け、必要なときだけ Claude が参照する。C はコンテキストを常時圧迫し逆効果。A/D は問題を解決しない。", "source": "https://code.claude.com/docs/en/skills", "pack": "v1"}, {"id": "D3-q003", "statement_id": "D3-2", "scenario": "A team has three needs: (1) a frequently typed shortcut that expands to a fixed review-checklist prompt, (2) domain expertise Claude should apply automatically whenever it works on billing code, and (3) an isolated read-only investigator for large log searches that should not pollute the main context.", "scenario_ja": "あるチームには3つのニーズがある：(1) 固定のレビューチェックリストのプロンプトに展開される、頻繁に入力されるショートカット、(2) 請求関連のコードを扱うときにClaudeが常に自動的に適用すべき専門知識、(3) 大規模なログ検索のための、メインのコンテキストを汚染すべきでない独立した読み取り専用の調査役。", "question": "Which mapping of features to needs is correct?", "question_ja": "機能とニーズの対応付けとして正しいのはどれか？", "choices": {"A": "(1) subagent, (2) slash command, (3) skill", "B": "(1) slash command, (2) skill, (3) subagent", "C": "(1) skill, (2) subagent, (3) slash command", "D": "(1) slash command, (2) subagent, (3) skill"}, "choices_ja": {"A": "(1) subagent, (2) slash command, (3) skill", "B": "(1) slash command, (2) skill, (3) subagent", "C": "(1) skill, (2) subagent, (3) slash command", "D": "(1) slash command, (2) subagent, (3) skill"}, "answer": "B", "explanation_ja": "ユーザーが明示的に打つ定型プロンプトはスラッシュコマンド。条件に合致したとき Claude が自律的に読み込む専門知識は skill。独立コンテキストで動く探索・調査ワーカーはサブエージェント。この3つの使い分けは頻出ポイント。", "source": "https://code.claude.com/docs/en/skills", "pack": "v1"}, {"id": "D3-q004", "statement_id": "D3-1", "scenario": "A team wants to automatically run a code formatter on every file that Claude Code edits, immediately after each edit succeeds.", "scenario_ja": "あるチームは、Claude Codeが編集したすべてのファイルに対して、各編集が成功した直後に自動的にコードフォーマッタを実行したいと考えている。", "question": "Which hook event should they use?", "question_ja": "どのフックイベントを使うべきか？", "choices": {"A": "PreToolUse matched on the Edit tool", "B": "PostToolUse matched on the Edit tool", "C": "UserPromptSubmit", "D": "SessionStart"}, "choices_ja": {"A": "EditツールにマッチさせたPreToolUse", "B": "EditツールにマッチさせたPostToolUse", "C": "UserPromptSubmit", "D": "SessionStart"}, "answer": "B", "explanation_ja": "編集が『成功した後』に走らせる処理は PostToolUse（matcher で Edit/Write 系ツールに絞る）。PreToolUse は実行前の検証・ブロック用。UserPromptSubmit はプロンプト送信時、SessionStart はセッション開始時で用途が異なる。イベントごとの発火タイミングの理解が問われる。", "source": "https://code.claude.com/docs/en/hooks", "pack": "v1"}, {"id": "D3-q005", "statement_id": "D3-6", "scenario": "During a long refactoring session, a developer asks Claude Code to also investigate a flaky test. The investigation involves reading dozens of log files, and the developer worries this will crowd out the refactoring context.", "scenario_ja": "長時間のリファクタリングセッション中に、開発者はClaude Codeに不安定なテストの調査も依頼した。その調査は数十個のログファイルを読むことを伴い、開発者はこれがリファクタリングのコンテキストを圧迫するのではないかと心配している。", "question": "What is the best way to handle the investigation?", "question_ja": "この調査を扱う最良の方法は何か？", "choices": {"A": "Run the investigation in the same conversation and use /compact afterwards", "B": "Delegate the investigation to a subagent, which works in its own context window and returns only its findings", "C": "Paste all log files into CLAUDE.md so they persist", "D": "Disable the Read tool so logs cannot enter the context"}, "choices_ja": {"A": "同じ会話の中で調査を実行し、その後/compactを使う", "B": "調査をサブエージェントに委譲する。サブエージェントは自身のコンテキストウィンドウの中で作業し、結果のみを返す", "C": "すべてのログファイルをCLAUDE.mdに貼り付けて永続化する", "D": "ログがコンテキストに入らないようReadツールを無効化する"}, "answer": "B", "explanation_ja": "サブエージェントは独立したコンテキストウィンドウを持ち、大量のファイル読み込みを本体の会話から分離できる。返ってくるのは要約された結論のみ。A は一度汚れたコンテキストの対症療法。C は CLAUDE.md の誤用。D は投機的で作業自体を不可能にする。", "source": "https://code.claude.com/docs/en/sub-agents", "pack": "v1"}, {"id": "D3-q006", "statement_id": "D3-6", "scenario": "A team wants their CI pipeline to automatically triage new GitHub issues using Claude Code: no interactive terminal, a single prompt in, structured result out.", "scenario_ja": "あるチームは、対話的なターミナルなしで、単一のプロンプトを入力すると構造化された結果が出力される形で、CIパイプラインがClaude Codeを使って新しいGitHub issueを自動的にトリアージできるようにしたいと考えている。", "question": "Which invocation pattern fits this requirement?", "question_ja": "この要件に適合する呼び出しパターンはどれか？", "choices": {"A": "Run 'claude' interactively on the CI runner and type the prompt manually", "B": "Use headless mode: 'claude -p \"<prompt>\"' with an output format suitable for scripting, or the Claude Code GitHub Action", "C": "Headless usage is not supported; CI must call the raw Messages API without Claude Code", "D": "Enable a SessionStart hook that reads the issue from an environment variable"}, "choices_ja": {"A": "CIランナー上で'claude'を対話的に実行し、プロンプトを手動で入力する", "B": "ヘッドレスモードを使う：スクリプト向きの出力フォーマットを伴う'claude -p \"<prompt>\"'、あるいはClaude Code GitHub Actionを使う", "C": "ヘッドレス利用はサポートされていない。CIはClaude Codeを使わず生のMessages APIを呼び出す必要がある", "D": "環境変数からissueを読み込むSessionStartフックを有効にする"}, "answer": "B", "explanation_ja": "CI/CD などの非対話環境では headless モード（claude -p、--output-format json 等）や GitHub Actions 統合を使う。A は非対話環境で成立しない。C は誤り（headless は公式サポート）。D はフックの用途違い。", "source": "https://code.claude.com/docs/en/headless", "pack": "v1"}, {"id": "D3-q007", "statement_id": "D3-5", "scenario": "A developer asks Claude Code to \"reformat this CSV export into the format our billing system expects.\" The prose description alone produces inconsistent transformations across different runs.", "scenario_ja": "ある開発者はClaude Codeに「このCSVエクスポートを請求システムが期待する形式に整形し直して」と依頼した。散文的な説明だけでは、実行のたびに一貫性のない変換が生成される。", "question": "What is the most effective way to get consistent, correct results?", "question_ja": "一貫した正しい結果を得る最も効果的な方法は何か？", "choices": {"A": "Provide 2-3 concrete input/output examples showing the exact transformation expected, rather than relying on the prose description alone", "B": "Repeat the prose description three times using different wording each time", "C": "Reduce max_tokens so the model has less room to improvise", "D": "Ask the model to guess the billing system's format from its training knowledge"}, "choices_ja": {"A": "散文的な説明だけに頼るのではなく、期待される正確な変換を示す2〜3個の具体的な入出力例を示す", "B": "毎回異なる言い回しで散文的な説明を3回繰り返す", "C": "モデルの即興の余地を減らすためmax_tokensを減らす", "D": "モデルにその学習知識から請求システムの形式を推測させる"}, "answer": "A", "explanation_ja": "散文的な説明だけでは解釈が一貫しない場合、具体的な入出力例（2〜3個）を示すのが最も効果的な反復的洗練技法。曖昧な変換要求ほど例示の効果が大きい。B は根本解決にならず、C/D は無関係・不確実。", "source": "materials/official/exam-guide.pdf (Task Statement 3.5)", "pack": "v1"}, {"id": "D4-q001", "statement_id": "D4-1", "scenario": "A prompt embeds a 20-page contract followed by analysis instructions. Claude sometimes treats sentences from the contract as instructions, and sometimes ignores parts of the actual instructions.", "scenario_ja": "あるプロンプトは20ページの契約書の後に分析指示を埋め込んでいる。Claudeは契約書中の文をときどき指示として扱ってしまい、また実際の指示の一部を無視してしまうこともある。", "question": "What is the most effective structural fix?", "question_ja": "最も効果的な構造上の修正は何か？", "choices": {"A": "Move the instructions to the middle of the contract so they are harder to miss", "B": "Wrap the contract in XML tags like <contract>...</contract> and the instructions in <instructions>...</instructions> so content and directives are unambiguous", "C": "Convert the entire prompt to uppercase for emphasis", "D": "Split the request into 20 separate API calls, one page each"}, "choices_ja": {"A": "見逃されにくいよう、指示を契約書の中央に移動する", "B": "契約書を<contract>...</contract>のようなXMLタグで囲み、指示を<instructions>...</instructions>で囲むことで、コンテンツと指示を明確に区別する", "C": "強調のためプロンプト全体を大文字に変換する", "D": "リクエストを1ページごとの20個の別々のAPI呼び出しに分割する"}, "answer": "B", "explanation_ja": "データ（文書）と指示の混同は XML タグによる構造化で解決するのが定石。タグは Claude が特別扱いするマーカーとして機能し、パーツの境界を明確にする。A/C は効果がなく、D はコストと文脈分断の問題を生む。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/use-xml-tags", "pack": "v1"}, {"id": "D4-q002", "statement_id": "D4-2", "scenario": "A classification prompt describes the desired output format in words ('Respond with the category name, a pipe, then a confidence from 0-100'), but Claude's outputs vary: sometimes prose, sometimes different separators.", "scenario_ja": "ある分類プロンプトは、望ましい出力形式を言葉で説明している（「カテゴリ名、パイプ記号、0〜100の信頼度で応答してください」）が、Claudeの出力はばらつく：あるときは散文で、あるときは異なる区切り文字を使う。", "question": "What is the most reliable prompt-level improvement?", "question_ja": "最も信頼できるプロンプトレベルの改善は何か？", "choices": {"A": "Add 3-5 few-shot examples showing exact input → output pairs in the desired format", "B": "Repeat the format description three times in the prompt", "C": "Raise max_tokens so Claude has room to comply", "D": "Add 'this is very important' before the format description"}, "choices_ja": {"A": "望ましい形式での正確な入力→出力のペアを示す3〜5個のfew-shot例を追加する", "B": "プロンプト内で形式の説明を3回繰り返す", "C": "Claudeが従うための余地を持てるようmax_tokensを上げる", "D": "形式の説明の前に「これは非常に重要です」を追加する"}, "answer": "A", "explanation_ja": "出力フォーマットのブレは few-shot（multishot）例示が最も効果的。具体例は言葉の説明より強く形式を規定する。B/D は限界がありスケールしない。C は無関係。（さらに確実性が必要なら構造化出力＝JSONスキーマの利用へ進む）", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/multishot-prompting", "pack": "v1"}, {"id": "D4-q003", "statement_id": "D4-1", "scenario": "A financial-analysis prompt asks Claude for a final recommendation on a complex multi-factor decision. Answers are quick but frequently miss important considerations.", "scenario_ja": "ある財務分析プロンプトは、複雑な多要因の意思決定についてClaudeに最終的な推奨を求めている。回答は速いが、重要な考慮事項をしばしば見落としている。", "question": "Which technique most directly improves answer quality here?", "question_ja": "ここで回答の品質を最も直接的に改善する技法はどれか？", "choices": {"A": "Chain of thought: instruct Claude to reason through the factors step by step before giving the recommendation (or enable extended thinking)", "B": "Lower max_tokens to force more focused answers", "C": "Ask for the recommendation first, then the reasoning, so the answer is not biased", "D": "Split every factor into a separate unrelated conversation"}, "choices_ja": {"A": "Chain of thought：推奨を出す前に要因を段階的に推論するようClaudeに指示する（またはextended thinkingを有効にする）", "B": "より焦点を絞った回答を強制するためmax_tokensを下げる", "C": "答えが偏らないよう、まず推奨を求め、その後に理由付けを求める", "D": "すべての要因をそれぞれ無関係な別の会話に分割する"}, "answer": "A", "explanation_ja": "複雑な多要因の判断には Chain of Thought（段階的に考えさせてから結論）や extended thinking が有効。順序が重要で、推論→結論の順にする。C は逆（結論を先に出させると推論が後付けになる）。B は思考の余地を奪う。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-of-thought", "pack": "v1"}, {"id": "D4-q004", "statement_id": "D4-3", "scenario": "A production pipeline parses Claude's JSON responses. About 2% of responses fail parsing due to markdown code fences, trailing commentary, or schema drift, and the team currently retries with modified prompts.", "scenario_ja": "ある本番パイプラインはClaudeのJSONレスポンスをパースしている。約2%のレスポンスが、Markdownのコードフェンス、末尾のコメント、スキーマのずれによりパースに失敗し、チームは現在プロンプトを修正してリトライしている。", "question": "What is the most robust solution?", "question_ja": "最も堅牢な解決策は何か？", "choices": {"A": "Add 'return ONLY valid JSON' in capital letters to the prompt", "B": "Use structured outputs: pass a JSON schema via output_config format so the API guarantees schema-valid output", "C": "Write a regex that strips everything before the first '{' and after the last '}'", "D": "Lower the temperature so outputs vary less"}, "choices_ja": {"A": "プロンプトに大文字で「有効なJSONのみを返してください」を追加する", "B": "構造化出力を使う：output_configのformatを介してJSONスキーマを渡し、APIがスキーマに準拠した出力を保証するようにする", "C": "最初の'{'より前とすべて最後の'}'より後を取り除く正規表現を書く", "D": "出力のばらつきを減らすためtemperatureを下げる"}, "answer": "B", "explanation_ja": "確実な JSON が必要なら構造化出力（output_config の format に json_schema を指定）が正解。API レベルでスキーマ準拠が保証される。A は改善するが保証がない、C は場当たり的で schema drift に無力、D は根本解決にならない（最新モデルではサンプリングパラメータ自体が使えない場合もある）。", "source": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "pack": "v1"}, {"id": "D4-q005", "statement_id": "D4-3", "scenario": "A team needs to extract structured contact records from free-form emails. They want schema-validated fields AND they are on an API surface where they prefer defining the schema as part of tool use.", "scenario_ja": "あるチームは、自由形式のメールから構造化された連絡先レコードを抽出する必要がある。スキーマ検証されたフィールドが欲しく、かつツール利用の一部としてスキーマを定義することを好むAPIサーフェスを使っている。", "question": "Which approach implements tool-based JSON extraction?", "question_ja": "ツールベースのJSON抽出を実装するアプローチはどれか？", "choices": {"A": "Define a tool (e.g. record_contact) whose input_schema is the desired record schema, and force its use with tool_choice, then read the arguments from the tool_use block", "B": "Define a tool that returns the email text back to Claude for a second pass", "C": "Ask Claude to call an imaginary tool in plain text and parse the text", "D": "Use stop sequences to cut the response at the end of the JSON"}, "choices_ja": {"A": "望ましいレコードスキーマをinput_schemaとして持つツール（例：record_contact）を定義し、tool_choiceでその使用を強制し、tool_useブロックから引数を読む", "B": "2回目のパスのためにメール本文をClaudeに送り返すツールを定義する", "C": "Claudeにプレーンテキストで架空のツールを呼び出させ、そのテキストをパースする", "D": "JSONの終端でレスポンスを打ち切るためstop sequencesを使う"}, "answer": "A", "explanation_ja": "tool-based extraction は『抽出したいスキーマを input_schema に持つツールを定義し、tool_choice で強制、tool_use ブロックの input を読む』パターン。モデルはスキーマに従った引数を生成する。strict: true を付ければさらに厳密。C は擬似ツールで信頼性がない。D は構造保証にならない。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "pack": "v1"}, {"id": "D4-q006", "statement_id": "D4-1", "scenario": "A legal-tech product needs Claude to consistently respond as a cautious legal analyst across thousands of API calls: same persona, same constraints, same output conventions.", "scenario_ja": "あるリーガルテック製品は、数千回のAPI呼び出しにわたって、Claudeが慎重な法務アナリストとして一貫して応答する必要がある：同じペルソナ、同じ制約、同じ出力の慣習を保つ。", "question": "Where should this persona definition live?", "question_ja": "このペルソナ定義はどこに置くべきか？", "choices": {"A": "In the system prompt (system parameter), defining the role, task framing, and constraints once for every request", "B": "Repeated at the start of every user message", "C": "In the first assistant message as a self-introduction", "D": "In tool descriptions, since they are read most carefully"}, "choices_ja": {"A": "システムプロンプト（systemパラメータ）に置き、すべてのリクエストに対して役割・タスクの枠組み・制約を一度だけ定義する", "B": "すべてのuserメッセージの冒頭で繰り返す", "C": "自己紹介として最初のassistantメッセージに置く", "D": "最も注意深く読まれるため、ツールの説明文に置く"}, "answer": "A", "explanation_ja": "役割（role）とタスクの枠組みは system プロンプトに置くのが基本。全リクエストに一貫して効き、キャッシュ効率も良い（安定した接頭辞）。B は冗長でキャッシュを乱し、C/D は本来の用途ではなく効果も不安定。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/system-prompts", "pack": "v1"}, {"id": "D4-q007", "statement_id": "D4-5", "scenario": "A company must classify 80,000 archived documents. There is no latency requirement — results are needed within a day — and cost matters.", "scenario_ja": "ある企業は8万件のアーカイブ文書を分類しなければならない。レイテンシ要件はなく（結果は1日以内に必要）、コストが重要である。", "question": "What is the most cost-effective approach?", "question_ja": "最もコスト効率の良いアプローチは何か？", "choices": {"A": "Send 80,000 sequential Messages API requests with a large model", "B": "Use the Message Batches API, which processes requests asynchronously at 50% of standard prices (most batches complete within an hour, max 24 hours)", "C": "Send all 80,000 documents in one giant request to save on per-request overhead", "D": "Use streaming to reduce token costs"}, "choices_ja": {"A": "大きなモデルを使って8万回の逐次的なMessages APIリクエストを送信する", "B": "標準価格の50%で非同期に処理されるMessage Batches APIを使う（ほとんどのバッチは1時間以内に完了、最大24時間）", "C": "リクエストごとのオーバーヘッドを節約するため、8万件の文書すべてを1つの巨大なリクエストで送る", "D": "トークンコストを減らすためストリーミングを使う"}, "answer": "B", "explanation_ja": "レイテンシ要件がない大量処理は Batch API 一択：全トークン50%引き、非同期で最大24時間以内に処理。1バッチ最大10万リクエスト。C は 1リクエストのコンテキスト上限を超えるし、そもそも安くならない。D のストリーミングは配信方式でありコストは変わらない。モデルの選択（Haiku等）も併用できる。", "source": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "pack": "v1"}, {"id": "D4-q008", "statement_id": "D4-6", "scenario": "A team asks the same Claude conversation that wrote a piece of code to review it for bugs. The review consistently reports 'no issues', yet bugs are later found in production.", "scenario_ja": "あるチームは、コードを書いたのと同じClaudeの会話に、バグがないかそのコードをレビューさせている。レビューは一貫して「問題なし」と報告するが、後になって本番環境でバグが見つかる。", "question": "What is the architectural lesson?", "question_ja": "アーキテクチャ上の教訓は何か？", "choices": {"A": "Claude cannot review code at all; only humans should review", "B": "Self-review within the same context is limited — the model is anchored by its own reasoning; use an independent instance with fresh context (and ideally a review-focused prompt) for critique", "C": "The review prompt needs the word 'CRITICAL' added", "D": "Reviews should run at a higher temperature for more creativity"}, "choices_ja": {"A": "Claudeはコードレビューをまったくできない。人間だけがレビューすべきである", "B": "同一コンテキスト内でのself-reviewには限界がある——モデルは自分自身の推論にアンカリングされてしまう。批評には新しいコンテキストを持つ独立したインスタンス（理想的にはレビューに特化したプロンプト）を使うべきである", "C": "レビュープロンプトに「CRITICAL」という単語を追加する必要がある", "D": "レビューはより創造性を発揮できるよう、より高いtemperatureで実行すべきである"}, "answer": "B", "explanation_ja": "同一コンテキストでの self-review は自分の推論・前提にアンカリングされ欠陥を見逃しやすい。独立したコンテキスト（別インスタンス・レビュー専用プロンプト）でのレビューが有効。信頼性設計の定石で、Claude Code のサブエージェントレビューも同じ発想。A は極端、C/D は本質でない。", "source": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "pack": "v1"}, {"id": "D4-q009", "statement_id": "D4-4", "scenario": "An extraction pipeline validates output against a Pydantic schema. On failure, the current implementation simply resends the exact same request unchanged, hoping for a different result.", "scenario_ja": "ある抽出パイプラインは出力をPydanticスキーマに対して検証している。失敗した場合、現在の実装は単に元とまったく同じリクエストを変更せず再送し、異なる結果が出ることを期待している。", "question": "What change would make the retry loop actually effective, and when should retries be abandoned?", "question_ja": "リトライループを実際に効果的にする変更は何か。また、いつリトライを諦めるべきか？", "choices": {"A": "On retry, append the original document, the failed extraction, and the specific validation error to the prompt so the model can self-correct; abandon retries when the required information is simply absent from the source document rather than a format issue", "B": "Always retry exactly three times with the unchanged original prompt, regardless of the error type", "C": "Lower the temperature on every retry until the output validates", "D": "Switch to a larger model on the first failure without changing the prompt"}, "choices_ja": {"A": "リトライ時には、元の文書、失敗した抽出結果、そして具体的な検証エラーをプロンプトに追加し、モデルが自己修正できるようにする。必要な情報が単に元の文書に存在しない場合（形式の問題ではない場合）はリトライを諦める", "B": "エラーの種類に関わらず、変更しない元のプロンプトで常にちょうど3回リトライする", "C": "出力が検証を通るまで、リトライのたびにtemperatureを下げる", "D": "プロンプトを変更せず、最初の失敗でより大きなモデルに切り替える"}, "answer": "A", "explanation_ja": "有効なリトライは『具体的な検証エラーをプロンプトに追加して自己修正させる』こと。ただし情報がそもそも文書に存在しない場合（構造・書式の問題ではない）はリトライしても無意味なので見切りが必要。B は変更なしの盲目的リトライで効果が薄い。C/D は根本原因（欠落情報 vs 形式エラー）に対処していない。", "source": "materials/official/exam-guide.pdf (Task Statement 4.4)", "pack": "v1"}, {"id": "D5-q001", "statement_id": "D5-4", "scenario": "A developer sets \"model\": \"opus\" in ~/.claude/settings.json (user scope), but the project's .claude/settings.json sets \"model\": \"sonnet\". The developer also has .claude/settings.local.json with \"model\": \"haiku\".", "scenario_ja": "ある開発者は~/.claude/settings.json（ユーザースコープ）で\"model\": \"opus\"を設定しているが、プロジェクトの.claude/settings.jsonでは\"model\": \"sonnet\"が設定されている。この開発者はさらに.claude/settings.local.jsonで\"model\": \"haiku\"を設定している。", "question": "Which model applies in this project, and why?", "question_ja": "このプロジェクトではどのモデルが適用されるか、またその理由は？", "choices": {"A": "opus — user settings always win because they are the most personal", "B": "sonnet — project settings override local settings", "C": "haiku — local settings take precedence over shared project settings, which take precedence over user settings", "D": "The session fails to start because conflicting values are an error"}, "choices_ja": {"A": "opus——ユーザー設定は最も個人的なものであるため常に優先される", "B": "sonnet——プロジェクト設定はローカル設定より優先される", "C": "haiku——ローカル設定は共有プロジェクト設定より優先され、共有プロジェクト設定はユーザー設定より優先される", "D": "値が競合しているためエラーとなりセッションは開始できない"}, "answer": "C", "explanation_ja": "settings の優先順位は（managed を除くと）local > project > user。より具体的なスコープが勝つ。したがって settings.local.json の haiku が適用される。なお permission ルールは上書きではなく『マージ』される点も併せて押さえる。", "source": "https://code.claude.com/docs/en/settings", "pack": "v1"}, {"id": "D5-q002", "statement_id": "D5-1", "scenario": "A long-running agent conversation is approaching the model's context window limit, and the team must keep the session going without losing the thread of the work.", "scenario_ja": "長時間実行されているエージェントの会話がモデルのコンテキストウィンドウの上限に近づいており、チームは作業の流れを失うことなくセッションを継続しなければならない。", "question": "Which technique directly addresses this?", "question_ja": "この問題に直接対処する技法はどれか？", "choices": {"A": "Compaction: summarize earlier context (server-side compaction or harness-level summarization) so the conversation can continue within the window", "B": "Raise max_tokens, which increases the context window", "C": "Delete the system prompt to free space", "D": "Switch stop sequences to shorter strings"}, "choices_ja": {"A": "コンパクション：以前のコンテキストを要約する（サーバーサイドのcompaction、またはハーネスレベルの要約）ことで会話をウィンドウ内で継続できるようにする", "B": "コンテキストウィンドウを増やすmax_tokensを上げる", "C": "スペースを空けるためシステムプロンプトを削除する", "D": "stop sequencesをより短い文字列に切り替える"}, "answer": "A", "explanation_ja": "コンテキスト上限への対処はコンパクション（過去の履歴を要約に置き換える）。API のサーバーサイド compaction、または Claude Code の /compact のようなハーネス側要約がこれにあたる。max_tokens は『出力』の上限でありコンテキストウィンドウは増えない（B は頻出のひっかけ）。C は挙動を壊し、D は無関係。", "source": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "pack": "v1"}, {"id": "D5-q003", "statement_id": "D5-3", "scenario": "In a multi-agent pipeline, a subagent's database tool fails intermittently. The current implementation silently drops failed tool calls, so the orchestrator receives incomplete data without knowing anything went wrong.", "scenario_ja": "あるマルチエージェントパイプラインでは、サブエージェントのデータベースツールが断続的に失敗する。現在の実装は失敗したツール呼び出しを黙って破棄しているため、オーケストレーターは何か問題が起きたことを知らないまま不完全なデータを受け取っている。", "question": "What is the correct error-propagation pattern?", "question_ja": "正しいエラー伝播のパターンは何か？", "choices": {"A": "Return a tool_result with is_error: true and an informative message so the model can adapt, and surface persistent failures to the orchestrator for escalation", "B": "Retry silently forever until the tool succeeds", "C": "Terminate the entire pipeline on any single tool failure", "D": "Have the subagent fabricate plausible data so the pipeline continues smoothly"}, "choices_ja": {"A": "is_error: trueと有用なメッセージを持つtool_resultを返し、モデルが適応できるようにする。継続的な失敗はエスカレーションのためオーケストレーターに表面化させる", "B": "ツールが成功するまで永遠に黙ってリトライする", "C": "1つでもツールが失敗したらパイプライン全体を終了する", "D": "パイプラインが滞りなく続くよう、サブエージェントにもっともらしいデータを捏造させる"}, "answer": "A", "explanation_ja": "エラーは隠さず構造化して伝える：tool_result に is_error: true と有用なメッセージを入れればモデルはリトライや代替手段を選べる。継続的な失敗は上位（オーケストレーター/人間）へエスカレーション。B は停止しない恐れ、C は過剰、D は最悪（サイレントなデータ汚染）。", "source": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls", "pack": "v1"}, {"id": "D5-q004", "statement_id": "D5-5", "scenario": "Your document extraction system reports 97% overall accuracy, so the team plans to remove human review entirely. A closer look shows the 97% figure blends near-perfect performance on invoices with much worse performance on handwritten receipts, which make up a small fraction of volume.", "scenario_ja": "あなたの文書抽出システムは全体で97%の精度を報告しているため、チームは人間によるレビューを完全に廃止しようと計画している。詳しく見ると、この97%という数字は請求書に対するほぼ完璧な性能と、少量ながら手書きの領収書に対するはるかに低い性能を混ぜ合わせたものである。", "question": "What should the team do before reducing human review further?", "question_ja": "チームは人間によるレビューをさらに減らす前に何をすべきか？", "choices": {"A": "Analyze accuracy segmented by document type and field, and use stratified random sampling plus field-level confidence calibration to decide where review is still needed", "B": "Trust the 97% aggregate figure and remove review for all document types immediately", "C": "Remove review only for invoices, since they are the majority of volume, without checking other segments", "D": "Increase the overall sample size used to compute the aggregate accuracy figure"}, "choices_ja": {"A": "文書種別とフィールド別に精度を分析し、層化ランダムサンプリングとフィールド単位の信頼度較正を用いて、どこにまだレビューが必要かを判断する", "B": "97%という集計値を信頼し、すべての文書種別についてただちにレビューを廃止する", "C": "他のセグメントを確認せずに、量が多いという理由だけで請求書についてのみレビューを廃止する", "D": "集計精度を算出するために使うサンプルサイズ全体を増やす"}, "answer": "A", "explanation_ja": "集計精度（97%）は特定セグメント（手書き領収書）の低性能を覆い隠す危険がある。文書種別・フィールド単位での精度分析と層化ランダムサンプリング、信頼度較正によって、どこにレビューが必要かを判断すべき。B は危険、C は他セグメントを未検証のまま放置、D は集計自体の粒度を上げるだけで根本問題（セグメント別分析の欠如）を解決しない。", "source": "materials/official/exam-guide.pdf (Task Statement 5.5)", "pack": "v1"}, {"id": "D5-q005", "statement_id": "D5-6", "scenario": "A multi-agent research system's synthesis agent combines two credible sources that report different statistics for the same metric (e.g., different market size figures), and one source is from three years ago while the other is recent.", "scenario_ja": "あるマルチエージェントのリサーチシステムの統合エージェントは、同じ指標（例：異なる市場規模の数字）について異なる統計を報告する2つの信頼できる情報源を組み合わせている。一方の情報源は3年前のもので、もう一方は最近のものである。", "question": "What is the correct way to handle this in the synthesized report?", "question_ja": "統合されたレポートの中でこれをどう扱うのが正しいか？", "choices": {"A": "Preserve both values with their source attribution and publication dates, and annotate the discrepancy rather than arbitrarily picking one; distinguish well-established findings from contested ones", "B": "Silently use the more recent source's number since it is presumably more accurate", "C": "Average the two statistics to produce a single blended figure", "D": "Omit the metric entirely from the report to avoid presenting conflicting information"}, "choices_ja": {"A": "出典と発行日を付けて両方の値を保持し、恣意的にどちらかを選ぶのではなく食い違いを注記する。十分に確立された知見と議論の余地がある知見を区別する", "B": "おそらくより正確であろうという理由で、より新しい情報源の数字を黙って使う", "C": "2つの統計を平均して単一の混合された数値を出す", "D": "矛盾する情報を提示しないよう、その指標をレポートから完全に省く"}, "answer": "A", "explanation_ja": "情報の出所（provenance）を保持することが原則：両方の値を出典・日付付きで残し、矛盾は明示的に注記する。恣意的な一方選択（B）や平均化（C）は情報を歪める。日付情報があれば時系列差を矛盾と誤解することも防げる。D は有用な情報を単に隠すだけ。", "source": "materials/official/exam-guide.pdf (Task Statement 5.6)", "pack": "v1"}, {"id": "OFFICIAL-q001", "statement_id": "D1-4", "scenario": "Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds.", "scenario_ja": "本番データによると、12%のケースであなたのエージェントはget_customerを完全にスキップし、顧客が申告した名前だけを使ってlookup_orderを呼び出しており、時折アカウントの誤認や誤った返金につながっている。", "question": "What change would most effectively address this reliability issue?", "question_ja": "この信頼性の問題に最も効果的に対処する変更は何か？", "choices": {"A": "Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID.", "B": "Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations.", "C": "Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details.", "D": "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type."}, "choices_ja": {"A": "get_customerが検証済みの顧客IDを返すまで、lookup_orderとprocess_refundの呼び出しをブロックするプログラム的な前提条件を追加する", "B": "注文操作の前にget_customerによる顧客確認が必須であることを述べるよう、システムプロンプトを強化する", "C": "顧客が注文の詳細を自発的に伝えた場合でも、エージェントが常に最初にget_customerを呼び出すことを示すfew-shot例を追加する", "D": "各リクエストを分析し、そのリクエストタイプに適したツールのサブセットのみを有効化するルーティング分類器を実装する"}, "answer": "A", "explanation_ja": "重要な業務ロジック（払い戻し前の本人確認など）で特定のツール順序が必須な場合、プログラム的強制は決定的な保証を与えるが、プロンプトベースの方法（B・C）は確率的な遵守しか得られず、金銭的影響がある場面では不十分。D はツールの利用可否の話でありツール『順序』の問題を解決しない。", "source": "materials/official/exam-guide.pdf (Sample Question 1)", "pack": "v1"}, {"id": "OFFICIAL-q002", "statement_id": "D2-1", "scenario": "Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of calling lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats.", "scenario_ja": "本番ログによると、ユーザーが注文について尋ねたとき（例：「注文番号12345を確認して」）、エージェントはlookup_orderではなくget_customerを頻繁に呼び出している。両方のツールとも説明が最小限（「顧客情報を取得する」／「注文詳細を取得する」）であり、似たような識別子形式を受け付ける。", "question": "What's the most effective first step to improve tool selection reliability?", "question_ja": "ツール選択の信頼性を改善する最も効果的な最初のステップは何か？", "choices": {"A": "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples showing order-related queries routing to lookup_order.", "B": "Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools.", "C": "Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns.", "D": "Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query."}, "choices_ja": {"A": "注文関連のクエリがlookup_orderにルーティングされることを示す5〜8個の例を含む、正しいツール選択パターンを示すfew-shot例をシステムプロンプトに追加する", "B": "各ツールの説明を拡張し、扱う入力形式、クエリの例、エッジケース、似たツールとの使い分けの境界を含める", "C": "各ターンの前にユーザー入力を解析し、検出されたキーワードと識別子パターンに基づいて適切なツールを事前選択するルーティング層を実装する", "D": "任意の識別子を受け付け内部でどのバックエンドに問い合わせるかを判断する単一のlookup_entityツールに両方のツールを統合する"}, "answer": "B", "explanation_ja": "ツールの説明文はLLMがツール選択に使う主要な手がかり。説明が最小限だと似たツールを区別できない。B は根本原因に対する低コスト・高レバレッジな修正。A はトークンオーバーヘッドを増やすが根本解決にならず、C は過剰設計でLLMの自然言語理解を迂回、D は有効な設計選択肢だが『最初の一手』としては大掛かりすぎる。", "source": "materials/official/exam-guide.pdf (Sample Question 2)", "pack": "v1"}, {"id": "OFFICIAL-q003", "statement_id": "D5-2", "scenario": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions.", "scenario_ja": "あなたのエージェントは初回対応解決率55%を達成しており、目標の80%を大きく下回っている。ログによると、写真証拠付きの標準的な破損交換のような単純なケースをエスカレーションする一方で、ポリシー例外を必要とする複雑な状況を自律的に処理しようとしている。", "question": "What's the most effective way to improve escalation calibration?", "question_ja": "エスカレーションの較正を改善する最も効果的な方法は何か？", "choices": {"A": "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.", "B": "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.", "C": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.", "D": "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold."}, "choices_ja": {"A": "自律的に解決すべき場合とエスカレーションすべき場合を示すfew-shot例とともに、明示的なエスカレーション基準をシステムプロンプトに追加する", "B": "各応答の前にエージェントに信頼度スコア（1〜10）を自己申告させ、信頼度が閾値を下回った場合は自動的にリクエストを人間にルーティングする", "C": "メインのエージェントが処理を始める前に、どのリクエストがエスカレーションを必要とするかを予測する、過去のチケットで訓練された別の分類器モデルをデプロイする", "D": "顧客の不満レベルを検知する感情分析を実装し、ネガティブな感情が閾値を超えたら自動的にエスカレーションする"}, "answer": "A", "explanation_ja": "明示的なエスカレーション基準とfew-shot例は『判断境界が不明確』という根本原因に直接対処する、段階的に妥当な最初の対応。B はLLMの自己申告信頼度が既に誤って高いため機能しない。C はプロンプト最適化を試す前のオーバーエンジニアリング。D は感情と案件の複雑さは相関しないため見当違い。", "source": "materials/official/exam-guide.pdf (Sample Question 3)", "pack": "v1"}, {"id": "OFFICIAL-q004", "statement_id": "D3-2", "scenario": "You want to create a custom /review slash command that runs your team's standard code review checklist. This command should be available to every developer when they clone or pull the repository.", "scenario_ja": "あなたは、チームの標準的なコードレビューチェックリストを実行するカスタムの/reviewスラッシュコマンドを作成したいと考えている。このコマンドは、開発者がリポジトリをクローンまたはプルしたときに、すべての開発者が利用できるようにする必要がある。", "question": "Where should you create this command file?", "question_ja": "このコマンドファイルはどこに作成すべきか？", "choices": {"A": "In the .claude/commands/ directory in the project repository", "B": "In ~/.claude/commands/ in each developer's home directory", "C": "In the CLAUDE.md file at the project root", "D": "In a .claude/config.json file with a commands array"}, "choices_ja": {"A": "プロジェクトリポジトリ内の.claude/commands/ディレクトリ", "B": "各開発者のホームディレクトリの~/.claude/commands/", "C": "プロジェクトルートのCLAUDE.mdファイル", "D": "commands配列を持つ.claude/config.jsonファイル"}, "answer": "A", "explanation_ja": "プロジェクトスコープのカスタムスラッシュコマンドは .claude/commands/ に置く。バージョン管理され、clone/pull した全開発者に自動的に共有される。B はバージョン管理外の個人用コマンド。C は指示・文脈用でコマンド定義用ではない。D はClaude Codeに存在しない仕組み。", "source": "materials/official/exam-guide.pdf (Sample Question 4)", "pack": "v1"}, {"id": "OFFICIAL-q005", "statement_id": "D3-4", "scenario": "You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies.", "scenario_ja": "あなたはチームのモノリシックなアプリケーションをマイクロサービスに再構成する任務を割り当てられた。これは数十のファイルにわたる変更を伴い、サービス境界とモジュールの依存関係についての判断を必要とする。", "question": "Which approach should you take?", "question_ja": "どのアプローチを取るべきか？", "choices": {"A": "Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.", "B": "Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries.", "C": "Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured.", "D": "Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation."}, "choices_ja": {"A": "変更を加える前に、コードベースを探索し依存関係を理解し実装アプローチを設計するため、plan modeに入る", "B": "直接実行から始め、段階的に変更を加え、実装が自然なサービス境界を明らかにするに任せる", "C": "各サービスをどう構造化すべきかを詳細に示す包括的な事前指示を伴う直接実行を使う", "D": "直接実行モードで始め、実装中に予期しない複雑さに遭遇した場合にのみplan modeに切り替える"}, "answer": "A", "explanation_ja": "plan mode は大規模な変更・複数の妥当なアプローチ・アーキテクチャ判断が伴うタスクに向いており、変更を確定する前に安全な探索と設計を可能にする——モノリスからマイクロサービスへの再構成はまさにその典型。B は依存関係を後から発見してコストのかかる手戻りを招くリスク、C は正しい構造を探索せずに前提してしまっている、D は要件自体が既に複雑であることを無視している。", "source": "materials/official/exam-guide.pdf (Sample Question 5)", "pack": "v1"}, {"id": "OFFICIAL-q006", "statement_id": "D3-3", "scenario": "Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location.", "scenario_ja": "あなたのコードベースには異なるコーディング規約を持つ明確な領域がある：Reactコンポーネントはフックを使った関数型スタイル、APIハンドラーは特定のエラー処理を伴うasync/await、データベースモデルはリポジトリパターンに従う。テストファイルはテスト対象のコードのそばにコードベース全体に散らばっており（例：Button.test.tsxはButton.tsxの隣）、場所に関わらずすべてのテストが同じ規約に従ってほしいと考えている。", "question": "What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?", "question_ja": "Claudeがコード生成時に正しい規約を自動的に適用することを保証する最も保守しやすい方法は何か？", "choices": {"A": "Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths", "B": "Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies", "C": "Create skills in .claude/skills/ for each code type that include the relevant conventions in their SKILL.md files", "D": "Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions"}, "choices_ja": {"A": "ファイルパスに基づいて規約を条件付きで適用するグロブパターンを指定したYAMLフロントマターを持つルールファイルを.claude/rules/に作成する", "B": "各領域のヘッダーの下にすべての規約をルートのCLAUDE.mdファイルに統合し、どのセクションが適用されるかはClaudeの推論に任せる", "C": "関連する規約をSKILL.mdファイルに含む、各コードタイプ用のskillを.claude/skills/に作成する", "D": "各サブディレクトリに、その領域固有の規約を含む別々のCLAUDE.mdファイルを配置する"}, "answer": "A", "explanation_ja": ".claude/rules/ のグロブパターン（例: **/*.test.tsx）はファイルパスに基づき規約を自動適用でき、ディレクトリ横断的に散らばるテストファイルに必須。B は推論任せで信頼性が低い、C は手動起動またはClaude任せの読み込みになり『自動適用』という要件に反する、D はディレクトリに紐づくためファイルが多方向に散らばるケースに対応しづらい。", "source": "materials/official/exam-guide.pdf (Sample Question 6)", "pack": "v1"}, {"id": "OFFICIAL-q007", "statement_id": "D1-2", "scenario": "After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\"", "scenario_ja": "「AIがクリエイティブ産業に与える影響」というトピックでシステムを実行した後、各サブエージェントは正常に完了していることが分かった：Web検索エージェントは関連記事を見つけ、文書分析エージェントは論文を正しく要約し、統合エージェントは首尾一貫した出力を生成した。しかし最終レポートは視覚芸術のみを扱っており、音楽・執筆・映画制作を完全に見落としている。コーディネーターのログを調べると、トピックを「デジタルアートにおけるAI」「グラフィックデザインにおけるAI」「写真におけるAI」という3つのサブタスクに分解していたことが分かった。", "question": "What is the most likely root cause?", "question_ja": "最も可能性の高い根本原因は何か？", "choices": {"A": "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.", "B": "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.", "C": "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.", "D": "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria."}, "choices_ja": {"A": "統合エージェントには、他のエージェントから受け取った所見の中でカバレッジのギャップを特定するための指示が欠けている", "B": "コーディネーターエージェントのタスク分解が狭すぎるため、トピックの関連するすべての領域をカバーしていないサブエージェントの割り当てになっている", "C": "Web検索エージェントのクエリが十分に包括的でなく、より多くのクリエイティブ産業のセクターをカバーするよう拡張する必要がある", "D": "文書分析エージェントは過度に制限的な関連性基準により、視覚芸術以外のクリエイティブ産業に関連する情報源をフィルタリングして除外している"}, "answer": "B", "explanation_ja": "コーディネーターのログが根本原因を直接示している：『creative industries』を視覚芸術のサブタスクのみに分解し、音楽・執筆・映画を完全に見落としている。サブエージェントは割り当てられたタスクを正しく実行しており、問題は『何を割り当てたか』にある。A・C・D は正しく動作している下流エージェントを誤って責めている。", "source": "materials/official/exam-guide.pdf (Sample Question 7)", "pack": "v1"}, {"id": "OFFICIAL-q008", "statement_id": "D5-3", "scenario": "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent.", "scenario_ja": "Web検索サブエージェントが複雑なトピックを調査中にタイムアウトした。あなたはこの失敗情報がどのようにコーディネーターエージェントに伝わるべきかを設計する必要がある。", "question": "Which error propagation approach best enables intelligent recovery?", "question_ja": "賢明な復旧を最も可能にするエラー伝播のアプローチはどれか？", "choices": {"A": "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.", "B": "Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted.", "C": "Catch the timeout within the subagent and return an empty result set marked as successful.", "D": "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow."}, "choices_ja": {"A": "失敗の種類、試みたクエリ、部分的な結果、潜在的な代替アプローチを含む構造化されたエラーコンテキストをコーディネーターに返す", "B": "サブエージェント内で指数バックオフによる自動リトライロジックを実装し、すべてのリトライが尽きた後にのみ一般的な「検索利用不可」ステータスを返す", "C": "サブエージェント内でタイムアウトを捕捉し、成功としてマークされた空の結果セットを返す", "D": "タイムアウト例外を、リサーチワークフロー全体を終了させるトップレベルのハンドラーに直接伝播させる"}, "answer": "A", "explanation_ja": "構造化エラーコンテキストは、コーディネーターが賢い復旧判断（クエリを変えて再試行するか、代替手法を試すか、部分結果で進めるか）を下すために必要な情報を与える。B の画一的ステータスは有用な文脈を隠す、C は失敗を成功として隠蔽し復旧の機会を失わせる、D は復旧できる可能性があるのに不必要にワークフロー全体を止めてしまう。", "source": "materials/official/exam-guide.pdf (Sample Question 8)", "pack": "v1"}, {"id": "OFFICIAL-q009", "statement_id": "D2-3", "scenario": "During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation.", "scenario_ja": "テスト中、統合エージェントは所見を組み合わせる際に特定の主張を検証する必要が頻繁にあることが分かった。現在、検証が必要な場合、統合エージェントは制御をコーディネーターに戻し、コーディネーターがWeb検索エージェントを呼び出し、その後結果とともに統合エージェントを再度呼び出している。これはタスクごとに2〜3回の往復を追加し、レイテンシを40%増加させている。評価によると、これらの検証の85%は単純なファクトチェック（日付、名前、統計）であり、15%はより深い調査を必要とする。", "question": "What's the most effective approach to reduce overhead while maintaining system reliability?", "question_ja": "システムの信頼性を維持しながらオーバーヘッドを削減する最も効果的なアプローチは何か？", "choices": {"A": "Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.", "B": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.", "C": "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.", "D": "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify."}, "choices_ja": {"A": "単純な検索用にスコープを絞ったverify_factツールを統合エージェントに与え、複雑な検証は引き続きコーディネーターを介してWeb検索エージェントに委譲する", "B": "統合エージェントにすべての検証ニーズを蓄積させ、パスの最後にまとめてコーディネーターに返し、コーディネーターがそれらすべてを一度にWeb検索エージェントに送る", "C": "統合エージェントにすべてのWeb検索ツールへのアクセスを与え、コーディネーターを介した往復なしにあらゆる検証ニーズを直接処理できるようにする", "D": "統合エージェントが後で何を検証したくなるかを予測して、Web検索エージェントに初期リサーチ中に各情報源の周辺の追加コンテキストを事前にキャッシュさせる"}, "answer": "A", "explanation_ja": "最小権限の原則を適用し、85%を占める単純なケース（簡易ファクトチェック）に必要な最小限のツールのみを合成エージェントに与えつつ、複雑なケースは既存の調整パターンを維持する。B のバッチ化は合成の各ステップが先に検証した事実に依存する場合ブロッキングを生む、C は関心の分離に反する過剰な権限付与、D は合成エージェントが何を検証したいか予測できない投機的キャッシュ。", "source": "materials/official/exam-guide.pdf (Sample Question 9)", "pack": "v1"}, {"id": "OFFICIAL-q010", "statement_id": "D3-6", "scenario": "Your pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input.", "scenario_ja": "あなたのパイプラインスクリプトはclaude \"Analyze this pull request for security issues\"を実行するが、ジョブが無期限にハングする。ログはClaude Codeが対話的な入力を待っていることを示している。", "question": "What's the correct approach to run Claude Code in an automated pipeline?", "question_ja": "自動化されたパイプラインでClaude Codeを実行する正しい方法は何か？", "choices": {"A": "Add the -p flag: claude -p \"Analyze this pull request for security issues\"", "B": "Set the environment variable CLAUDE_HEADLESS=true before running the command", "C": "Redirect stdin from /dev/null: claude \"Analyze this pull request for security issues\" < /dev/null", "D": "Add the --batch flag: claude --batch \"Analyze this pull request for security issues\""}, "choices_ja": {"A": "-pフラグを追加する：claude -p \"Analyze this pull request for security issues\"", "B": "コマンドを実行する前に環境変数CLAUDE_HEADLESS=trueを設定する", "C": "標準入力を/dev/nullからリダイレクトする：claude \"Analyze this pull request for security issues\" < /dev/null", "D": "--batchフラグを追加する：claude --batch \"Analyze this pull request for security issues\""}, "answer": "A", "explanation_ja": "-p（または--print）フラグはClaude Codeを非対話モードで実行する正規の方法。プロンプトを処理してstdoutに結果を出力し、ユーザー入力を待たずに終了する——CI/CDパイプラインが必要とする挙動そのもの。他の選択肢は存在しない機能（CLAUDE_HEADLESS環境変数、--batchフラグ）や、Claude Codeのコマンド構文に正しく対処しないUnix的回避策を参照している。", "source": "materials/official/exam-guide.pdf (Sample Question 10)", "pack": "v1"}, {"id": "OFFICIAL-q011", "statement_id": "D4-5", "scenario": "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings.", "scenario_ja": "あなたのチームは自動分析のAPIコストを削減したいと考えている。現在、リアルタイムのClaude呼び出しが2つのワークフローを動かしている：(1) 開発者がマージする前に完了しなければならないブロッキング型のpre-mergeチェック、(2) 翌朝レビューするための夜間生成される技術的負債レポート。あなたのマネージャーは、50%のコスト削減のため両方をMessage Batches APIに切り替えることを提案している。", "question": "How should you evaluate this proposal?", "question_ja": "この提案をどう評価すべきか？", "choices": {"A": "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", "B": "Switch both workflows to batch processing with status polling to check for completion.", "C": "Keep real-time calls for both workflows to avoid batch result ordering issues.", "D": "Switch both to batch processing with a timeout fallback to real-time if batches take too long."}, "choices_ja": {"A": "技術的負債レポートのみバッチ処理を使い、pre-mergeチェックはリアルタイム呼び出しのままにする", "B": "両方のワークフローを、完了確認のためのステータスポーリングを伴うバッチ処理に切り替える", "C": "バッチ結果の順序の問題を避けるため、両方ともリアルタイム呼び出しのままにする", "D": "バッチが時間がかかりすぎる場合にリアルタイムへフォールバックするタイムアウトを伴い、両方をバッチ処理に切り替える"}, "answer": "A", "explanation_ja": "Message Batches APIは50%のコスト削減を提供するが、処理時間は最大24時間でレイテンシSLAの保証がない。これは開発者が結果を待つブロッキングなpre-mergeチェックには不向きだが、夜間の技術的負債レポートのようなジョブには最適。B は『しばしば速い』ことに依存しブロッキングワークフローには受け入れがたい。C は誤解（バッチ結果はcustom_idで相関できる）に基づく。D はシンプルな解（各APIを適切な用途に合わせる）で足りるのに不要な複雑さを加えている。", "source": "materials/official/exam-guide.pdf (Sample Question 11)", "pack": "v1"}, {"id": "OFFICIAL-q012", "statement_id": "D4-6", "scenario": "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR.", "scenario_ja": "あるプルリクエストが在庫追跡モジュール内の14個のファイルを変更している。すべてのファイルを一緒に分析する単一パスのレビューは、一貫性のない結果を生んでいる：一部のファイルには詳細なフィードバックがある一方で他は表面的なコメントにとどまり、明白なバグが見落とされ、矛盾したフィードバックも生じている——同じPR内の同一のコードを、あるファイルでは問題ありとフラグしながら別の場所では承認している。", "question": "How should you restructure the review?", "question_ja": "レビューをどう再構成すべきか？", "choices": {"A": "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.", "B": "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.", "C": "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", "D": "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs."}, "choices_ja": {"A": "焦点を絞ったパスに分割する：各ファイルを個別にローカルな問題について分析し、その後ファイル横断のデータフローを調べる別の統合フォーカスのパスを実行する", "B": "自動レビューが実行される前に、開発者に大きなPRを3〜4ファイルずつの小さな提出に分割することを求める", "C": "14個のファイルすべてに1回のパスで十分な注意を払えるよう、より大きなコンテキストウィンドウを持つ上位モデルに切り替える", "D": "PR全体に対して3回の独立したレビューパスを実行し、3回のうち少なくとも2回で現れた問題のみをフラグする"}, "answer": "A", "explanation_ja": "フォーカスを絞ったパスへの分割は根本原因（多数のファイルを一度に処理することによる注意の希釈）に直接対処する。ファイル単位の分析は一貫した深さを保証し、別途の統合パスがファイル横断の問題を捕捉する。B は開発者に負担を移すだけでシステム自体は改善しない、C はコンテキストウィンドウの拡大が注意の質の問題を解決しないという誤解、D は断続的にしか検出されない実際のバグをコンセンサス要求によってかえって見逃す可能性がある。", "source": "materials/official/exam-guide.pdf (Sample Question 12)", "pack": "v1"}];

const POS = ["A","B","C","D"];
function orderFor(q) {
  if (!q.__order) {
    const keys = POS.slice();
    for (let i = keys.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [keys[i], keys[j]] = [keys[j], keys[i]];

  }
  return q.__order;
}
function shownLetter(q) { return POS[orderFor(q).indexOf(q.answer)]; }

  const code = "QR|" + today + "|quiz-artifact|" + results.map(r => r.id + ":" + (r.correct ? "o" : "x")).join(",");
  $("qrcode").textContent = code;
  if (FORM_BASE && FORM_ENTRY) {
    const sep = FORM_BASE.includes("?") ? "&" : "?";
    $("formbtn").href = FORM_BASE + sep + FORM_ENTRY + "=" + encodeURIComponent(code);
    $("formbtn").classList.remove("hidden");
  }
  $("copybtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code); $("copybtn").textContent = "コピーしました ✓"; }
    catch { const sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents($("qrcode")); sel.removeAllRanges(); sel.addRange(rg);
      $("copybtn").textContent = "選択しました — 長押しでコピー"; }
  });
  $("final").classList.remove("hidden");
}
render();
</script>
</body>
</html>
