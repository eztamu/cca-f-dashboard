 request, letting the coordinator invent a plan from scratch each time and stop when it judges coverage sufficient.", "D": "Keep the fixed four-stage chain for every request and cut cost by lowering the reasoning effort and assigning a smaller model to each of the four subagents."}, "choices_ja": {"A": "コーディネーターにまずリクエストを分類させ、狭い照会には短い固定チェーンを、広いテーマには中間発見に応じて再委譲する適応的な計画を用いる。", "B": "全リクエストで4段の固定チェーンを維持しつつ、検索・分析・統合の各段を並行実行し、合計時間を最も遅い段の時間に等しくする。", "C": "固定チェーンを廃し、全リクエストを完全な動的分解にして、コーディネーターが毎回ゼロから計画を立て、カバレッジが十分と判断した時点で停止させる。", "D": "全リクエストで4段の固定チェーンを維持し、4つのサブエージェントそれぞれの reasoning effort を下げ、より小さいモデルを割り当ててコストを削る。"}, "answer": "A", "explanation_ja": "コーディネーターの役割はタスク分解・委譲・集約に加え、クエリの複雑さに応じてどのサブエージェントを呼ぶかを動的に選ぶことであり、常にフルパイプラインを通す必要はない。70%の狭い照会で不要な段を省けばレイテンシと単価は大きく下がり、広いテーマだけ適応的分解で深さを保てるため、要求された制約を両立できる。Bは検索→分析→統合が前段の出力に依存する逐次関係であり並行化できない（依存のない作業でこそ並列化は効く）。Cは狭い照会にまで計画立案のオーバーヘッドを課し、実行ごとの停止判断もぶれるため、コスト削減にも品質安定にもつながらない。Dは1リクエストあたりの単価をいくらか下げるが、不要な段を通す構造は変わらずレイテンシ半減には届かず、広いテーマの深さを最も落としやすい選択である。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q032", "statement_id": "D1-2", "angle": "design-choice", "scenario_ref": 3, "scenario": "A multi-agent research system uses a coordinator that delegates to a web-search subagent, a document-analysis subagent, a synthesis subagent, and a report generator. For broad topics the coordinator currently sends every search subagent invocation the same instruction, \"research this topic thoroughly,\" and runs several of them in parallel. Reviewers report that the parallel runs return heavily overlapping sources while whole sub-areas of the topic are never covered.", "scenario_ja": "あるマルチエージェント研究システムでは、コーディネーターがWeb検索サブエージェント、文書分析サブエージェント、統合サブエージェント、レポート生成サブエージェントに委譲している。広範なトピックの場合、コーディネーターは現在すべての検索サブエージェント呼び出しに「このトピックを徹底的に調査せよ」という同じ指示を送り、それらを複数並列で実行している。レビュアーからは、並列実行が大きく重複したソースを返す一方で、トピックのいくつかの下位領域がまったくカバーされないと報告されている。", "question": "How should the coordinator delegate work to the parallel search subagents to improve coverage of broad topics?", "question_ja": "広範なトピックのカバレッジを高めるために、コーディネーターは並列の検索サブエージェントへどのように作業を委譲すべきか。", "choices": {"A": "Run the search subagents sequentially and pass each one the previous subagent's final message so it can avoid sources that were already retrieved.", "B": "Have the coordinator partition the topic first and give each search subagent a distinct subtopic or source type in its Agent tool prompt.", "C": "Give every search subagent a larger model and a higher maxTurns so each one can independently cover the entire topic on its own.", "D": "Replace the parallel search subagents with one search subagent that inherits the coordinator's full conversation history and tool results."}, "choices_ja": {"A": "検索サブエージェントを逐次実行し、各サブエージェントに直前のサブエージェントの最終メッセージを渡して、既に取得済みのソースを避けさせる。", "B": "コーディネーターがまずトピックを分割し、各検索サブエージェントの Agent ツールのプロンプトで別々の下位トピックまたはソース種別を割り当てる。", "C": "すべての検索サブエージェントにより大きなモデルと高い maxTurns を与え、各自が単独でトピック全体をカバーできるようにする。", "D": "並列の検索サブエージェントを、コーディネーターの会話履歴とツール結果をすべて継承する1つの検索サブエージェントに置き換える。"}, "answer": "B", "explanation_ja": "B が正解。サブエージェントは独立したコンテキストで動き、親からの唯一の伝達経路は Agent ツールのプロンプト文字列である。したがって重複を避ける唯一の実用的手段は、コーディネーターが委譲時点でスコープを分割し、各サブエージェントに別個の下位トピック／ソース種別を明示的に渡すこと。公式 Exam Guide も「重複を最小化するようスコープを分割する（各エージェントに異なる下位トピックやソース種別を割り当てる）」を明記している。A は誤り: 逐次化すると並列実行の利点（最も遅い1つの時間で終わる）を失ううえ、前のエージェントの最終メッセージだけでは網羅漏れは解消せず、単に遅くなる。C は誤り: モデルや maxTurns を上げても各エージェントは同じ広い指示から似た経路をたどるため重複は残り、コストだけ増える。D は誤り: サブエージェントは親の会話履歴やツール結果を自動継承しないため前提が成立せず、単一エージェント化すると中間結果が親コンテキストに積み上がりコンテキスト分離の利点も失う。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q033", "statement_id": "D1-2", "angle": "troubleshoot", "scenario_ref": 3, "scenario": "In the same research system, the document-analysis subagent reads dozens of PDFs and quotes exact page-level citations in its intermediate tool results, then ends with a short summary of its conclusions. The coordinator then invokes the report-generation subagent to write the final report. The finished reports state the right conclusions but attach vague or invented citations, even though the document-analysis subagent clearly had the correct ones.", "scenario_ja": "同じ研究システムにおいて、文書分析サブエージェントは数十本のPDFを読み、中間のツール結果の中でページ単位の正確な引用を提示し、最後に結論を短く要約して終了する。次にコーディネーターがレポート生成サブエージェントを呼び出して最終レポートを書かせる。完成したレポートは結論自体は正しいが、文書分析サブエージェントが正確な引用を持っていたにもかかわらず、曖昧または捏造された引用が付いている。", "question": "What explains the loss of the exact citations between the two subagents?", "question_ja": "2つのサブエージェント間で正確な引用が失われるのはなぜか。", "choices": {"A": "Subagent transcripts are discarded when the coordinator's conversation is compacted, so the citation tool results are deleted before the report step runs.", "B": "The report-generation subagent inherits the coordinator's system prompt but not its tool definitions, so it cannot re-read the cited PDFs itself.", "C": "Only the document-analysis subagent's final message returns to the coordinator, and the coordinator passes forward just what it puts in the next Agent tool prompt.", "D": "Parallel subagents share one context window, so the report subagent's output overwrote the citation blocks produced by the document-analysis subagent."}, "choices_ja": {"A": "コーディネーターの会話がコンパクションされるとサブエージェントのトランスクリプトは破棄されるため、レポート工程の実行前に引用のツール結果が削除されている。", "B": "レポート生成サブエージェントはコーディネーターのシステムプロンプトは継承するがツール定義は継承しないため、引用元PDFを自分で読み直せない。", "C": "文書分析サブエージェントは最終メッセージだけがコーディネーターに返り、コーディネーターは次の Agent ツールのプロンプトに書いた分しか先へ渡さない。", "D": "並列のサブエージェントは1つのコンテキストウィンドウを共有するため、レポートサブエージェントの出力が文書分析サブエージェントの引用ブロックを上書きした。"}, "answer": "C", "explanation_ja": "C が正解。ハブ&スポーク構成ではサブエージェント同士は直接通信せず、中間のツール呼び出しと結果はサブエージェント内部に留まり、親に返るのは最終メッセージだけである。したがって正確な引用が最終メッセージに含まれないか、コーディネーターが次の Agent ツールのプロンプトに引用を明示的に載せない限り、レポート生成側には届かない。A は誤り: 公式ドキュメントはサブエージェントのトランスクリプトが別ファイルに保存され、メイン会話のコンパクションの影響を受けないと明記している。B は誤り: 継承関係が逆で、サブエージェントは親のツール定義（または tools で絞った部分集合）を受け取る一方、親のシステムプロンプトは受け取らない。D は誤り: 各サブエージェントは自分の新しいコンテキストウィンドウで動作し、コンテキストを共有・上書きすることはない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q034", "statement_id": "D1-2", "angle": "find-error", "scenario_ref": 5, "scenario": "A CI pipeline runs a coordinator agent on every pull request via the Agent SDK. The coordinator is supposed to dispatch three specialized review subagents (style, security, test-coverage) and aggregate their findings into one comment. It is configured with `agents: { \"style-checker\": {...}, \"security-scanner\": {...}, \"test-coverage\": {...} }`, `allowedTools: [\"Read\", \"Grep\", \"Glob\"]`, and a non-interactive permission mode that denies anything not pre-approved. In CI the coordinator reviews the diff itself and never dispatches a subagent.", "scenario_ja": "あるCIパイプラインは、プルリクエストごとに Agent SDK 経由でコーディネーターエージェントを実行している。コーディネーターは3つの専門レビューサブエージェント（style、security、test-coverage）に振り分け、その結果を1つのコメントに集約するはずである。設定は `agents: { \"style-checker\": {...}, \"security-scanner\": {...}, \"test-coverage\": {...} }`、`allowedTools: [\"Read\", \"Grep\", \"Glob\"]`、および事前承認されていないものを拒否する非対話的なパーミッションモードである。CI ではコーディネーターが自分で差分をレビューしてしまい、サブエージェントを一度も起動しない。", "question": "What is the defect in this coordinator configuration?", "question_ja": "このコーディネーター設定の欠陥はどれか。", "choices": {"A": "`allowedTools` omits `Agent`, so subagent invocations are not pre-approved and are denied in a non-interactive permission mode.", "B": "The three subagents are defined programmatically, and programmatic definitions are ignored in CI unless the same agents exist under `.claude/agents/`.", "C": "The subagents each need `initialPrompt` set, because without it a subagent invoked through the Agent tool receives no first user turn.", "D": "The coordinator lacks `Bash` in `allowedTools`, and dispatching a subagent requires spawning it as a separate process through a shell command."}, "choices_ja": {"A": "`allowedTools` に `Agent` が抜けているため、サブエージェント呼び出しが事前承認されず、非対話的なパーミッションモードでは拒否される。", "B": "3つのサブエージェントがプログラム的に定義されており、プログラム的定義は同名のエージェントが `.claude/agents/` に存在しない限り CI では無視される。", "C": "各サブエージェントに `initialPrompt` の設定が必要で、それが無いと Agent ツール経由で呼ばれたサブエージェントは最初のユーザーターンを受け取れない。", "D": "コーディネーターの `allowedTools` に `Bash` が無く、サブエージェントの起動にはシェルコマンドで別プロセスとして生成する必要がある。"}, "answer": "A", "explanation_ja": "A が正解。Claude はサブエージェントを Agent ツール経由で呼び出すため、`allowedTools` に `Agent` を含めないと呼び出しは自動承認されず、`canUseTool` コールバックに回るか、`dontAsk` のような非対話モードでは拒否される。その結果 Claude は委譲を諦めて自分で作業してしまう——公式ドキュメントのトラブルシューティング「Claude not delegating to subagents」の筆頭原因そのものである。B は誤り: 優先順位は逆で、`query()` に渡したプログラム的定義が同名のファイルシステム定義を上書きする。C は誤り: `initialPrompt` はそのエージェントがメインスレッドのエージェントとして動く場合のみ有効で、サブエージェントとして呼ばれたときは無視される。サブエージェントへの入力は Agent ツールのプロンプト文字列である。D は誤り: サブエージェントは SDK が Agent ツールで起動するものであり、`Bash` によるプロセス生成は不要（`Bash` を与えるとレビュー用途に不必要な実行権限を渡すことにもなる）。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q035", "statement_id": "D1-3", "angle": "find-error", "scenario_ref": 3, "scenario": "In a multi-agent research system, the coordinator invokes a custom document-analyst subagent to read a large filing set, and the Agent tool result comes back containing 'agentId: agt-4821'. The team wants a follow-up turn that reuses everything the analyst already read, so their code stores that agentId, then makes a second, separate query() call whose options pass the same agents map and allowedTools as the first call, with the prompt 'Resume agent agt-4821 and rank the three riskiest clauses'. In production the second call always behaves as if the analyst had never run, re-reading every file from scratch.", "scenario_ja": "マルチエージェント調査システムで、コーディネーターがカスタムの document-analyst サブエージェントを起動して大量の提出書類を読ませたところ、Agent ツールの結果に 'agentId: agt-4821' が含まれて返ってきた。チームは、そのアナリストが既に読んだ内容をすべて再利用するフォローアップのターンを行いたいので、コードでその agentId を保存し、次に別個の query() 呼び出しを行っている。その options には1回目と同じ agents マップと allowedTools を渡し、プロンプトは「Resume agent agt-4821 and rank the three riskiest clauses」としている。しかし本番では、2回目の呼び出しは常にアナリストが一度も動かなかったかのように振る舞い、すべてのファイルを最初から読み直してしまう。", "question": "What is wrong with this resume implementation?", "question_ja": "この再開（resume）の実装のどこが誤っているか。", "choices": {"A": "The agentId must be passed as a dedicated option field rather than mentioned in the prompt text, so the runtime silently ignores the instruction.", "B": "Custom subagents cannot be resumed at all; only the built-in Explore and Plan agents return a reusable identifier for later turns.", "C": "The second query() starts a new session by default, so it must pass resume with the first call's session_id to reach the subagent transcript.", "D": "The agents map must be omitted on the second call, because re-declaring the definition overwrites the stored transcript of the running subagent."}, "choices_ja": {"A": "agentId はプロンプト本文で言及するのではなく専用のオプションフィールドとして渡さなければならず、そのためランタイムがこの指示を黙って無視している。", "B": "カスタムサブエージェントはそもそも再開できない。後続ターンで再利用できる識別子を返すのは組み込みの Explore と Plan エージェントだけである。", "C": "2回目の query() は既定で新しいセッションを開始するため、サブエージェントのトランスクリプトに到達するには1回目の session_id を resume に渡す必要がある。", "D": "2回目の呼び出しでは agents マップを省略しなければならない。定義を再宣言すると、実行中のサブエージェントの保存済みトランスクリプトが上書きされてしまうため。"}, "answer": "C", "explanation_ja": "公式ドキュメントの Resume subagents は、(1) session_id を取得、(2) Agent ツール結果から agentId を抽出、(3) 2回目のクエリの options に resume: sessionId を渡し、プロンプトに agent ID を含める、という3段階を明示している。さらに「サブエージェントのトランスクリプトにアクセスするには同じセッションを再開しなければならない。query() 呼び出しは既定で毎回新しいセッションを開始する」と注記されている。本ケースは resume を渡していないため新規セッションとなり、過去のトランスクリプトが存在せず最初からやり直しになる。C が正しい。\nA は誤り。ドキュメントの手順どおり agent ID は「プロンプトに含める」形で指定するのが正しく（例: 'Resume agent {agent_id} and ...'）、専用オプションではない。欠けているのは resume の方である。\nB は誤り。再開できないのは one-shot で agentId を返さない組み込みの Explore / Plan であり、再開したい場合はカスタムエージェントか general-purpose を使えとドキュメントは述べている。つまり本ケースのカスタムエージェントは再開可能である。\nD は誤り。ドキュメントは逆に「カスタムエージェントを使う場合は両方のクエリで同じエージェント定義を agents パラメータに渡すこと」と明記している。agents の再指定は必須であって原因ではない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q036", "statement_id": "D1-3", "angle": "tradeoff", "scenario_ref": 2, "scenario": "A Claude Code session has spent a long, expensive run mapping a legacy billing module: dozens of files read, the data model reconstructed, and a migration risk list produced. The team now wants to evaluate two incompatible refactors, an event-sourced rewrite and an in-place strangler pattern, and they need both explorations to start from that same analysis while remaining independently resumable later, without paying to rebuild the analysis for the second direction.", "scenario_ja": "ある Claude Code のセッションが、長時間かつコストのかかる実行でレガシーな課金モジュールを解析し終えた。数十ファイルを読み、データモデルを再構築し、移行リスク一覧を出力している。チームは今、互換性のない2つのリファクタ案（イベントソーシングによる書き直しと、その場での strangler パターン）を評価したい。両方の検討をその同じ解析から開始でき、かつ後からそれぞれ独立に再開でき、しかも2つ目の方向のために解析をやり直す費用を払わずに済ませたい。", "question": "Which session strategy best satisfies these constraints?", "question_ja": "これらの制約を最もよく満たすセッション戦略はどれか。", "choices": {"A": "Run each refactor exploration as a fresh query() with continue: true, letting the SDK attach both of them to the most recent session in the directory.", "B": "Resume the analysis session with fork_session enabled for one refactor, and resume the original session directly for the other refactor.", "C": "Spawn two subagents from the analysis session in one response, giving each a short prompt that names the refactor direction to evaluate.", "D": "Re-run the mapping prompt twice with persistSession disabled, then append a different refactor question to each in-memory run."}, "choices_ja": {"A": "各リファクタ検討を continue: true を付けた新しい query() として実行し、ディレクトリ内の最新セッションに両方を SDK が接続するのに任せる。", "B": "一方のリファクタについては fork_session を有効にして解析セッションを再開し、もう一方については元のセッションをそのまま再開する。", "C": "解析セッションから1回の応答で2つのサブエージェントを起動し、それぞれに評価対象のリファクタ方針を示す短いプロンプトを与える。", "D": "persistSession を無効にしてマッピングのプロンプトを2回実行し直し、それぞれのインメモリ実行に異なるリファクタの質問を追加する。"}, "answer": "B", "explanation_ja": "ドキュメントの Choose an approach 表は「元を失わずに別案を試す」場合に fork を挙げ、Fork to explore alternatives の例がまさにこの形（resume=session_id + fork_session=True で一方を分岐させ、もう一方は元の session_id を resume で継続）を示す。フォークは元の履歴のコピーから始まり独自の session ID を持ち、元セッションは変更されないので、2つの独立して再開可能な履歴が解析コストの再支払いなしに得られる。B が最適。\nA は誤り。continue は「カレントディレクトリの最新セッション」を拾うだけなので、2つの検討が同じ1本の履歴に直列に積み上がり、互いの検討内容が混ざる。分岐にはならず、独立した2本の再開可能な履歴も得られない。\nC は誤り。サブエージェントのコンテキストは新規で、親の会話履歴やツール結果を受け取らない。親からの唯一の経路は Agent ツールの prompt 文字列なので、「短いプロンプト」だけでは数十ファイル分の解析結果が渡らず、各サブエージェントが解析をやり直すことになる。\nD は誤り。マッピングを2回実行すること自体が「解析を作り直さない」という制約に反して高コストであり、さらに persistSession: false はディスクに何も残さないため、後から独立に再開するという要件も満たせない。", "source": "https://code.claude.com/docs/en/agent-sdk/sessions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q037", "statement_id": "D1-3", "angle": "design-choice", "scenario_ref": 1, "scenario": "A customer support agent exposes an MCP server named support with the tools get_customer, lookup_order, process_refund, and escalate_to_human. The team is adding a refund-policy-audit subagent that reviews past tickets for policy compliance. Compliance requires that this auditor can never issue a refund or page a human, while it should keep automatic access to every current and future read-only tool on the same MCP server so audits do not break each time a tool is added.", "scenario_ja": "あるカスタマーサポートエージェントは、support という名前の MCP サーバーで get_customer、lookup_order、process_refund、escalate_to_human の各ツールを公開している。チームは今、過去のチケットをポリシー遵守の観点でレビューする refund-policy-audit サブエージェントを追加しようとしている。コンプライアンス上、この監査役は決して返金を実行したり人間を呼び出したりしてはならない一方で、同じ MCP サーバー上の現在および将来の読み取り専用ツールには自動的にアクセスできる状態を保ち、ツールが追加されるたびに監査が壊れないようにする必要がある。", "question": "How should the auditor's AgentDefinition be configured to meet both requirements?", "question_ja": "この監査役の AgentDefinition は、両方の要件を満たすためにどう設定すべきか。", "choices": {"A": "Set tools to the two read-only MCP tool names, and document in the agent prompt that new read tools must be appended to that list as they ship.", "B": "Omit both tools and disallowedTools, and state in the agent's system prompt that it must never call process_refund or escalate_to_human under any circumstance.", "C": "Leave the agent definition permissive and instead remove the two write tools from the parent query's allowedTools so no agent in the run can invoke them.", "D": "Omit tools so the agent inherits everything, and set disallowedTools to the two write tool names to subtract them from the inherited set."}, "choices_ja": {"A": "tools に読み取り専用の MCP ツール2つの名前を設定し、新しい読み取りツールが出るたびにそのリストへ追加すること、とエージェントのプロンプトに明記しておく。", "B": "tools も disallowedTools も指定せず、エージェントのシステムプロンプトに、いかなる場合も process_refund と escalate_to_human を呼んではならないと記述する。", "C": "エージェント定義は緩いままにし、代わりに親クエリの allowedTools から書き込み系の2ツールを外して、その実行中はどのエージェントも呼び出せないようにする。", "D": "tools を省略してすべてを継承させ、disallowedTools に書き込み系2ツールの名前を設定して、継承したツール集合から差し引く。"}, "answer": "D", "explanation_ja": "AgentDefinition の表によれば、tools を省略するとエージェントは全ツールを継承し、disallowedTools は「エージェントのツール集合から取り除くツール名の配列」である。よって tools 省略＋disallowedTools で2つの書き込みツールを差し引けば、将来 support サーバーに読み取りツールが追加されても自動的に継承され、かつ返金・エスカレーションは構成上不可能なままになる。両要件を同時に満たすのは D。\nA は誤り。tools に明示列挙すると「列挙したツールしか使えない」ため、新しい読み取りツールが追加されるたびに定義の更新が必要になり、「将来のツールにも自動でアクセスできる」という要件を満たさない。プロンプトへの注意書きは構成上の制約にならない。\nB は誤り。システムプロンプトは指示であって強制力のあるツール制限ではない。ドキュメントはツール制限を「意図しない操作のリスクを減らす」仕組みとして tools / disallowedTools フィールドで行うものと位置づけており、コンプライアンス要件を自然言語の禁止だけに委ねるのはアンチパターン。\nC は誤り。親の allowedTools からツールを外すと、実際に返金やエスカレーションを行う必要のあるメインのサポートエージェント自身が機能しなくなる。制限はサブエージェント側の定義で行うべきで、しかも allowedTools は自動承認の対象を決めるものであり、サブエージェントの権限設計の手段としては適切でない。", "source": "https://code.claude.com/docs/en/agent-sdk/subagents", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q038", "statement_id": "D1-7", "angle": "tradeoff", "scenario_ref": 1, "scenario": "A support agent built on the Agent SDK handles returns and billing through MCP tools such as get_customer, lookup_order, and process_refund. A single ticket often spans hours because the customer replies only occasionally, and the platform team is charged for every minute a container stays alive. Ticket context must survive those idle gaps so the agent never asks the customer for the same order number twice.", "scenario_ja": "Agent SDK 上に構築されたサポートエージェントが、get_customer、lookup_order、process_refund といった MCP ツールを通じて返品と請求を処理している。顧客がたまにしか返信しないため、1件のチケットは数時間に及ぶことが多く、プラットフォームチームはコンテナが起動している時間分だけ課金される。アイドル時間を挟んでもチケットの文脈は保持されなければならず、エージェントが同じ注文番号を二度顧客に尋ねることがあってはならない。", "question": "Which session and hosting pattern best satisfies the continuity requirement at the lowest idle cost?", "question_ja": "継続性の要件を最も低いアイドルコストで満たすのは、どのセッション／ホスティングのパターンか。", "choices": {"A": "Keep one long-running container per open ticket so the session transcript stays on its local disk, and shut the container down only when the ticket is finally closed.", "B": "Use ephemeral containers and pass continue: true on each new customer reply so the SDK picks up the most recent session in the container's working directory.", "C": "Use ephemeral containers that hydrate from a shared SessionStore on startup, look the ticket's session ID up from your database, and resume that ID on each new customer reply.", "D": "Use ephemeral containers with persistSession disabled, and re-send the entire prior chat transcript as the prompt of a brand-new session on every customer reply."}, "choices_ja": {"A": "オープン中のチケットごとに長時間稼働のコンテナを1つ維持し、セッションのトランスクリプトをそのローカルディスク上に置いたまま、チケットが最終的にクローズされたときにだけコンテナを停止する。", "B": "エフェメラルコンテナを使い、顧客から新しい返信が来るたびに continue: true を渡して、コンテナの作業ディレクトリ内の最新セッションを SDK に拾わせる。", "C": "起動時に共有 SessionStore からハイドレートするエフェメラルコンテナを使い、チケットのセッションIDを自社データベースから引き当て、顧客から新しい返信が来るたびにそのIDを resume する。", "D": "persistSession を無効にしたエフェメラルコンテナを使い、顧客の返信ごとに、それまでのチャット全文をプロンプトとして新規セッションに毎回送り直す。"}, "answer": "C", "explanation_ja": "C が正解。公式ドキュメントの「Hybrid sessions」がまさにこの形で、長い間隔を挟みつつ多数のやり取りにまたがるセッション（顧客サポートの履歴読み込みが例として明示されている）向けのパターン。アイドル中はコンテナを落とせるのでコストが下がり、次の返信で SessionStore からトランスクリプトを復元してセッションIDで resume すれば、既に取得した注文情報を含む全文脈が戻る。SessionStore はこのパターンでは任意ではなく必須である点も明記されている。A は継続性は満たすが、返信待ちの間ずっとコンテナが生き続けるため、要件である「アイドルコスト最小」に反する。B は continue が「現在のディレクトリ内で最も新しいセッション」を探す仕組みであり、コンテナが破棄されればローカルのセッションファイルごと消えるうえ、1コンテナで複数チケットを扱えば別の顧客のセッションを拾いかねない。D は毎回ゼロからのセッションになり、過去のツール呼び出し・ツール結果は復元されず（トランスクリプトはあくまで会話文の貼り付けにすぎない）、入力トークンも毎ターン膨らむため、resume を使う設計より脆く高コストになる。", "source": "https://code.claude.com/docs/en/agent-sdk/hosting", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q039", "statement_id": "D1-7", "angle": "design-choice", "scenario_ref": 3, "scenario": "A research coordinator agent has already spent a long, expensive session gathering sources and having a document-analysis subagent summarize them. The team now wants three different report framings drafted from that same gathered evidence: a regulatory framing, a market framing, and a technical framing. Each draft must be independently resumable later for revisions, and the baseline research thread must remain available untouched.", "scenario_ja": "あるリサーチ・コーディネーターのエージェントは、すでに長く高コストなセッションを費やして情報源を収集し、文書分析サブエージェントにそれらを要約させ終えている。チームは今、同じ収集済みの根拠から3通りのレポートの切り口——規制の観点、市場の観点、技術の観点——を起草したいと考えている。各ドラフトは後で修正のために独立して resume できなければならず、ベースラインとなるリサーチのスレッドは手つかずのまま利用可能でなければならない。", "question": "How should the team start the three drafts from the shared research baseline?", "question_ja": "チームは共有のリサーチ・ベースラインから3つのドラフトをどのように開始すべきか。", "choices": {"A": "Send the three framing prompts one after another into the baseline session by resuming its ID three times, then split the combined transcript into three drafts afterwards.", "B": "Issue three queries that each resume the baseline session ID with fork_session enabled, and store the distinct session ID each fork reports for later resumption.", "C": "Copy the baseline session's JSONL transcript to three new file names under the same projects directory, then resume each copied file's name as its own session ID.", "D": "Run the baseline query once per framing with different prompts, relying on prompt caching so the repeated research work costs little on the second and third runs."}, "choices_ja": {"A": "ベースラインセッションのIDを3回 resume して、3つの切り口のプロンプトを次々に同じセッションへ送り込み、後から結合されたトランスクリプトを3つのドラフトに分割する。", "B": "ベースラインのセッションIDを resume しつつ fork_session を有効にしたクエリを3本発行し、各フォークが報告する固有のセッションIDを後の resume 用に保存する。", "C": "ベースラインセッションの JSONL トランスクリプトを同じ projects ディレクトリ配下に3つの別名でコピーし、コピーしたファイル名をそれぞれ独自のセッションIDとして resume する。", "D": "切り口ごとにベースラインのクエリを異なるプロンプトで走らせ直し、2回目・3回目のリサーチ作業のコストはプロンプトキャッシュのおかげで小さく済むと見込む。"}, "answer": "B", "explanation_ja": "B が正解。fork はまさに「共有ベースラインから独立した分岐を作る」ための機能で、元セッション履歴のコピーを起点に新しいセッションを作り、元のIDと履歴は変更されない。resume に fork_session を添えたクエリを3本走らせれば、それぞれが元と異なる固有のセッションIDを返し（結果メッセージ／init メッセージから取得できる）、3つのドラフトを後から個別に resume できる。A は同一セッションを3回 resume するだけなので分岐にならず、3つの切り口が1本の履歴に混ざって互いを汚染し、独立した resume もできない。C はセッションファイルを直接複製する運用で、ドキュメントが示す API 上の手段ではなく、トランスクリプト内部のIDやメタデータとファイル名の整合が崩れる。fork という正規の手段がある以上、ファイル操作に頼る設計は不適切。D は高コストな収集フェーズを3回やり直す設計で、そもそもフォークすれば1回で済む。加えてプロンプトキャッシュは変化しない先頭部分に効くだけで、ツール呼び出しを伴う調査作業そのものをやり直すコストは消えない。", "source": "https://code.claude.com/docs/en/agent-sdk/sessions", "pack": "v2", "created": "2026-08-21"}, {"id": "D1-q040", "statement_id": "D1-1", "angle": "design-choice", "scenario_ref": 1, "scenario": "A customer support resolution agent runs unattended with the MCP tools get_customer, lookup_order, process_refund, and escalate_to_human. Operations requires two things: a session must never spin indefinitely on an ambiguous billing case, and for every finished session the on-call team must be able to tell whether the agent actually completed the case or was cut off by a safety limit.", "scenario_ja": "顧客サポート解決エージェントが、MCPツール get_customer、lookup_order、process_refund、escalate_to_human を使って無人で稼働している。運用チームの要件は2つ。曖昧な請求案件でセッションが無限に回り続けないこと、そして終了した各セッションについて、エージェントが実際に案件を完了したのか、それとも安全上の上限で打ち切られたのかをオンコール担当が判別できることである。", "question": "Which loop design best satisfies both requirements?", "question_ja": "この2つの要件を最もよく満たすループ設計はどれか。", "choices": {"A": "Terminate the loop after a fixed number of iterations chosen from average case length, and record every session that reaches the final iteration without an API error as a completed resolution.", "B": "Terminate the loop when the assistant text of a turn contains a resolution phrase such as \"refund processed\" or \"escalated\", and log that matched phrase as the session outcome for the on-call team.", "C": "Terminate the loop on stop_reason \"end_turn\" and continue on \"tool_use\", set max turns and a budget cap purely as backstops, and report the result subtype (success vs. error_max_turns or error_max_budget_usd) as the outcome.", "D": "Terminate the loop as soon as process_refund or escalate_to_human executes successfully, skip appending that tool result to the history, and record the name of the tool that fired as the session outcome."}, "choices_ja": {"A": "平均的な案件長から決めた固定回数の反復でループを終了し、APIエラーなく最終反復に到達したセッションはすべて解決完了として記録する。", "B": "あるターンのアシスタントテキストに「refund processed」「escalated」といった解決フレーズが含まれた時点でループを終了し、一致したフレーズをセッションの結果としてオンコール担当向けに記録する。", "C": "stop_reason が \"end_turn\" のときループを終了し \"tool_use\" のときは継続する。最大ターン数と予算上限はあくまで安全網として設定し、結果のサブタイプ（success か error_max_turns / error_max_budget_usd か）を結果として報告する。", "D": "process_refund または escalate_to_human が成功した時点で直ちにループを終了し、そのツール結果は履歴に追加せず、発火したツール名をセッションの結果として記録する。"}, "answer": "C", "explanation_ja": "正解 C: 公式ドキュメントが定めるループ制御そのもの。stop_reason が \"tool_use\" ならツールを実行して結果を履歴に追加して継続し、\"end_turn\" なら終了する。無限ループ対策の max_turns / max_budget_usd は「主たる停止条件」ではなく安全網として置き、終了時の ResultMessage の subtype（success / error_max_turns / error_max_budget_usd）を見れば、正常完了か上限で打ち切られたかを機械的に判別できる。要件2つを同時に満たすのはこれだけ。\nA: 反復回数の上限を主たる停止条件にするのは明示的なアンチパターン。さらに「最終反復に到達＝完了」とみなすため、上限で切られた未完了セッションが解決済みとして記録され、要件2を根本的に壊す。\nB: アシスタントの自然言語テキストを完了シグナルとして解析するのは、ドキュメントとExam Guideの双方が名指しで挙げるアンチパターン。文言はモデル出力ごとに揺れ、ツール呼び出し前の予告文（「これから返金します」）にも一致してしまい、実際にはツールが未実行のまま完了扱いになりうる。\nD: ツール結果を履歴に追加せず即座に打ち切るため、モデルは process_refund の成否（失敗や is_error）を一切見られず、最終応答も生成されない。返金APIがエラーを返しても「解決」と記録される。ツール結果は必ず対応する tool_use の直後に追加してモデルに返すのが正しい設計。", "source": "https://code.claude.com/docs/en/agent-sdk/agent-loop", "pack": "v2", "created": "2026-08-21"}, {"id": "D2-q001", "statement_id": "D2-4", "scenario": "You are explaining the MCP architecture to a colleague who is confused about why their AI application maintains three separate connections when it uses three MCP servers.", "scenario_ja": "あなたは、AIアプリケーションが3つのMCPサーバーを使うときに、なぜ3つの別々のコネクションを維持しているのか混乱している同僚にMCPアーキテクチャを説明している。", "question": "Which statement correctly describes the MCP architecture?", "question_ja": "MCPアーキテクチャを正しく説明しているのはどれか？", "choices": {"A": "The host application contains one MCP client per connected server; each client maintains a dedicated one-to-one connection with its server", "B": "A single MCP client multiplexes all servers over one shared connection", "C": "MCP servers connect directly to each other and elect a leader that talks to the host", "D": "The model itself opens TCP connections to each server at inference time"}, "choices_ja": {"A": "ホストアプリケーションは接続するサーバーごとに1つのMCPクライアントを持ち、各クライアントはそのサーバーと専用の1対1接続を維持する", "B": "単一のMCPクライアントが、1つの共有接続上ですべてのサーバーを多重化する", "C": "MCPサーバー同士が直接接続し、ホストと話すリーダーを選出する", "D": "モデル自身が推論時に各サーバーへTCP接続を開く"}, "answer": "A", "explanation_ja": "MCP はホスト（AIアプリ）・クライアント・サーバの3層で、ホストはサーバごとに専用のクライアントを1つ持つ（1対1接続）。B の多重化モデルではない。C/D はアーキテクチャの誤解。ホスト＝Claude Desktop や Claude Code、サーバ＝機能提供側、という対応も押さえる。", "source": "https://modelcontextprotocol.io/docs/learn/architecture", "pack": "v1"}, {"id": "D2-q002", "statement_id": "D2-1", "scenario": "An MCP server for a project-management SaaS will expose: (1) an action that creates a new task, (2) read-only project data the application may include as context, and (3) a reusable, user-selectable template for weekly report generation.", "scenario_ja": "あるプロジェクト管理SaaS用のMCPサーバーは、(1) 新しいタスクを作成するアクション、(2) アプリケーションが文脈として含めることのある読み取り専用のプロジェクトデータ、(3) 週次レポート生成用の再利用可能でユーザーが選択できるテンプレート、を公開する予定である。", "question": "Which MCP primitive should implement each capability?", "question_ja": "それぞれの機能はどのMCPプリミティブで実装すべきか？", "choices": {"A": "(1) Tool, (2) Resource, (3) Prompt", "B": "(1) Resource, (2) Tool, (3) Prompt", "C": "(1) Tool, (2) Prompt, (3) Resource", "D": "(1) Prompt, (2) Resource, (3) Tool"}, "choices_ja": {"A": "(1) Tool, (2) Resource, (3) Prompt", "B": "(1) Resource, (2) Tool, (3) Prompt", "C": "(1) Tool, (2) Prompt, (3) Resource", "D": "(1) Prompt, (2) Resource, (3) Tool"}, "answer": "A", "explanation_ja": "Tools＝モデルが呼び出す実行可能なアクション（副作用あり得る）、Resources＝アプリケーションが文脈として供給する読み取り専用データ、Prompts＝ユーザーが明示的に選ぶ再利用可能なテンプレート。誰がコントロールするか（model / application / user）で区別するのが最短の覚え方。", "source": "https://modelcontextprotocol.io/docs/learn/server-concepts", "pack": "v1"}, {"id": "D2-q003", "statement_id": "D2-4", "scenario": "A team builds two MCP servers: one wraps a local CLI tool and will run on each developer's machine, spawned by the host; the other is a shared company-wide service that many remote users must reach over the network.", "scenario_ja": "あるチームが2つのMCPサーバーを構築している。1つはローカルのCLIツールをラップし各開発者のマシン上でホストによって起動される。もう1つは多数のリモートユーザーがネットワーク越しにアクセスしなければならない、全社共有のサービスである。", "question": "Which transports should each server use?", "question_ja": "それぞれのサーバーはどのトランスポートを使うべきか？", "choices": {"A": "Both must use stdio, since it is the only officially supported transport", "B": "The local one uses stdio (spawned as a subprocess); the shared remote one uses the HTTP-based transport (Streamable HTTP)", "C": "The local one uses HTTP on localhost; the remote one uses stdio over SSH", "D": "Both should use WebSockets for bidirectional communication"}, "choices_ja": {"A": "唯一公式にサポートされているトランスポートであるため、両方ともstdioを使うべきである", "B": "ローカルのものはstdio（サブプロセスとして起動）を使い、共有のリモートのものはHTTPベースのトランスポート（Streamable HTTP）を使う", "C": "ローカルのものはlocalhost上でHTTPを使い、リモートのものはSSH経由のstdioを使う", "D": "双方向通信のため、両方ともWebSocketsを使うべきである"}, "answer": "B", "explanation_ja": "ローカルでホストが子プロセスとして起動する形態は stdio、ネットワーク越しの共有サービスは Streamable HTTP（HTTP POST + オプションで SSE ストリーミング）。旧 HTTP+SSE トランスポートは Streamable HTTP に置き換えられた経緯も押さえておく。C の『stdio over SSH』や D の WebSocket は仕様の標準トランスポートではない。", "source": "https://modelcontextprotocol.io/specification/2025-11-25/basic/transports", "pack": "v1"}, {"id": "D2-q004", "statement_id": "D2-1", "scenario": "An MCP server exposes a single tool called 'do_database_operation' that accepts a raw SQL string and an operation type. Model behavior is erratic: wrong tables, occasional destructive queries, and poor tool selection.", "scenario_ja": "あるMCPサーバーは、生のSQL文字列と操作種別を受け取る「do_database_operation」という単一のツールを公開している。モデルの挙動は不安定で、誤ったテーブルへのアクセス、時折の破壊的クエリ、ツール選択の悪さが見られる。", "question": "What is the best redesign of the tool boundary?", "question_ja": "ツール境界の最良の再設計はどれか？", "choices": {"A": "Keep the single tool but write a longer description warning the model to be careful", "B": "Split it into focused, well-named tools (e.g. search_customers, get_order, update_order_status) with typed input schemas and clear descriptions of when to use each", "C": "Remove the description entirely so the model relies on the tool name", "D": "Expose the database connection string as a Resource so the model can connect directly"}, "choices_ja": {"A": "単一のツールは維持しつつ、モデルに注意を促すより長い説明文を書く", "B": "型付き入力スキーマと、それぞれをいつ使うかの明確な説明を持つ、焦点の絞られた適切な名前のツール（例：search_customers、get_order、update_order_status）に分割する", "C": "モデルがツール名に頼るよう、説明文を完全に削除する", "D": "モデルが直接接続できるよう、データベース接続文字列をResourceとして公開する"}, "answer": "B", "explanation_ja": "ツール境界設計の基本：粒度は『1ツール=1つの明確な意図』、良い命名、型付き入力スキーマ、いつ使うかを書いた説明。生SQLを受ける万能ツールは誤用・破壊的操作のリスクが高い。A は根本対策でない。D は接続情報の漏洩でセキュリティ違反。", "source": "https://modelcontextprotocol.io/docs/develop/build-server", "pack": "v1"}, {"id": "D2-q005", "statement_id": "D2-1", "scenario": "A company deploys an MCP server that can send emails on behalf of the user. The security review asks how the system prevents the model from silently sending emails without the user's knowledge.", "scenario_ja": "ある企業はユーザーに代わってメールを送信できるMCPサーバーをデプロイしている。セキュリティレビューでは、ユーザーの知らないうちにモデルが黙ってメールを送信することをシステムがどう防いでいるか尋ねている。", "question": "According to MCP security principles, what is required?", "question_ja": "MCPのセキュリティ原則によれば、何が必要とされるか？", "choices": {"A": "Nothing: once the server is installed, tool calls are implicitly authorized", "B": "The host must obtain explicit user consent before invoking tools, especially those with side effects; users should understand and authorize what each tool does", "C": "The server should log emails after sending so users can audit later", "D": "The model should be prompted to always ask itself whether sending is appropriate"}, "choices_ja": {"A": "何もない：サーバーがインストールされた時点で、ツール呼び出しは暗黙的に承認されている", "B": "ホストはツール、特に副作用のあるツールを呼び出す前に明示的なユーザーの同意を得なければならない。ユーザーは各ツールが何をするかを理解し、承認すべきである", "C": "サーバーは後で監査できるよう、送信後にメールをログに記録すべきである", "D": "モデルは送信が適切かどうか自問するよう常にプロンプトされるべきである"}, "answer": "B", "explanation_ja": "MCP 仕様のセキュリティ原則の中核は『ユーザーの明示的な同意とコントロール』。特に副作用のあるツール実行はホストがユーザー同意を得てから行う。C の事後ログは同意の代替にならない。D はプロンプト任せで保証がない。", "source": "https://modelcontextprotocol.io/specification/2025-11-25/index", "pack": "v1"}, {"id": "D2-q006", "statement_id": "D2-1", "scenario": "A developer wants the model to be able to fetch the current content of specific documentation pages so it can answer questions. The pages are read-only and identified by URIs. They implemented this as a Tool, but a reviewer suggests Resources.", "scenario_ja": "ある開発者は、モデルが質問に答えられるよう特定のドキュメントページの現在の内容を取得できるようにしたいと考えている。ページは読み取り専用でURIによって識別される。開発者はこれをToolとして実装したが、レビュアーはResourcesを提案している。", "question": "What is the key architectural argument for using Resources here?", "question_ja": "ここでResourcesを使うことの重要なアーキテクチャ上の論拠は何か？", "choices": {"A": "Resources are faster than Tools because they bypass the JSON-RPC layer", "B": "Resources are application-controlled read-only data identified by URIs — the host decides how to expose them as context, which matches read-only reference data better than a model-invoked action", "C": "Tools cannot return text content, only numbers", "D": "Resources automatically update the model's training data"}, "choices_ja": {"A": "ResourcesはJSON-RPC層を迂回するためToolsより高速である", "B": "ResourcesはURIによって識別されるアプリケーション制御の読み取り専用データであり、ホストがそれをどうコンテキストとして公開するかを決める——これはモデルが起動するアクションよりも読み取り専用の参照データに適している", "C": "Toolsはテキストコンテンツを返せず、数値しか返せない", "D": "Resourcesは自動的にモデルの学習データを更新する"}, "answer": "B", "explanation_ja": "URIで識別される読み取り専用データは Resource の設計対象。Resource はアプリケーション制御で、ホスト側が文脈への取り込み方を決められる。Tool は副作用を伴い得る『モデルが起こすアクション』向け。A/C/D は事実誤認。ただし実務ではクライアントの Resource 対応状況によって Tool 化する判断もあり、試験では『原則』を問われる。", "source": "https://modelcontextprotocol.io/docs/learn/server-concepts", "pack": "v1"}, {"id": "D2-q007", "statement_id": "D2-4", "scenario": "An MCP client connects to a server and must agree on the protocol rules before any tools are listed or called.", "scenario_ja": "あるMCPクライアントはサーバーに接続し、ツールが一覧表示されたり呼び出されたりする前に、プロトコルのルールについて合意しなければならない。", "question": "What happens during the MCP initialization phase?", "question_ja": "MCPの初期化フェーズでは何が起こるか？", "choices": {"A": "The client and server exchange initialize messages to negotiate the protocol version and declare their capabilities before normal operations begin", "B": "The server immediately streams its full tool list; version checks are optional", "C": "The client downloads the server's source code to verify compatibility", "D": "Authentication tokens are exchanged; protocol versions are resolved lazily on first tool call"}, "choices_ja": {"A": "クライアントとサーバーはinitializeメッセージを交換し、通常運用が始まる前にプロトコルバージョンを交渉しcapabilityを宣言し合う", "B": "サーバーは直ちに完全なツールリストをストリーム配信する。バージョンチェックは任意である", "C": "クライアントは互換性を確認するためサーバーのソースコードをダウンロードする", "D": "認証トークンが交換される。プロトコルバージョンは最初のツール呼び出し時に遅延解決される"}, "answer": "A", "explanation_ja": "MCP のライフサイクルは initialize（プロトコルバージョン交渉＋capability 宣言）→ initialized 通知 → 通常運用、の順。capability negotiation により双方がサポートする機能（tools, resources, prompts, sampling 等）を宣言し合う。B/D のような遅延解決ではない。", "source": "https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle", "pack": "v1"}, {"id": "D2-q008", "statement_id": "D2-4", "scenario": "A remote MCP server requires authorization. The team plans to implement it by putting a static API key in the URL query string for every user.", "scenario_ja": "あるリモートMCPサーバーは認可を必要とする。チームは、すべてのユーザーに対して静的なAPIキーをURLのクエリ文字列に入れることでこれを実装しようと計画している。", "question": "What does the MCP authorization specification recommend instead for HTTP-based transports?", "question_ja": "HTTPベースのトランスポートに対して、MCPの認可仕様は代わりに何を推奨しているか？", "choices": {"A": "OAuth 2.1-based authorization flows, where the client obtains scoped access tokens rather than embedding static shared credentials", "B": "Basic authentication with a company-wide shared password", "C": "Client IP allowlisting as the sole control", "D": "No authorization: MCP traffic should always be anonymous"}, "choices_ja": {"A": "静的な共有クレデンシャルを埋め込むのではなく、クライアントがスコープ付きアクセストークンを取得するOAuth 2.1ベースの認可フロー", "B": "会社全体で共有された1つのパスワードによるBasic認証", "C": "唯一の制御としてのクライアントIPアローリスト", "D": "認可なし：MCPトラフィックは常に匿名であるべきである"}, "answer": "A", "explanation_ja": "HTTPベースのトランスポートに対する MCP の authorization 仕様は OAuth 2.1 ベース。ユーザーごとにスコープ付きトークンを取得し、静的な共有クレデンシャルを避ける。クエリ文字列のAPIキーはログ漏洩リスクも高い。B/C は近代的な認可の代替にならず、D は論外。", "source": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization", "pack": "v1"}, {"id": "D2-q009", "statement_id": "D2-2", "scenario": "An MCP tool wraps a flaky third-party API. When it fails, your implementation currently returns the generic string \"Operation failed\" regardless of cause, and the agent cannot decide whether to retry, try something else, or explain the failure to the user.", "scenario_ja": "あるMCPツールは不安定なサードパーティAPIをラップしている。それが失敗すると、現在の実装は原因に関わらず一般的な文字列「Operation failed」を返し、エージェントはリトライすべきか、他の方法を試すべきか、それともユーザーに失敗を説明すべきか判断できない。", "question": "What is the correct way to fix this using the MCP error pattern?", "question_ja": "MCPのエラーパターンを使ってこれを正しく修正する方法は何か？", "choices": {"A": "Return structured error metadata via the isError flag, including an errorCategory (transient/validation/business/permission) and an isRetryable boolean, plus a human-readable description", "B": "Keep the generic message but log the real cause server-side for engineers to review later", "C": "Silently retry three times internally and only surface an error if all three attempts fail, without any category information", "D": "Throw a raw exception so the MCP client crashes and the developer notices immediately"}, "choices_ja": {"A": "isErrorフラグを介して構造化されたエラーメタデータを返す。errorCategory（一時的/検証/ビジネス/権限）とisRetryableブール値、そして人間が読める説明を含める", "B": "一般的なメッセージは維持しつつ、エンジニアが後で確認できるようサーバー側で実際の原因をログに記録する", "C": "内部で3回サイレントにリトライし、3回すべて失敗した場合のみ、カテゴリ情報なしでエラーを表面化させる", "D": "開発者がすぐに気づけるよう、生の例外をスローしてMCPクライアントをクラッシュさせる"}, "answer": "A", "explanation_ja": "MCPの isError パターンでは、errorCategory（一時的/検証/ビジネス/権限）と isRetryable のような構造化メタデータを返すことで、エージェントが適切な回復判断（リトライ・代替手段・ユーザーへの説明）を下せるようになる。画一的な文言（B/C）は判断材料を隠す。D はクラッシュを招き復旧の機会を奪う。", "source": "materials/official/exam-guide.pdf (Task Statement 2.2)", "pack": "v1"}, {"id": "D2-q010", "statement_id": "D2-5", "scenario": "You need to find every place in a large codebase that calls a function named processPayment, including calls that go through re-exported wrapper modules with different names.", "scenario_ja": "あなたは、異なる名前で再エクスポートされたラッパーモジュールを経由する呼び出しも含め、大規模なコードベース内でprocessPaymentという名前の関数を呼び出しているすべての箇所を見つける必要がある。", "question": "What is the most effective built-in tool workflow for this investigation?", "question_ja": "この調査に最も効果的な組み込みツールのワークフローは何か？", "choices": {"A": "Use Grep to find the function definition and all direct call sites, then identify exported wrapper names and Grep again for each of those names across the codebase", "B": "Use Glob with pattern **/*.ts to list every TypeScript file, then Read each one in full to check for the function name", "C": "Use Edit to insert a logging statement into every file, then run the test suite and check which logs fire", "D": "Use Write to create a single file listing all known call sites from memory, without searching the codebase"}, "choices_ja": {"A": "Grepを使って関数定義と直接の呼び出し箇所をすべて見つけ、エクスポートされたラッパー名を特定し、それらの名前それぞれについてコードベース全体を再度Grepする", "B": "Globでパターン**/*.tsを使ってすべてのTypeScriptファイルを列挙し、それぞれをReadで全文読んで関数名を確認する", "C": "Editを使ってすべてのファイルにログ出力文を挿入し、テストスイートを実行してどのログが発火するか確認する", "D": "コードベースを検索せず、記憶にある既知の呼び出し箇所をすべて列挙した単一のファイルをWriteで作成する"}, "answer": "A", "explanation_ja": "Grep はファイル内容の検索（関数名・エラーメッセージ等）に適しており、まずエクスポート名を特定し、それぞれの名前で再検索することでラッパー経由の呼び出しも追跡できる。Glob（B）はパスパターン一致であり内容検索には向かず、全文Readは非効率。C はこのタスクの目的（静的な呼び出し箇所の調査）に対して過剰かつ的外れ。D は検索を行っておらず不正確。", "source": "materials/official/exam-guide.pdf (Task Statement 2.5)", "pack": "v1"}, {"id": "D3-q001", "statement_id": "D3-1", "scenario": "A developer wants coding conventions shared with the whole team via version control, but also keeps personal sandbox URLs that should never be committed to the repository.", "scenario_ja": "ある開発者は、コーディング規約をバージョン管理を通じてチーム全体と共有したい一方で、リポジトリに決してコミットすべきでない個人用のサンドボックスURLも保持している。", "question": "Where should each piece of memory live?", "question_ja": "それぞれのメモリはどこに置くべきか？", "choices": {"A": "Team conventions in ./CLAUDE.md (checked into the repo); personal, uncommitted notes in CLAUDE.local.md or ~/.claude/CLAUDE.md", "B": "Everything in ~/.claude/CLAUDE.md so it applies to all projects", "C": "Everything in ./CLAUDE.md, with personal notes marked by comments so teammates ignore them", "D": "Team conventions in CLAUDE.local.md; personal notes in ./CLAUDE.md"}, "choices_ja": {"A": "チームの規約はリポジトリにコミットされる./CLAUDE.mdに、個人的でコミットしないメモはCLAUDE.local.mdまたは~/.claude/CLAUDE.mdに置く", "B": "すべてのプロジェクトに適用されるよう、すべてを~/.claude/CLAUDE.mdに置く", "C": "すべてを./CLAUDE.mdに置き、チームメイトが無視できるようコメントで個人的なメモに印を付ける", "D": "チームの規約をCLAUDE.local.mdに、個人的なメモを./CLAUDE.mdに置く"}, "answer": "A", "explanation_ja": "CLAUDE.md には階層がある。プロジェクト共有の規約はリポジトリにコミットする ./CLAUDE.md、個人的で共有しないものは CLAUDE.local.md（gitignore 対象）またはユーザースコープの ~/.claude/CLAUDE.md。B は全プロジェクトに漏れる、C は機密がコミットされる、D は役割が逆。", "source": "https://code.claude.com/docs/en/memory", "pack": "v1"}, {"id": "D3-q002", "statement_id": "D3-2", "scenario": "A team builds an Agent Skill for generating financial reports. The SKILL.md file has grown to 8,000 lines including full API references, examples, and edge-case tables, and Claude's performance has degraded.", "scenario_ja": "あるチームが財務レポート生成用のAgent Skillを構築している。SKILL.mdファイルは完全なAPIリファレンス、例、エッジケースの表を含めて8,000行にまで膨れ上がり、Claudeのパフォーマンスが低下している。", "question": "How should the skill be restructured according to progressive disclosure principles?", "question_ja": "progressive disclosure（段階的開示）の原則に従うと、このskillはどう再構成すべきか？", "choices": {"A": "Split the content into multiple skills with identical descriptions so Claude picks one at random", "B": "Keep a concise SKILL.md with the core workflow, and move detailed references into separate files in the skill folder that Claude reads only when needed", "C": "Move all content into the system prompt so it is always available", "D": "Compress the text by removing whitespace and abbreviating words"}, "choices_ja": {"A": "Claudeがランダムに1つを選ぶよう、同一の説明文を持つ複数のskillにコンテンツを分割する", "B": "コアとなるワークフローを含む簡潔なSKILL.mdを維持し、詳細な参考資料はskillフォルダ内の別ファイルに移して、必要なときだけClaudeが読み込むようにする", "C": "常に利用可能であるよう、すべてのコンテンツをシステムプロンプトに移す", "D": "空白を削除し単語を省略してテキストを圧縮する"}, "answer": "B", "explanation_ja": "Skills の設計原則は progressive disclosure：常時読み込まれるのは skill の説明（と本体は必要になったとき）で、詳細資料は skill フォルダ内の別ファイルに分け、必要なときだけ Claude が参照する。C はコンテキストを常時圧迫し逆効果。A/D は問題を解決しない。", "source": "https://code.claude.com/docs/en/skills", "pack": "v1"}, {"id": "D3-q003", "statement_id": "D3-2", "scenario": "A team has three needs: (1) a frequently typed shortcut that expands to a fixed review-checklist prompt, (2) domain expertise Claude should apply automatically whenever it works on billing code, and (3) an isolated read-only investigator for large log searches that should not pollute the main context.", "scenario_ja": "あるチームには3つのニーズがある：(1) 固定のレビューチェックリストのプロンプトに展開される、頻繁に入力されるショートカット、(2) 請求関連のコードを扱うときにClaudeが常に自動的に適用すべき専門知識、(3) 大規模なログ検索のための、メインのコンテキストを汚染すべきでない独立した読み取り専用の調査役。", "question": "Which mapping of features to needs is correct?", "question_ja": "機能とニーズの対応付けとして正しいのはどれか？", "choices": {"A": "(1) subagent, (2) slash command, (3) skill", "B": "(1) slash command, (2) skill, (3) subagent", "C": "(1) skill, (2) subagent, (3) slash command", "D": "(1) slash command, (2) subagent, (3) skill"}, "choices_ja": {"A": "(1) subagent, (2) slash command, (3) skill", "B": "(1) slash command, (2) skill, (3) subagent", "C": "(1) skill, (2) subagent, (3) slash command", "D": "(1) slash command, (2) subagent, (3) skill"}, "answer": "B", "explanation_ja": "ユーザーが明示的に打つ定型プロンプトはスラッシュコマンド。条件に合致したとき Claude が自律的に読み込む専門知識は skill。独立コンテキストで動く探索・調査ワーカーはサブエージェント。この3つの使い分けは頻出ポイント。", "source": "https://code.claude.com/docs/en/skills", "pack": "v1"}, {"id": "D3-q004", "statement_id": "D3-1", "scenario": "A team wants to automatically run a code formatter on every file that Claude Code edits, immediately after each edit succeeds.", "scenario_ja": "あるチームは、Claude Codeが編集したすべてのファイルに対して、各編集が成功した直後に自動的にコードフォーマッタを実行したいと考えている。", "question": "Which hook event should they use?", "question_ja": "どのフックイベントを使うべきか？", "choices": {"A": "PreToolUse matched on the Edit tool", "B": "PostToolUse matched on the Edit tool", "C": "UserPromptSubmit", "D": "SessionStart"}, "choices_ja": {"A": "EditツールにマッチさせたPreToolUse", "B": "EditツールにマッチさせたPostToolUse", "C": "UserPromptSubmit", "D": "SessionStart"}, "answer": "B", "explanation_ja": "編集が『成功した後』に走らせる処理は PostToolUse（matcher で Edit/Write 系ツールに絞る）。PreToolUse は実行前の検証・ブロック用。UserPromptSubmit はプロンプト送信時、SessionStart はセッション開始時で用途が異なる。イベントごとの発火タイミングの理解が問われる。", "source": "https://code.claude.com/docs/en/hooks", "pack": "v1"}, {"id": "D3-q005", "statement_id": "D3-6", "scenario": "During a long refactoring session, a developer asks Claude Code to also investigate a flaky test. The investigation involves reading dozens of log files, and the developer worries this will crowd out the refactoring context.", "scenario_ja": "長時間のリファクタリングセッション中に、開発者はClaude Codeに不安定なテストの調査も依頼した。その調査は数十個のログファイルを読むことを伴い、開発者はこれがリファクタリングのコンテキストを圧迫するのではないかと心配している。", "question": "What is the best way to handle the investigation?", "question_ja": "この調査を扱う最良の方法は何か？", "choices": {"A": "Run the investigation in the same conversation and use /compact afterwards", "B": "Delegate the investigation to a subagent, which works in its own context window and returns only its findings", "C": "Paste all log files into CLAUDE.md so they persist", "D": "Disable the Read tool so logs cannot enter the context"}, "choices_ja": {"A": "同じ会話の中で調査を実行し、その後/compactを使う", "B": "調査をサブエージェントに委譲する。サブエージェントは自身のコンテキストウィンドウの中で作業し、結果のみを返す", "C": "すべてのログファイルをCLAUDE.mdに貼り付けて永続化する", "D": "ログがコンテキストに入らないようReadツールを無効化する"}, "answer": "B", "explanation_ja": "サブエージェントは独立したコンテキストウィンドウを持ち、大量のファイル読み込みを本体の会話から分離できる。返ってくるのは要約された結論のみ。A は一度汚れたコンテキストの対症療法。C は CLAUDE.md の誤用。D は投機的で作業自体を不可能にする。", "source": "https://code.claude.com/docs/en/sub-agents", "pack": "v1"}, {"id": "D3-q006", "statement_id": "D3-6", "scenario": "A team wants their CI pipeline to automatically triage new GitHub issues using Claude Code: no interactive terminal, a single prompt in, structured result out.", "scenario_ja": "あるチームは、対話的なターミナルなしで、単一のプロンプトを入力すると構造化された結果が出力される形で、CIパイプラインがClaude Codeを使って新しいGitHub issueを自動的にトリアージできるようにしたいと考えている。", "question": "Which invocation pattern fits this requirement?", "question_ja": "この要件に適合する呼び出しパターンはどれか？", "choices": {"A": "Run 'claude' interactively on the CI runner and type the prompt manually", "B": "Use headless mode: 'claude -p \"<prompt>\"' with an output format suitable for scripting, or the Claude Code GitHub Action", "C": "Headless usage is not supported; CI must call the raw Messages API without Claude Code", "D": "Enable a SessionStart hook that reads the issue from an environment variable"}, "choices_ja": {"A": "CIランナー上で'claude'を対話的に実行し、プロンプトを手動で入力する", "B": "ヘッドレスモードを使う：スクリプト向きの出力フォーマットを伴う'claude -p \"<prompt>\"'、あるいはClaude Code GitHub Actionを使う", "C": "ヘッドレス利用はサポートされていない。CIはClaude Codeを使わず生のMessages APIを呼び出す必要がある", "D": "環境変数からissueを読み込むSessionStartフックを有効にする"}, "answer": "B", "explanation_ja": "CI/CD などの非対話環境では headless モード（claude -p、--output-format json 等）や GitHub Actions 統合を使う。A は非対話環境で成立しない。C は誤り（headless は公式サポート）。D はフックの用途違い。", "source": "https://code.claude.com/docs/en/headless", "pack": "v1"}, {"id": "D3-q007", "statement_id": "D3-5", "scenario": "A developer asks Claude Code to \"reformat this CSV export into the format our billing system expects.\" The prose description alone produces inconsistent transformations across different runs.", "scenario_ja": "ある開発者はClaude Codeに「このCSVエクスポートを請求システムが期待する形式に整形し直して」と依頼した。散文的な説明だけでは、実行のたびに一貫性のない変換が生成される。", "question": "What is the most effective way to get consistent, correct results?", "question_ja": "一貫した正しい結果を得る最も効果的な方法は何か？", "choices": {"A": "Provide 2-3 concrete input/output examples showing the exact transformation expected, rather than relying on the prose description alone", "B": "Repeat the prose description three times using different wording each time", "C": "Reduce max_tokens so the model has less room to improvise", "D": "Ask the model to guess the billing system's format from its training knowledge"}, "choices_ja": {"A": "散文的な説明だけに頼るのではなく、期待される正確な変換を示す2〜3個の具体的な入出力例を示す", "B": "毎回異なる言い回しで散文的な説明を3回繰り返す", "C": "モデルの即興の余地を減らすためmax_tokensを減らす", "D": "モデルにその学習知識から請求システムの形式を推測させる"}, "answer": "A", "explanation_ja": "散文的な説明だけでは解釈が一貫しない場合、具体的な入出力例（2〜3個）を示すのが最も効果的な反復的洗練技法。曖昧な変換要求ほど例示の効果が大きい。B は根本解決にならず、C/D は無関係・不確実。", "source": "materials/official/exam-guide.pdf (Task Statement 3.5)", "pack": "v1"}, {"id": "D3-q008", "statement_id": "D3-3", "angle": "design-choice", "scenario_ref": 2, "scenario": "A team uses Claude Code for code generation and refactoring in a large monorepo. Their root CLAUDE.md has grown to roughly 600 lines because it now holds React component rules, database migration rules, and Terraform rules alongside the shared build commands. Engineers report that Claude increasingly ignores instructions and that startup context is bloated even for one-line changes.", "scenario_ja": "あるチームは大規模モノレポでのコード生成とリファクタリングに Claude Code を使っている。ルートの CLAUDE.md は、共通のビルドコマンドに加えて React コンポーネント規約・DB マイグレーション規約・Terraform 規約まで抱え込み、約600行に膨れ上がっている。エンジニアからは、Claude が指示を無視することが増え、1行の変更でも起動時のコンテキストが肥大している、との報告が上がっている。", "question": "Which restructuring best reduces startup context while keeping each set of conventions available when it is actually needed?", "question_ja": "各規約が実際に必要なときには利用可能な状態を保ちつつ、起動時のコンテキストを最も削減できる再構成はどれか。", "choices": {"A": "Split the technology-specific sections into separate files and pull them into CLAUDE.md with @path imports, keeping the build commands inline at the top.", "B": "Move each technology-specific section into its own .claude/rules/*.md file with a paths frontmatter glob, leaving only build commands in CLAUDE.md.", "C": "Move each technology-specific section into a CLAUDE.md placed in the directory tree above the working directory for that technology.", "D": "Keep all sections in CLAUDE.md and list the irrelevant ones in claudeMdExcludes in each engineer's settings.local.json file."}, "choices_ja": {"A": "技術別のセクションを別ファイルに分割し、@path インポートで CLAUDE.md に取り込む。ビルドコマンドは先頭にインラインで残す。", "B": "技術別の各セクションを paths フロントマター（glob）付きの .claude/rules/*.md へ移し、CLAUDE.md にはビルドコマンドだけを残す。", "C": "技術別の各セクションを、その技術の作業ディレクトリより上位のディレクトリツリーに置いた CLAUDE.md へ移す。", "D": "全セクションを CLAUDE.md に残したまま、各エンジニアの settings.local.json の claudeMdExcludes に無関係なものを列挙する。"}, "answer": "B", "explanation_ja": "B が正解。`.claude/rules/` の各ファイルに `paths` フロントマターを付けると、そのグロブに一致するファイルを Claude が読んだときだけ規約がコンテキストに入る。公式ドキュメントは、CLAUDE.md が肥大した場合の対処としてまさにこの path-scoped rules を挙げている。A は誤り。@path インポートは整理には役立つが、インポート先も起動時に展開されてコンテキストに入るため、トークン削減にはならない（ドキュメントに明記）。C は誤り。作業ディレクトリより「上位」の CLAUDE.md は起動時に全文ロードされるため、削減にならない。条件付きロードになるのはサブディレクトリ側の CLAUDE.md であり、方向が逆。D は誤り。claudeMdExcludes はモノレポで他チームのファイルを除外するための機能で、各自の端末設定に依存するため team-shared な規約の配布手段にならず、除外した規約は必要なときにも読み込まれない。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q009", "statement_id": "D3-3", "angle": "troubleshoot", "scenario_ref": 4, "scenario": "A developer exploring an unfamiliar codebase added .claude/rules/api-conventions.md with the frontmatter paths: [\"src/api/*.ts\"] to make Claude follow the team's error-handling format. When Claude edits src/api/users.ts the rules are applied correctly, but when it edits src/api/v2/orders.ts or src/api/billing/refunds.ts the conventions are silently ignored. Running /memory during those sessions does not list the rule file.", "scenario_ja": "未知のコードベースを調査している開発者が、チームのエラーハンドリング形式を Claude に守らせるため、フロントマターに paths: [\"src/api/*.ts\"] を指定した .claude/rules/api-conventions.md を追加した。Claude が src/api/users.ts を編集するときは規約が正しく適用されるが、src/api/v2/orders.ts や src/api/billing/refunds.ts を編集するときは黙って無視される。それらのセッションで /memory を実行しても、そのルールファイルは一覧に現れない。", "question": "What is the root cause of the rule not being applied to the nested API files?", "question_ja": "ネストされた API ファイルにルールが適用されない根本原因は何か。", "choices": {"A": "Path-scoped rules are evaluated only once at session start, so files opened later in the session never trigger them.", "B": "Rules stored directly in .claude/rules/ apply only to the project root; nested directories require their own rules subdirectory.", "C": "A single * matches within one path segment only, so the glob must be src/api/**/*.ts to reach files in subdirectories.", "D": "The paths field accepts only one directory prefix per rule file, so nested paths must be listed in a directory-level CLAUDE.md."}, "choices_ja": {"A": "パススコープのルールはセッション開始時に一度だけ評価されるため、セッション途中で開いたファイルではトリガーされない。", "B": "`.claude/rules/` 直下に置いたルールはプロジェクトルートにしか適用されず、ネストしたディレクトリには専用の rules サブディレクトリが必要。", "C": "`*` 1つは1つのパスセグメント内しかマッチしないため、サブディレクトリのファイルに届かせるにはグロブを `src/api/**/*.ts` にする必要がある。", "D": "`paths` はルールファイルごとに1つのディレクトリ接頭辞しか受け付けないため、ネストしたパスはディレクトリ単位の CLAUDE.md に書く必要がある。"}, "answer": "C", "explanation_ja": "C が正解。公式のグロブ表では `src/**/*` が「src 配下のすべてのファイル」、`src/components/*.tsx` が「特定ディレクトリ直下の React コンポーネント」とされており、単一の `*` は1階層分しかマッチしない。再帰的に一致させるには `**` が必要。A は誤り。ドキュメントは、パススコープのルールは一致するファイルを Claude が読んだときにトリガーされる（セッション中に遅延ロードされる）と明記しており、InstructionsLoaded フックもセッション中の遅延ロードで発火する。B は誤り。`.claude/rules/` 配下の .md は再帰的に探索され、frontend/ などのサブディレクトリに整理してもよい。適用範囲を決めるのはファイルの置き場所ではなく `paths` のグロブ。D は誤り。`paths` は複数パターンを列挙でき、ブレース展開で複数拡張子も一度に指定できる。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q010", "statement_id": "D3-3", "angle": "find-error", "scenario_ref": 5, "scenario": "A CI team wants Claude Code's automated review job to enforce strict assertion conventions whenever it touches test files, which are scattered across dozens of packages. An engineer implements this by adding a YAML frontmatter block with paths: [\"**/*.test.ts\", \"**/*.spec.ts\"] to the top of the repository's root CLAUDE.md, directly above the existing test conventions section. In CI runs, the conventions are applied to every reviewed file regardless of type.", "scenario_ja": "ある CI チームは、Claude Code の自動レビュージョブがテストファイルに触れるときは常に厳格なアサーション規約を強制させたいと考えている。テストファイルは数十のパッケージに散在している。あるエンジニアは、リポジトリのルート CLAUDE.md の先頭、既存のテスト規約セクションの直上に paths: [\"**/*.test.ts\", \"**/*.spec.ts\"] という YAML フロントマターブロックを追加して、これを実現しようとした。CI の実行では、ファイル種別に関係なくすべてのレビュー対象ファイルに規約が適用されている。", "question": "What is wrong with this implementation?", "question_ja": "この実装のどこが誤っているか。", "choices": {"A": "The paths field is honored only in .claude/rules/*.md files; in CLAUDE.md it is inert, so the section keeps loading unconditionally.", "B": "The paths field is honored in CLAUDE.md only when the file lives at ./.claude/CLAUDE.md rather than at the repository root.", "C": "The patterns are correct but frontmatter must be placed below the first markdown header for Claude Code to parse it.", "D": "Path scoping is disabled in headless CI runs, so the frontmatter must be re-supplied through the --append-system-prompt flag."}, "choices_ja": {"A": "`paths` フィールドが有効なのは `.claude/rules/*.md` だけで、CLAUDE.md では無視されるため、そのセクションは無条件にロードされ続ける。", "B": "`paths` が CLAUDE.md で有効になるのは、そのファイルがリポジトリルートではなく ./.claude/CLAUDE.md にある場合だけ。", "C": "パターン自体は正しいが、Claude Code に解析させるにはフロントマターを最初の markdown 見出しより下に置く必要がある。", "D": "ヘッドレスの CI 実行ではパススコープが無効化されるため、フロントマターを --append-system-prompt フラグで渡し直す必要がある。"}, "answer": "A", "explanation_ja": "A が正解。条件付きロードは `.claude/rules/` に置いたルールファイルの `paths` フロントマターでのみ提供される機能で、CLAUDE.md にはこの仕組みがない。CLAUDE.md はロード対象になれば全文がコンテキストに入る。正しい修正は、テスト規約を `.claude/rules/testing.md` に切り出して `paths` を付けること。これは複数ディレクトリにまたがる（散在した）規約に対して、ディレクトリ単位の CLAUDE.md より優れている理由でもある。B は誤り。`./CLAUDE.md` と `./.claude/CLAUDE.md` はどちらもプロジェクト指示の置き場所として等価で、どちらも `paths` を解釈しない。C は誤り。YAML フロントマターはファイル先頭に置くものであり、位置の問題ではない。D は誤り。パススコープの有無は実行モードによって切り替わるものではなく、--append-system-prompt はシステムプロンプトへの追記用で条件付きロードとは無関係。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q011", "statement_id": "D3-3", "angle": "tradeoff", "scenario_ref": 2, "scenario": "A team maintains two kinds of shared knowledge for Claude Code. The first is a short set of naming and assertion conventions that must be respected any time a test file anywhere in the repo is written or modified. The second is a 12-step release procedure that is executed roughly twice a month and is irrelevant the rest of the time. Both currently sit in the root CLAUDE.md, and the team wants to minimize per-session token cost without losing reliability.", "scenario_ja": "あるチームは Claude Code 向けの共有知識を2種類保守している。1つ目は、リポジトリ内のどこであれテストファイルを書く・変更するときには必ず守るべき、短い命名規約とアサーション規約。2つ目は月に2回ほど実行され、それ以外の期間は無関係な12ステップのリリース手順。どちらも現在はルート CLAUDE.md にあり、チームは信頼性を損なわずにセッションあたりのトークンコストを最小化したい。", "question": "Given these constraints, how should the two items be placed?", "question_ja": "これらの制約のもとで、2つの項目をどう配置すべきか。", "choices": {"A": "Put both in .claude/rules/ files, giving the test conventions a paths glob and the release procedure no paths field so it is always available.", "B": "Put both in skills so neither consumes startup context, and let Claude decide when each becomes relevant to the prompt.", "C": "Put the test conventions in a CLAUDE.md inside each package's tests directory, and keep the release procedure in the root CLAUDE.md.", "D": "Put the test conventions in a .claude/rules/ file with a paths glob for test files, and move the release procedure into a skill."}, "choices_ja": {"A": "両方を `.claude/rules/` のファイルに置き、テスト規約には paths グロブを付け、リリース手順には paths を付けずに常時利用可能にする。", "B": "両方をスキルにして起動時コンテキストを消費させず、どちらがプロンプトに関連するかは Claude に判断させる。", "C": "テスト規約は各パッケージの tests ディレクトリ内の CLAUDE.md に置き、リリース手順はルート CLAUDE.md に残す。", "D": "テスト規約はテストファイル向けの paths グロブを付けた `.claude/rules/` のファイルに置き、リリース手順はスキルへ移す。"}, "answer": "D", "explanation_ja": "D が正解。公式ドキュメントは、常時コンテキストに置く必要のないタスク固有の指示はスキルへ、ファイル種別やパスに紐づく規約は `.claude/rules/` の path-scoped rule へ、と切り分けている。リリース手順のような複数ステップの手続きはまさにスキル向き、散在するテストファイルの規約はまさに paths グロブ向き。A は誤り。`paths` なしのルールは起動時に無条件ロードされるため、月2回しか使わない12ステップの手順が毎セッションのトークンを食う。B は誤り。テスト規約はテストファイルに触れたら必ず適用されてほしい性質のもので、プロンプトからの関連性判断に依存させると取りこぼす。paths グロブなら一致ファイルを読んだ時点で確実にロードされる。C は誤り。テストファイルが多数のパッケージに散在する場合、ディレクトリ単位の CLAUDE.md は同じ内容の重複コピーを大量に生み保守が破綻する。複数ディレクトリにまたがる規約こそ path-scoped rule の利点が出る場面。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q012", "statement_id": "D3-3", "angle": "design-choice", "scenario_ref": 4, "scenario": "A developer works across a dozen client repositories, generating boilerplate and exploring unfamiliar code. They want Claude to follow their own personal SQL formatting preferences whenever it touches any .sql file in any of those repositories. The client repos are not theirs to modify, and they must not add files that would show up in the clients' version control.", "scenario_ja": "ある開発者は十数個のクライアントリポジトリを横断して作業し、ボイラープレート生成や未知のコードの調査を行っている。どのリポジトリであっても .sql ファイルに触れる際には、自分個人の SQL フォーマット設定に Claude が従ってほしい。クライアントのリポジトリは自由に変更できるものではなく、クライアントのバージョン管理に現れるファイルを追加してはならない。", "question": "What is the most appropriate way to configure this?", "question_ja": "これを設定する最も適切な方法はどれか。", "choices": {"A": "Add the preferences to ~/.claude/CLAUDE.md, since user-level instructions already apply to every project on the machine.", "B": "Create ~/.claude/rules/sql-style.md with paths: [\"**/*.sql\"] in its frontmatter, so it applies in every project only for SQL files.", "C": "Create a CLAUDE.local.md with the preferences in each client repo and add it to that repo's .gitignore file.", "D": "Create the rule once and launch with --add-dir pointing at the shared rules folder in the developer's home directory."}, "choices_ja": {"A": "設定を ~/.claude/CLAUDE.md に追加する。ユーザーレベルの指示はマシン上のすべてのプロジェクトに適用されるため。", "B": "フロントマターに paths: [\"**/*.sql\"] を書いた ~/.claude/rules/sql-style.md を作成し、全プロジェクトで SQL ファイルのときだけ適用されるようにする。", "C": "各クライアントリポジトリに設定を書いた CLAUDE.local.md を作り、そのリポジトリの .gitignore に追加する。", "D": "ルールを1つ作り、開発者のホームディレクトリの共有ルールフォルダを --add-dir で指定して起動する。"}, "answer": "B", "explanation_ja": "B が正解。`~/.claude/rules/` に置いた個人ルールはマシン上のすべてのプロジェクトに適用され、`paths` グロブを付ければ .sql ファイルに触れたときだけロードされる。クライアントのリポジトリには一切ファイルを追加しない。A は誤り。`~/.claude/CLAUDE.md` は全プロジェクトに適用されるが無条件に全文ロードされるため、SQL に触れないセッションでも毎回トークンを消費する（条件付きロードにならない）。C は誤り。目的は達成できるが、十数個のリポジトリそれぞれに同じ内容を複製して .gitignore まで編集することになり保守が破綻する上、クライアントのリポジトリに手を入れないという制約にも反する。D は誤り。--add-dir は追加ディレクトリへのアクセスを与えるものであり、既定ではそこの CLAUDE.md やルールはロードされない（CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD が別途必要）。個人設定の配布手段としては迂遠で、毎回フラグを渡す必要もある。", "source": "https://code.claude.com/docs/en/memory", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q013", "statement_id": "D3-4", "angle": "design-choice", "scenario_ref": 2, "scenario": "A developer is halfway through a multi-file refactor in a Claude Code session running in default mode, with several edits already applied and a lot of useful conversation state built up. A teammate asks how the service's retry logic is wired, which requires searching dozens of files that are unrelated to the refactor. The developer wants that answer without polluting the refactor session or losing its context.", "scenario_ja": "ある開発者が、default モードで動く Claude Code セッションで複数ファイルにまたがるリファクタリングの途中にあり、いくつかの編集はすでに適用され、有用な会話の状態も積み上がっている。同僚から、そのサービスのリトライ処理がどう組まれているか尋ねられたが、それを調べるにはリファクタリングとは無関係な数十のファイルを検索する必要がある。開発者は、リファクタリングのセッションを汚したり、その文脈を失ったりせずに答えを得たい。", "question": "What is the most appropriate way to handle the discovery work in this session?", "question_ja": "このセッションで探索作業を扱う方法として最も適切なものはどれか。", "choices": {"A": "Switch the session to plan mode with Shift+Tab so the retry-logic search runs read-only, then switch back to default mode to resume the refactor.", "B": "Ask Claude to use the Explore subagent for the retry-logic search, so the read-only discovery runs in its own context window and only the summary returns.", "C": "Run /clear to reset context, do the retry-logic search in the clean session, then re-describe the refactor and continue where it left off.", "D": "Restart with --permission-mode bypassPermissions so the many search commands run without prompts, then continue the refactor in the same session."}, "choices_ja": {"A": "Shift+Tab でセッションを plan モードに切り替えてリトライ処理の調査を読み取り専用で行い、その後 default モードに戻してリファクタリングを再開する。", "B": "リトライ処理の調査に Explore サブエージェントを使うよう Claude に指示し、読み取り専用の探索を独立したコンテキストウィンドウで実行させて要約だけを返させる。", "C": "/clear でコンテキストをリセットし、きれいなセッションで調査を行い、その後リファクタリングを説明し直して続きから進める。", "D": "--permission-mode bypassPermissions で起動し直し、多数の検索コマンドを確認なしで実行させてから、同じセッションでリファクタリングを続ける。"}, "answer": "B", "explanation_ja": "B が正解。公式ドキュメントは、本筋の会話を検索結果やファイル内容で埋め尽くしてしまう副次的な作業にはサブエージェントを使うべきだとし、組み込みの Explore は読み取り専用でコードベース探索に最適化され、探索結果を main の会話コンテキストの外に置くと明記している。返るのは要約だけなので、リファクタリングの文脈を保ったまま質問に答えられる。A は誤り。plan モードは調査自体は行えるが、探索出力はやはり main のコンテキストに積み上がるうえ、モードを往復させても文脈の圧迫は解決しない（plan モードの主目的は編集前の安全な検討であり、コンテキスト隔離ではない）。C は誤り。/clear は無関係タスク間のリセットには有効だが、ここでは進行中のリファクタリングの会話状態を捨ててしまい、開発者の要件（文脈を失わない）に真っ向から反する。D は誤り。bypassPermissions は権限確認を省くだけでコンテキスト消費は一切減らず、隔離コンテナ以外での使用は推奨されない。", "source": "https://code.claude.com/docs/en/sub-agents", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q014", "statement_id": "D3-4", "angle": "troubleshoot", "scenario_ref": 4, "scenario": "A platform team standardizes Claude Code for engineers exploring an unfamiliar monolith, and ships a shared environment file to every workstation. Engineers report that since the rollout, plan-mode sessions on large repositories run out of context long before a plan is produced: raw grep output and full file contents now accumulate directly in the main transcript, and Claude starts forgetting earlier findings. The same repositories planned fine the previous week.", "scenario_ja": "あるプラットフォームチームが、不慣れなモノリスを探索するエンジニア向けに Claude Code を標準化し、共有の環境設定ファイルを全ワークステーションへ配布した。展開以降、大規模リポジトリでの plan モードのセッションが、計画が出来上がるはるか手前でコンテキストを使い果たすとエンジニアから報告されている。生の grep 出力やファイル全文が main のトランスクリプトに直接蓄積されるようになり、Claude は以前の発見を忘れ始める。同じリポジトリは前週までは問題なく計画できていた。", "question": "What is the most likely root cause of the regression?", "question_ja": "この退行の根本原因として最も可能性が高いものはどれか。", "choices": {"A": "The shared environment file sets defaultMode to plan, and plan mode keeps every read in the main transcript because it cannot write scratch files.", "B": "The rolled-out settings added broad Bash allow rules, so exploration commands now run without prompts and produce far more output per turn.", "C": "The shared environment file sets CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS=1, so Claude reads and searches directly instead of delegating research to the Plan subagent.", "D": "The rollout pinned a cheaper model, and plan mode falls back to inlining full file contents when the session model is below the Opus tier."}, "choices_ja": {"A": "共有の環境設定ファイルが defaultMode を plan にしており、plan モードは一時ファイルを書けないため、すべての読み取りが main のトランスクリプトに残るから。", "B": "配布された設定が広範な Bash の allow ルールを追加したため、探索コマンドが確認なしで実行され、1ターンあたりの出力が大幅に増えたから。", "C": "共有の環境設定ファイルが CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS=1 を設定しており、Claude が Plan サブエージェントに調査を委譲せず、自分で直接読み取り・検索するから。", "D": "展開時により安価なモデルに固定され、セッションのモデルが Opus 相当未満のとき plan モードはファイル全文の展開に切り替わるから。"}, "answer": "C", "explanation_ja": "C が正解。公式ドキュメントは、plan モードで Claude がコードベースを理解する必要があるとき、探索出力が別のコンテキストウィンドウに留まるよう Plan サブエージェントへ調査を委譲すると説明している。そして CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS=1 を設定すると組み込みの Explore と Plan が取り除かれ、Claude は委譲せずに自分でファイルを読んで探索する。まさに「生の出力が main に溜まる」という症状と一致し、配布物の変更というタイミングとも合う。A は誤り。plan モードのコンテキスト効率は一時ファイルの有無ではなくサブエージェントへの委譲によるもので、defaultMode: plan 自体はこの症状を生まない。B は誤り。allow ルールは確認プロンプトの有無を変えるだけで、委譲が生きていれば探索出力はサブエージェント側のコンテキストに入る。D は誤り。plan モードにモデル階層に応じて全文展開へ切り替わるような挙動は文書化されていない（Explore のモデル継承と Opus 上限は別の話）。", "source": "https://code.claude.com/docs/en/sub-agents", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q015", "statement_id": "D3-4", "angle": "find-error", "scenario_ref": 2, "scenario": "A team writes an internal runbook for large refactors with Claude Code. It reads: (1) start the session with `claude --permission-mode plan`; (2) have Claude read the affected modules and answer questions; (3) ask for a detailed implementation plan and review it, pressing Ctrl+G to edit the plan text if needed; (4) because approving a plan leaves the session read-only, exit and relaunch with `--dangerously-skip-permissions` to actually apply the changes.", "scenario_ja": "あるチームが、Claude Code での大規模リファクタリング用に社内ランブックを作成した。内容は次のとおり。(1) `claude --permission-mode plan` でセッションを開始する、(2) 影響を受けるモジュールを Claude に読ませて質問に答えさせる、(3) 詳細な実装計画を作らせてレビューし、必要なら Ctrl+G で計画本文を編集する、(4) 計画を承認してもセッションは読み取り専用のままなので、いったん終了し `--dangerously-skip-permissions` で起動し直して実際に変更を適用する。", "question": "Which step of the runbook is wrong and should be corrected?", "question_ja": "このランブックのうち誤っていて修正すべきステップはどれか。", "choices": {"A": "Step 1: plan mode cannot be selected at startup, so the runbook must instead cycle to it with Shift+Tab after the session opens.", "B": "Step 2: plan mode denies file reads as well as edits, so the modules must be pasted into the prompt instead of being read by Claude.", "C": "Step 3: a proposed plan cannot be edited by the user, so the runbook should tell Claude the corrections in a follow-up message instead.", "D": "Step 4: approving a plan already exits plan mode into the permission mode the chosen approve option describes, so relaunching with bypassPermissions is both unnecessary and unsafe."}, "choices_ja": {"A": "ステップ1。plan モードは起動時に選択できないため、セッションを開いた後に Shift+Tab で巡回して切り替える必要がある。", "B": "ステップ2。plan モードは編集だけでなくファイル読み取りも拒否するため、モジュールは Claude に読ませずプロンプトへ貼り付ける必要がある。", "C": "ステップ3。提示された計画をユーザーが編集することはできないため、後続のメッセージで修正内容を Claude に伝えるべきである。", "D": "ステップ4。計画を承認した時点で plan モードは終了し、選んだ承認オプションが示す権限モードに切り替わるため、bypassPermissions での起動し直しは不要かつ危険である。"}, "answer": "D", "explanation_ja": "D が正解。公式ドキュメントは、計画を承認すると plan モードを抜け、各承認オプションが示す権限モード（auto で開始・編集を自動承認・1件ずつ手動確認）にセッションが切り替わり、Claude が編集を始めると明記している。読み取り専用のままではないので再起動は不要で、しかも bypassPermissions はプロンプトインジェクションや意図しない操作に対する保護がなく、隔離環境以外では使うべきでない。A は誤り。`claude --permission-mode plan` は文書化された起動方法である。B は誤り。plan モードは読み取りと探索用シェルコマンドを許可し、ソースを編集しないだけである。C は誤り。Ctrl+G で提示された計画をエディタで直接編集できる、と明記されている。", "source": "https://code.claude.com/docs/en/permission-modes", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q016", "statement_id": "D3-4", "angle": "tradeoff", "scenario_ref": 5, "scenario": "A CI job runs Claude Code non-interactively on every pull request to review the diff and generate missing tests. Because an early run modified files nobody expected, an engineer proposes locking the job down. There is no human at the terminal during the run, and the pipeline must fail fast rather than hang, while still letting Claude run the repository's test command and read source files.", "scenario_ja": "あるCIジョブが、プルリクエストごとに Claude Code を非対話で実行し、差分をレビューして不足しているテストを生成している。初期の実行で誰も想定していなかったファイルが変更されたため、あるエンジニアがジョブの締め付けを提案した。実行中にターミナルの前に人はおらず、パイプラインはハングせず即座に失敗する必要がある一方、Claude にはリポジトリのテストコマンドの実行とソースファイルの読み取りは許可しなければならない。", "question": "Which configuration best fits these constraints?", "question_ja": "これらの制約に最も適合する構成はどれか。", "choices": {"A": "Run with `-p --permission-mode dontAsk` and pre-approve exactly the tools the job needs, such as the test command, via permissions.allow rules.", "B": "Run with `-p --permission-mode plan` so Claude can only read and propose, and have a later pipeline stage apply the plan it produced.", "C": "Run with `-p --permission-mode acceptEdits` so edits inside the workspace are applied automatically and everything else raises a prompt.", "D": "Run with `-p --permission-mode auto` so the background classifier reviews each command and blocks anything beyond the review task."}, "choices_ja": {"A": "`-p --permission-mode dontAsk` で実行し、テストコマンドなどジョブに必要なツールだけを permissions.allow ルールで事前承認する。", "B": "`-p --permission-mode plan` で実行して Claude を読み取りと提案のみに限定し、生成された計画は後段のパイプラインステージで適用する。", "C": "`-p --permission-mode acceptEdits` で実行し、ワークスペース内の編集は自動適用、それ以外は確認プロンプトを出させる。", "D": "`-p --permission-mode auto` で実行し、バックグラウンドの分類器に各コマンドを審査させ、レビュー作業の範囲を超えるものを遮断させる。"}, "answer": "A", "explanation_ja": "A が正解。dontAsk モードは本来プロンプトになる呼び出しをすべて自動拒否し、permissions.allow に一致する操作と読み取り専用の Bash コマンドだけが実行できる。公式ドキュメントはこれを、Claude に許すことを事前に定義する CI や制限環境向けの完全非対話モードとして位置づけており、「人がいない」「ハングさせない」「テスト実行と読み取りは許す」という制約に正確に合致する。B は誤り。plan モードの価値は編集前に人間がレビューして承認する点にあり、承認者のいない CI では計画が承認されず、しかも「計画を後段で適用する」ための機構は plan モードには存在しない。C は誤り。acceptEdits はワークスペース内の編集を自動承認してしまい、まさに問題となった意図しないファイル変更を防げない。D は誤り。auto モードは分類器の判断に依存し、非対話モードでは遮断が繰り返されるとセッションが中断されるうえ、事前定義した許可集合ほど決定的ではない。", "source": "https://code.claude.com/docs/en/permission-modes", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q017", "statement_id": "D3-4", "angle": "design-choice", "scenario_ref": 4, "scenario": "An engineer joins a team and must ship two things on day one in an unfamiliar service: add a missing `--verbose` flag to an existing CLI entry point, which is a one-line change they can already describe exactly, and design how a new caching layer should be threaded through the request path, which touches several modules they have never read.", "scenario_ja": "あるエンジニアがチームに加わり、不慣れなサービスで初日に2件を仕上げなければならない。1つは既存の CLI エントリポイントに不足している `--verbose` フラグを追加することで、これは変更内容をすでに正確に説明できる1行の修正である。もう1つは新しいキャッシュ層をリクエスト経路にどう通すかの設計で、これは一度も読んだことのない複数のモジュールに及ぶ。", "question": "How should the engineer sequence plan mode and direct execution across these two tasks?", "question_ja": "このエンジニアは2つのタスクに対して plan モードと直接実行をどう使い分けるべきか。", "choices": {"A": "Use plan mode for both tasks so every change is reviewed before it is applied, keeping a uniform workflow while the engineer is new to the service.", "B": "Use direct execution for both tasks and rely on git diff plus the test suite afterwards, since reviewing the resulting diff catches the same problems a plan would.", "C": "Ask for the flag directly since the diff fits in one sentence, and use plan mode for the caching layer, then approve the plan and let Claude implement it.", "D": "Use plan mode for the flag because the engineer is unfamiliar with the CLI code, and direct execution for the caching layer so Claude can explore while it edits."}, "choices_ja": {"A": "サービスに不慣れなうちは統一されたワークフローを保つため、両方のタスクで plan モードを使い、すべての変更を適用前にレビューする。", "B": "両方のタスクを直接実行し、後から git diff とテストスイートで確認する。結果の差分をレビューすれば計画と同じ問題を検出できるため。", "C": "フラグ追加は差分を一文で説明できるので直接依頼し、キャッシュ層には plan モードを使い、計画を承認してから Claude に実装させる。", "D": "エンジニアが CLI のコードに不慣れなのでフラグ追加に plan モードを使い、キャッシュ層は Claude が編集しながら探索できるよう直接実行する。"}, "answer": "C", "explanation_ja": "C が正解。公式ドキュメントは、plan モードは有用だがオーバーヘッドも伴うとし、スコープが明確で修正が小さい場合（タイプミス修正、ログ行の追加、変数名の変更など）は直接依頼すべきで、「差分を一文で説明できるなら計画は省略する」と述べている。逆に、アプローチが不確かなとき、複数ファイルに及ぶとき、対象コードに不慣れなときこそ計画が最も有効であり、承認後は plan モードを抜けて実装に移る流れが推奨されている。A は誤り。1行のフラグ追加にまで計画を挟むのは明示的に不要とされたオーバーヘッドである。B は誤り。キャッシュ層は複数モジュールに及び未読のコードを含むため、間違った問題を解いた差分を後から直す手戻りが大きい。D は割り当てが逆で、小さく明確な変更に計画を課し、最も計画が必要な設計作業を無計画に走らせている。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q018", "statement_id": "D3-5", "angle": "design-choice", "scenario_ref": 5, "scenario": "A team integrates Claude Code into CI to implement small backlog tickets automatically. Today a developer describes a rate-limiting middleware in prose, Claude implements it, and the developer reviews the diff by hand and sends prose corrections until it looks right, which takes four or five rounds per ticket.", "scenario_ja": "あるチームが、小さなバックログのチケットを自動実装させるために Claude Code を CI に統合している。現在は開発者がレート制限ミドルウェアを散文で説明し、Claude が実装し、開発者が差分を手作業でレビューして散文の修正指示を送る、というやり取りをチケットあたり4〜5往復繰り返している。", "question": "Which change to the workflow will most reliably reduce the number of human review rounds per ticket?", "question_ja": "チケットあたりの人手レビューの往復回数を最も確実に減らすには、ワークフローをどう変えるべきか。", "choices": {"A": "Move the ticket description into CLAUDE.md before each run so Claude keeps the requirements in context for the whole session.", "B": "Ask Claude to re-read its own diff and self-review it for correctness before the developer looks at the pull request.", "C": "Write a test suite first covering expected behavior, edge cases, and limits, then have Claude implement and iterate on the test failures.", "D": "Raise the model tier used in the CI job and re-run the same prose ticket description when the first attempt is rejected."}, "choices_ja": {"A": "実行のたびにチケットの説明を CLAUDE.md に移し、セッション全体で要件がコンテキストに残るようにする。", "B": "開発者がプルリクエストを見る前に、Claude 自身に差分を読み直させて正しさをセルフレビューさせる。", "C": "期待挙動・エッジケース・上限値を網羅するテストスイートを先に書き、Claude に実装させてテスト失敗を手がかりに反復させる。", "D": "CI ジョブで使うモデルのティアを上げ、最初の試行が却下されたら同じ散文のチケット説明で再実行する。"}, "answer": "C", "explanation_ja": "C が正解。公式のベストプラクティスは「Claude 自身が実行できる検証手段（テスト・ビルド・リンタ）を与えよ」と明言しており、合否のシグナルがあれば Claude が実装→検証→修正のループを自分で閉じられる。人間が検証ループの一部でなくなるため往復が減る。テストを先に書き、失敗内容を共有して反復するのが test-driven iteration。A は誤り。CLAUDE.md は毎セッション読み込まれる恒久的な文脈のための場所で、広く当てはまる事項だけを短く書くべきとされる。個別チケットの要件を入れても曖昧さは解消せず、肥大化した CLAUDE.md はむしろ指示が無視される原因になる。B は誤り。実装した本人（同一コンテキスト）に採点させる形になり、公式も検証は別コンテキストのサブエージェントや決定的なチェックに委ねるべきとしている。自己申告の「成功」ではなくテスト出力という証拠が必要。D は誤り。曖昧な散文という入力側の問題を放置したままモデルを強くしても解釈のばらつきは残り、コストだけが増える。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q019", "statement_id": "D3-5", "angle": "troubleshoot", "scenario_ref": 2, "scenario": "A developer has been in one Claude Code session for two hours refactoring a payment module. Claude keeps reintroducing a deprecated helper the developer has already told it three times to stop using, and its recent edits have started touching files unrelated to the refactor.", "scenario_ja": "ある開発者が、決済モジュールのリファクタリングのために2時間ひとつの Claude Code セッションを続けている。すでに3回「使うな」と伝えた非推奨のヘルパーを Claude が繰り返し復活させ、最近の編集ではリファクタと無関係なファイルにまで手を入れ始めた。", "question": "What is the most likely root cause of this behavior, and the appropriate response?", "question_ja": "この挙動の根本原因として最も可能性が高いのはどれか、またその適切な対処は何か。", "choices": {"A": "The deprecated helper is still imported somewhere, so Claude infers it is current; delete the import and continue in the same session.", "B": "The context is cluttered with failed approaches and corrections; run /clear and restart with a specific prompt incorporating what was learned.", "C": "The session lacks a subagent for the refactor; delegate the remaining work to a specialized refactoring subagent from the same conversation.", "D": "Auto-compaction has discarded the original instruction; run /compact with instructions to preserve the ban on the deprecated helper."}, "choices_ja": {"A": "非推奨ヘルパーがどこかでまだ import されているため Claude が現行と判断している。その import を削除し、同じセッションを続ける。", "B": "失敗した試行と訂正でコンテキストが散らかっている。/clear して、学んだ内容を織り込んだ具体的なプロンプトで始め直す。", "C": "セッションにリファクタ用のサブエージェントがない。同じ会話から専門のリファクタ用サブエージェントに残作業を委譲する。", "D": "自動コンパクションが元の指示を捨ててしまった。非推奨ヘルパー禁止を保持するよう指示付きで /compact を実行する。"}, "answer": "B", "explanation_ja": "B が正解。公式ベストプラクティスは「同じ問題で2回以上訂正したなら、コンテキストが失敗した試行で散らかっている。/clear して、学んだことを取り込んだより具体的なプロンプトで始め直せ」と明示している。訂正が積み上がった長いセッションより、クリーンなセッション＋改善したプロンプトのほうがほぼ常に上回る。A は誤り。3回訂正しても直らない事象を単一の import のせいにするのは飛躍で、無関係ファイルへの波及という症状も説明できない。同じセッションを続ける点も問題の根（コンテキスト汚染）を残す。C は誤り。サブエージェントは調査や検証を別コンテキストで行わせて本体の文脈を汚さないための手段であり、すでに汚れた会話から委譲しても親の混乱した前提を引き継ぐだけ。D は誤り。自動コンパクションはコードパターンや重要な決定を保持する要約であり、指示の消失を第一容疑にするのは根拠が薄い。", "source": "https://code.claude.com/docs/en/best-practices", "pack": "v2", "created": "2026-08-21"}, {"id": "D3-q020", "statement_id": "D3-5", "angle": "find-error", "scenario_ref": 2, "scenario": "A reviewer finds four defects in a Claude-generated caching layer: the cache key omits the tenant id, the TTL is read from the wrong config block, eviction runs before the write completes, and the metrics counter is incremented on both hit and miss. The key format, the TTL source, and the eviction ordering all determine each other. The engineer's plan is to open one session and send the four defects as four separate prompts, one per turn, re-running the test suite between each.", "scenario_ja": "レビュワーが、Claude の生成したキャッシュ層に4つの欠陥を見つけた。キャッシュキーにテナントIDが入っていない、TTL を誤った設定ブロックから読んでいる、書き込み完了前に eviction が走る、メトリクスのカウンタがヒット時にもミス時にも加算される、の4点である。キー形式・TTL の取得元・eviction の順序は互いに依存し合っている。エンジニアの計画は、1セッションを開き、4つの欠陥を1ターンにつき1つずつ計4回のプロンプトで送り、その都度テストスイートを再実行するというものだ。", "question": "What is the flaw in this iteration plan?", "question_ja": "この反復計画の欠陥はどこか。", "choices": {"A": "The test suite should be run only once at the end, since re-running it between every fix wastes context on repeated output.", "B": "Each defect should be handed to its own subagent so the four fixes can be produced in parallel and merged afterwards.", "C": "The four defects should be fixed in a fresh session each, because carrying earlier fixes forward biases Claude toward its own code.", "D": "The three interacting defects should be described together in one detailed message; only the independent metrics defect suits a separate turn."}, "choices_ja": {"A": "テストスイートは最後に一度だけ実行すべきで、修正のたびに再実行すると出力の繰り返しでコンテキストを浪費する。", "B": "4つの欠陥はそれぞれ別のサブエージェントに渡し、4つの修正を並列に作らせてあとで統合すべきである。", "C": "4つの欠陥はそれぞれ新しいセッションで直すべきで、前の修正を引き継ぐと Claude が自分の書いたコードに引きずられる。", "D": "相互に依存する3つの欠陥は1通の詳細なメッセージにまとめて伝えるべきで、独立しているメトリクスの欠陥だけを別ターンに回すのが適切。"}, "answer": "D", "explanation_ja": "D が正解。相互に作用する問題は、Claude が全体の制約を同時に見て整合的な設計を出せるよう、1通の詳細なメッセージにまとめて渡す。キー形式・TTL 取得元・eviction 順序を順番に直すと、後の修正が前の修正の前提を壊し、収束しない往復が生まれる。独立している欠陥（メトリクス加算）は逐次でよい。A は誤り。検証は各反復で回して合否のシグナルを得るのが目的であり、最後まで回さなければ Claude 自身が修正の成否を確認できない。B は誤り。並列サブエージェントは独立した作業に向く手法で、互いに依存する3件を別々に直させれば統合時に矛盾する実装がぶつかる。C は誤り。フレ
